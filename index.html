ject.fromEntries(BANK.map(q => [q.id, q]));\nconst LET = \"ABCDE\";\nfunction shuffle(a, rnd){ rnd = rnd || Math.random; a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }\nfunction mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nfunction fmt(ms){ ms = Math.max(0, Math.round(ms/1000)); const h=Math.floor(ms/3600), m=Math.floor(ms%3600/60), s=ms%60; return (h? h+\":\"+String(m).padStart(2,\"0\") : m) + \":\" + String(s).padStart(2,\"0\"); }\nfunction pct(a,b){ return b ? Math.round(a*100/b) : 0; }\nfunction ymd(d){ return d.getFullYear()+\"-\"+String(d.getMonth()+1).padStart(2,\"0\")+\"-\"+String(d.getDate()).padStart(2,\"0\"); }\nfunction dayDiff(a, b){ const A=new Date(a+\"T00:00:00\"), B=new Date(b+\"T00:00:00\"); return Math.round((B-A)/86400000); }\nconst TARGET_SEC = 120*60/63; // 約 114 秒\n\n/* ---------- glossary ---------- */\nconst GLOSS = (function(){\n  const map = new Map();\n  CORE_VOCAB.forEach(([en, zh, c]) => { const k=en.toLowerCase(); if(!map.has(k)) map.set(k, {en, zh, cat:c, qids:[]}); });\n  BANK.forEach(q => (q.vocab||[]).forEach(v => {\n    const k = String(v.en).toLowerCase().trim(); if(!k) return;\n    if(!map.has(k)) map.set(k, {en:v.en, zh:v.zh, cat:\"D\"+q.domain, qids:[]});\n    const g = map.get(k); if(!g.qids.includes(q.id)) g.qids.push(q.id);\n  }));\n  // 為 core 字找例句出處\n  const all = BANK.map(q => [q.id, (q.stem_en+\" \"+q.options_en.join(\" \")).toLowerCase()]);\n  map.forEach((g, k) => { if(g.qids.length) return; const re = new RegExp(\"(^|[^a-z])\"+k.replace(/[.*+?^${}()|[\\]\\\\]/g,\"\\\\$&\"), \"i\"); for(const [id, t] of all){ if(re.test(t)){ g.qids.push(id); if(g.qids.length>=3) break; } } });\n  return map;\n})();\nconst GLOSS_RE = (function(){\n  const keys = [...GLOSS.keys()].sort((a,b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\").replace(/\\s+/g, \"\\\\s+\"));\n  return new RegExp(\"(?\u003c![A-Za-z])(\" + keys.join(\"|\") + \")(?:s|es|ed|d|ing)?(?![A-Za-z])\", \"gi\");\n})();\nconst QUAL_RE = /(?\u003c![A-Za-z])(BEST|MOST|FIRST|LEAST|PRIMARY|NOT|EXCEPT|ONLY|TWO|THREE)(?![A-Za-z])/gi;\nfunction glossLookup(w){\n  let k = w.toLowerCase().replace(/\\s+/g, \" \");\n  if(GLOSS.has(k)) return GLOSS.get(k);\n  for(const suf of [\"ing\",\"ed\",\"es\",\"s\",\"d\"]){ if(k.endsWith(suf)){ const b = k.slice(0, -suf.length); if(GLOSS.has(b)) return GLOSS.get(b); if(GLOSS.has(b+\"e\")) return GLOSS.get(b+\"e\"); } }\n  return null;\n}\n/* 把英文轉成 HTML：底線單字（點了看中文）、紫色限定詞、黃底關鍵句 */\nfunction renderText(text, o){\n  o = o || {};\n  text = String(text || \"\");\n  if(o.clue){\n    const k = text.indexOf(o.clue);\n    if(k >= 0){ const p = Object.assign({}, o, {clue:null}); return renderText(text.slice(0,k), p) + '\u003cmark class=\"clue\">' + renderText(o.clue, p) + '\u003c/mark>' + renderText(text.slice(k+o.clue.length), p); }\n  }\n  if(!o.vocab && !o.qual) return esc(text);\n  const hits = [];\n  if(o.vocab){ for(const m of text.matchAll(GLOSS_RE)){ const g = glossLookup(m[0]) || glossLookup(m[1]); if(g) hits.push([m.index, m.index+m[0].length, \"v\", g]); } }\n  if(o.qual){ for(const m of text.matchAll(QUAL_RE)){ const w=m[0]; const strong = w === w.toUpperCase() || /^(best|most|first|least|primary|except)$/i.test(w); if(strong) hits.push([m.index, m.index+w.length, \"q\"]); } }\n  hits.sort((a,b) => a[0]-b[0] || (b[1]-b[0])-(a[1]-a[0]));\n  let out = \"\", last = 0;\n  for(const h of hits){\n    if(h[0] \u003c last) continue;\n    out += esc(text.slice(last, h[0]));\n    const w = text.slice(h[0], h[1]);\n    if(h[2] === \"v\"){ const isQ = o.qual && /^(best|most|first|least|primary|except|most likely|most appropriate|most directly|most effective)$/i.test(w); out += '\u003cspan class=\"v'+(o.hl && o.hl===h[3].en.toLowerCase()?' hit':'')+'\" data-zh=\"'+esc(h[3].zh)+'\" data-en=\"'+esc(h[3].en)+'\">' + (isQ ? '\u003cb class=\"q\">'+esc(w)+'\u003c/b>' : esc(w)) + '\u003c/span>'; }\n    else out += '\u003cb class=\"q\">' + esc(w) + '\u003c/b>';\n    last = h[1];\n  }\n  return out + esc(text.slice(last));\n}\n\n/* ---------- 逐字翻譯＋拆句（QGLOSS；2026-11-13 peter-e8 加入） ----------\n   規則：學習模式、模考交卷後的解答、單字卡、讀題技巧頁：每個字滑過或點一下就出中文，拆句隨時可開，都不記錄。\n   練習／錯題重練（還沒送出答案時）：字要「點」才出中文，記為「查字」（同一題同一個字只算一次），不算看中文；按「拆句」算看中文。\n   送出答案後：全部開放、不記錄。模擬考作答中：全部沒有（正式考試沒有這些輔助）。\n   題目文字跟 QGLOSS 建立時不一樣（hash 對不上）就退回原本的單字底線，不會顯示錯位的翻譯。 */\nconst ART_TIP = {a:\"一個（冠詞，通常不用翻）\", an:\"一個（冠詞，通常不用翻）\", the:\"這個／那個（冠詞：指特定的那一個，通常不用翻）\"};\nlet tipEl = null;\nfunction fnv(s){ let h = 0x811c9dc5; for(let i = 0; i \u003c s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); }\nconst QG_CACHE = {};\nfunction qg(q){\n  if(!q || typeof QGLOSS === \"undefined\") return null;\n  if(q.id in QG_CACHE) return QG_CACHE[q.id];\n  const g = QGLOSS[q.id];\n  return (QG_CACHE[q.id] = g && g.h === fnv(q.stem_en + \"\\u0001\" + q.options_en.join(\"\\u0001\")) ? g : null);\n}\nfunction lookupCounted(){\n  if(view !== \"practice\" && view !== \"wrong\") return false;\n  const S = SESS[view];\n  return !!(S && S.i \u003c S.list.length && S.perm && !S.answered);\n}\nfunction noteLookup(el){\n  if(!lookupCounted()) return;\n  const S = SESS[view]; S.lk = S.lk || {};\n  const k = el.dataset.k || (\"v:\" + String(el.dataset.en || \"\").toLowerCase());\n  if(S.lk[k]) return;\n  S.lk[k] = 1; el.classList.add(\"lk\");\n  const c = document.getElementById(\"lkn\"); if(c) c.textContent = (S.lkTotal || 0) + Object.keys(S.lk).length;\n}\nfunction qualRanges(text){\n  const r = [];\n  for(const m of text.matchAll(QUAL_RE)){ const w = m[0]; if(w === w.toUpperCase() || /^(best|most|first|least|primary|except)$/i.test(w)) r.push([m.index, m.index + w.length]); }\n  return r;\n}\nfunction isHl(w, gl, hl){\n  const s = w.toLowerCase();\n  if(s === hl || (gl && gl.en.toLowerCase() === hl)) return true;\n  return new RegExp(\"(^|[^a-z])\" + hl.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\") + \"([^a-z]|$)\").test(s);\n}\n/* text：原文；toks：[[起, 迄, 中文, 詞性]]；o：{seg, from, to, clue:[起,迄], qual, hl} */\nfunction glossHTML(text, toks, o){\n  o = o || {};\n  const from = o.from || 0, to = o.to ?? text.length;\n  const qr = o.qual ? qualRanges(text) : [];\n  const cl = o.clue || null;\n  const S = (view === \"practice\" || view === \"wrong\") ? SESS[view] : null;\n  const lkSet = S && S.lk;\n  // 單字卡要標亮的字／片語在原文出現的範圍（片語可能跨好幾個字，例 most directly）\n  const hr = o.hl ? [...text.matchAll(new RegExp(\"(?\u003c![A-Za-z])\" + o.hl.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\").replace(/\\s+/g, \"\\\\s+\") + \"(?:s|es|ed|d|ing)?(?![A-Za-z])\", \"gi\"))].map(m => [m.index, m.index + m[0].length]) : [];\n  const inner = (a, b) => {\n    const cuts = new Set([a, b]);\n    if(cl) for(const x of cl) if(x > a && x \u003c b) cuts.add(x);\n    for(const r of qr) for(const x of r) if(x > a && x \u003c b) cuts.add(x);\n    const cs = [...cuts].sort((x, y) => x - y); let s = \"\";\n    for(let i = 0; i \u003c cs.length - 1; i++){\n      const x = cs[i], y = cs[i + 1]; let piece = esc(text.slice(x, y));\n      if(qr.some(r => x >= r[0] && y \u003c= r[1])) piece = '\u003cb class=\"q\">' + piece + '\u003c/b>';\n      if(cl && x >= cl[0] && y \u003c= cl[1]) piece = '\u003cmark class=\"clue\">' + piece + '\u003c/mark>';\n      s += piece;\n    }\n    return s;\n  };\n  const span = (a, b, zh, key) => {\n    const w = text.slice(a, b), gl = glossLookup(w), k = (o.seg || \"x\") + \":\" + key;\n    let cls = \"gw\";\n    if(gl) cls += \" vk\";\n    if(o.hl && (hr.some(r => a \u003c r[1] && b > r[0]) || isHl(w, gl, o.hl))) cls += \" hit\";\n    if(lkSet && lkSet[k]) cls += \" lk\";\n    return `\u003cspan class=\"${cls}\" data-k=\"${esc(k)}\" data-en=\"${esc(w)}\" data-zh=\"${esc(zh)}\">${inner(a, b)}\u003c/span>`;\n  };\n  let out = \"\", p = from;\n  const gap = (a, b) => {\n    if(b \u003c= a) return;\n    const seg = text.slice(a, b); let last = 0;\n    for(const m of seg.matchAll(/(?\u003c![A-Za-z0-9\\/\\-])(a|an|the)(?=\\s)/gi)){\n      out += inner(a + last, a + m.index);\n      out += span(a + m.index, a + m.index + m[0].length, ART_TIP[m[0].toLowerCase()], \"a\" + (a + m.index));\n      last = m.index + m[0].length;\n    }\n    out += inner(a + last, b);\n  };\n  const items = (toks || []).map((t, i) => [t[0], t[1], t[2] + \"〔\" + t[3] + \"〕\", \"k\" + i]).filter(t => t[0] >= from && t[1] \u003c= to).sort((x, y) => x[0] - y[0]);\n  for(const it of items){ if(it[0] \u003c p) continue; gap(p, it[0]); out += span(it[0], it[1], it[2], it[3]); p = it[1]; }\n  gap(p, to);\n  return '\u003cspan class=\"gq\">' + out + '\u003c/span>';\n}\nfunction stemHTML(q, helps, showAns){\n  const g = helps ? qg(q) : null;\n  if(!g || !g.sw) return renderText(q.stem_en, {vocab:helps, qual:helps, clue: showAns ? q.key_clue_en : null});\n  const k = showAns && q.key_clue_en ? q.stem_en.indexOf(q.key_clue_en) : -1;\n  return glossHTML(q.stem_en, g.sw, {seg:\"s\", qual:true, clue: k >= 0 ? [k, k + q.key_clue_en.length] : null});\n}\nfunction optHTML(q, oi, helps){\n  const g = helps ? qg(q) : null;\n  if(!g || !g.ow || !g.ow[oi] || !g.ow[oi].length) return renderText(q.options_en[oi], {vocab:helps});\n  return glossHTML(q.options_en[oi], g.ow[oi], {seg:\"o\" + oi});\n}\nfunction clueHTML(q){\n  const g = qg(q), k = q.stem_en.indexOf(q.key_clue_en);\n  if(!g || !g.sw || k \u003c 0) return esc(q.key_clue_en);\n  return glossHTML(q.stem_en, g.sw, {seg:\"s\", from:k, to:k + q.key_clue_en.length});\n}\nfunction chunksHTML(text, ch){\n  return '\u003cdiv class=\"gcks\">' + (ch || []).map(c => `\u003cdiv class=\"gck${String(c[2]).startsWith(\"★\") ? \" core\" : \"\"}\">\u003cspan class=\"gce\">${esc(text.slice(c[0], c[1]))}\u003c/span>\u003cspan class=\"gcz\">${esc(c[3])}\u003c/span>\u003cspan class=\"gcr\">${esc(c[2])}\u003c/span>\u003c/div>`).join(\"\") + '\u003c/div>';\n}\nfunction sentHTML(text, s, n){\n  let h = `\u003cdiv class=\"gsent\">${n ? `\u003cdiv class=\"small muted\">第 ${n} 句\u003c/div>` : \"\"}${chunksHTML(text, s.c)}`;\n  if(s.core) h += `\u003cdiv class=\"gline\">\u003cb>主幹\u003c/b>　${esc(s.core)}\u003c/div>`;\n  if(s.plain) h += `\u003cdiv class=\"gline\">\u003cb>這句白話說\u003c/b>　${esc(s.plain)}\u003c/div>`;\n  if(s.ask) h += `\u003cdiv class=\"gask\">\u003cb>它到底在問什麼\u003c/b>　${esc(s.ask)}\u003c/div>`;\n  return h + '\u003c/div>';\n}\nconst SPLIT_HELP = '每一塊：上面英文、中間中文、下面是它在句子裡的角色。\u003cb>★＝主幹\u003c/b>（這句「誰＋做什麼」），「X子句·」＝那塊屬於句子裡的小句子。';\nfunction splitPanel(q, g){\n  return `\u003cdiv class=\"gsplit\" data-act=\"noop\">\u003cdiv class=\"small muted\" style=\"margin-bottom:4px\">拆句｜${SPLIT_HELP}選項的拆句在各選項下面。\u003c/div>` + g.ss.map((s, i) => sentHTML(q.stem_en, s, g.ss.length > 1 ? i + 1 : 0)).join(\"\") + '\u003c/div>';\n}\nfunction optSplitHTML(q, oi, c){\n  if(!c || !c.split || c.mode === \"exam\") return \"\";\n  const g = qg(q); if(!g || !g.os || !g.os[oi]) return \"\";\n  const s = g.os[oi];\n  // 畫面已經有選項的中文翻譯（學習模式、送出答案後、按過看中文）就不再重複印白話\n  const zhShown = c.mode === \"learn\" || c.mode === \"review\" || c.showZh || c.answered;\n  return `\u003cdiv class=\"gsplit-o\" data-act=\"noop\">${chunksHTML(q.options_en[oi], s.c)}${s.plain && !zhShown ? `\u003cdiv class=\"gline\">\u003cb>白話\u003c/b>　${esc(s.plain)}\u003c/div>` : \"\"}\u003c/div>`;\n}\nfunction splitBtn(q, c){\n  if(c.mode === \"exam\" || !qg(q) || !qg(q).ss) return \"\";\n  const counted = (c.mode === \"practice\" || c.mode === \"wrong\") && !c.answered;\n  return `\u003cbutton class=\"ghost small\" data-act=\"split\">${c.split ? \"收起拆句\" : counted ? \"拆句（會記為「看中文」）\" : \"拆句\"}\u003c/button>`;\n}\nfunction wordHint(c){\n  const counted = (c.mode === \"practice\" || c.mode === \"wrong\") && !c.answered;\n  return counted ? \"每個英文字都可以\u003cb>點\u003c/b>看中文（記為「查字」，不算看中文）；選答案點左邊的字母圈或按 1–5\"\n                 : \"每個英文字滑過或點一下就有中文；選答案點左邊的字母圈或按 1–5\";\n}\n/* 題卡上的工具列（練習模式還沒按看中文時，按鈕併在「看中文翻譯」那一列，這裡不重複） */\nfunction splitHTML(q, c, helps, zhOpen, showAns){\n  if(!helps) return \"\";\n  let h = \"\";\n  const inHintRow = !zhOpen && !showAns;\n  const btn = splitBtn(q, c);\n  if(!inHintRow) h += `\u003cdiv class=\"row\" style=\"margin-top:10px\">${btn}\u003cspan class=\"small muted\">${wordHint(c)}\u003c/span>\u003c/div>`;\n  const g = qg(q);\n  if(c.split && g && g.ss) h += splitPanel(q, g);\n  return h;\n}\n/* 單字卡例句：用該題的 QGLOSS */\nfunction vocabExHTML(ex, g){\n  const q = QBYID[ex.id], gl = qg(q);\n  const head = `\u003cdiv class=\"small muted\">題庫裡的例句（${esc(ex.id)}）\u003c/div>`;\n  const texts = q ? [q.stem_en, ...q.options_en] : [];\n  const ti = texts.findIndex(t => t.includes(ex.s));\n  if(!gl || ti \u003c 0) return `\u003cdiv class=\"ex\">${head}${renderText(ex.s, {vocab:true, hl:g.en.toLowerCase()})}\u003c/div>`;\n  const text = texts[ti], a = text.indexOf(ex.s), b = a + ex.s.length;\n  const toks = ti === 0 ? gl.sw : (gl.ow || [])[ti - 1];\n  let h = `\u003cdiv class=\"ex\">${head}${glossHTML(text, toks, {seg: ti === 0 ? \"s\" : \"o\" + (ti - 1), from:a, to:b, hl:g.en.toLowerCase()})}`;\n  const sents = ti === 0 ? (gl.ss || []).filter(s => s.a \u003c b && s.b > a) : (gl.os && gl.os[ti - 1] ? [gl.os[ti - 1]] : []);\n  if(sents.length){\n    h += `\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cbutton class=\"ghost small\" data-act=\"vsplit\">${VS.split ? \"收起拆句\" : \"拆句\"}\u003c/button>\u003cspan class=\"small muted\">每個字滑過或點一下就有中文\u003c/span>\u003c/div>`;\n    if(VS.split) h += `\u003cdiv class=\"gsplit\">\u003cdiv class=\"small muted\" style=\"margin-bottom:4px\">${SPLIT_HELP}\u003c/div>` + sents.map(s => sentHTML(text, s, 0)).join(\"\") + '\u003c/div>';\n  }\n  return h + '\u003c/div>';\n}\n/* 讀題技巧頁的例句 */\nfunction tipHTML(t){\n  const g = typeof QGLOSS !== \"undefined\" ? QGLOSS[\"T:\" + t] : null;\n  return g && g.sw ? glossHTML(t, g.sw, {seg:\"t\"}) : esc(t);\n}\n\n/* ---------- tooltip ---------- */\nconst tip = $(\"#tip\");\nfunction showTip(el){ tipEl = el; tip.textContent = el.dataset.en + \"：\" + el.dataset.zh; tip.hidden = false; const r = el.getBoundingClientRect(); const tw = Math.min(280, tip.offsetWidth); let x = Math.min(window.innerWidth - tw - 8, Math.max(8, r.left)); let y = r.bottom + 6; if(y + tip.offsetHeight > window.innerHeight - 8) y = r.top - tip.offsetHeight - 6; tip.style.left = x+\"px\"; tip.style.top = y+\"px\"; }\nfunction hideTip(){ tip.hidden = true; tipEl = null; }\n// 練習模式還沒送出答案時：滑過不出中文（要點，點了記「查字」）\ndocument.addEventListener(\"mouseover\", e => { const v = e.target.closest && e.target.closest(\".v,.gw\"); if(v && !lookupCounted()) showTip(v); else if(v !== tipEl) hideTip(); });\nwindow.addEventListener(\"scroll\", hideTip, {passive:true});\n\n/* ---------- stats ---------- */\nfunction latest(){ const r = {}; for(const id in DB.att){ const a = DB.att[id]; if(a && a.length && QBYID[id]) r[id] = a[a.length-1]; } return r; }\nfunction record(q, correct, ms, hint, mode, lk){ (DB.att[q.id] = DB.att[q.id] || []).push({t:Date.now(), c:correct?1:0, ms:Math.round(ms), h:hint?1:0, m:mode, lk:lk||0}); if(!correct) DB.wrong[q.id] = (DB.wrong[q.id]||0) + 1; save(); }\nfunction recentAttempts(n, modes){ const all = []; for(const id in DB.att) for(const a of DB.att[id]) if(!modes || modes.includes(a.m)) all.push(a); all.sort((a,b) => b.t-a.t); return all.slice(0, n); }\n\n/* ---------- concepts（考點清單；2026-11-12 第三批加入） ---------- */\nconst CS = {d:\"all\", sort:\"id\", weak:false};\nfunction conceptStats(){\n  const st = {};\n  for(const c of CONCEPTS) st[c.id] = {q:[], qp:[], n:0, c:0, seen:0};\n  for(const q of BANK){\n    for(const cid of (q.concepts || [])){\n      const s = st[cid]; if(!s) continue;\n      s.q.push(q.id);\n      if(q.set !== \"C\" && q.set !== \"D\") s.qp.push(q.id);\n      const a = DB.att[q.id] || [];\n      if(a.length) s.seen++;\n      for(const x of a){ s.n++; s.c += x.c; }\n    }\n  }\n  return st;\n}\nfunction isWeak(s){ return s.n === 0 || s.c / s.n \u003c 0.7; }\nfunction vConcepts(){\n  const st = conceptStats();\n  let list = CONCEPTS.filter(c => CS.d === \"all\" || c.task.split(\".\")[0] === CS.d);\n  if(CS.weak) list = list.filter(c => isWeak(st[c.id]));\n  if(CS.sort === \"weak\") list = list.slice().sort((a, b) => {\n    const A = st[a.id], B = st[b.id];\n    const ra = A.n ? A.c / A.n : -1, rb = B.n ? B.c / B.n : -1;\n    return ra - rb || a.id.localeCompare(b.id, undefined, {numeric:true});\n  });\n  const all = CONCEPTS.length, done = CONCEPTS.filter(c => st[c.id].n).length, weakN = CONCEPTS.filter(c => isWeak(st[c.id])).length;\n  let h = `\u003ch2>考點清單\u003c/h2>\n  \u003cdiv class=\"card small\">官方 Exam Guide 的 38 個 task 細分成 \u003cb>${all}\u003c/b> 個考點（一個考點＝一道情境題能考的一個判斷點；兩個模型各自整理後合併）。每題都標了它考的考點，正確率依你在本站的作答紀錄計算（學習、練習、模考都算）。\n  \u003cbr>已作答過的考點 ${done} / ${all}；弱點（沒做過或正確率低於 70%）${weakN} 個。建議：先把弱點考點用「學習」看懂，再用「練習」英文直讀。預設不出模考 C／D 保留題。\u003c/div>\n  \u003cdiv class=\"card\">\u003cdiv class=\"row\">\n    \u003clabel>Domain \u003cselect data-cs=\"d\">\u003coption value=\"all\">全部\u003c/option>${Object.keys(DOMAINS).map(d => `\u003coption value=\"${d}\" ${CS.d===d?\"selected\":\"\"}>D${d} ${esc(DOMAINS[d].zh)}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n    \u003clabel>排序 \u003cselect data-cs=\"sort\">\u003coption value=\"id\" ${CS.sort===\"id\"?\"selected\":\"\"}>依編號\u003c/option>\u003coption value=\"weak\" ${CS.sort===\"weak\"?\"selected\":\"\"}>正確率低的在前（沒做過的最前）\u003c/option>\u003c/select>\u003c/label>\n    \u003clabel class=\"ck\">\u003cinput type=\"checkbox\" data-cs=\"weak\" ${CS.weak?\"checked\":\"\"}> 只看弱點\u003c/label>\n  \u003c/div>\u003c/div>`;\n  let lastTask = null;\n  for(const c of list){\n    const s = st[c.id];\n    if(CS.sort === \"id\" && c.task !== lastTask){\n      lastTask = c.task;\n      h += `\u003ch3 style=\"margin:18px 0 6px\">${esc(c.task)} ${esc(TASKS[c.task] ? TASKS[c.task][1] : \"\")}\u003c/h3>`;\n    }\n    const rate = s.n ? pct(s.c, s.n) : null;\n    const cls = rate === null ? \"\" : (rate >= 70 ? \"ok\" : \"bad\");\n    h += `\u003cdiv class=\"card cpt\" data-cid=\"${esc(c.id)}\" style=\"padding:10px 12px;margin:6px 0\">\n      \u003cdiv>\u003cspan class=\"tag\">${esc(c.id)}\u003c/span> \u003cb>${esc(c.name_zh)}\u003c/b> \u003cspan class=\"muted small\">${esc(c.name_en)}\u003c/span>\u003c/div>\n      \u003cdiv class=\"small\" style=\"margin:4px 0\">${esc(c.desc_zh)}\u003c/div>\n      \u003cdiv class=\"row small\" style=\"align-items:center;gap:10px;flex-wrap:wrap\">\n        \u003cspan>題數 ${s.q.length}${s.q.length !== s.qp.length ? `（可練 ${s.qp.length}）` : \"\"}\u003c/span>\n        \u003cspan>做過 ${s.seen} 題 · 作答 ${s.n} 次\u003c/span>\n        \u003cspan>正確率 ${rate === null ? \"—\" : rate + \"%\"}\u003c/span>\n        ${rate === null ? \"\" : `\u003cspan class=\"bar ${cls}\" style=\"display:inline-block;width:80px\">\u003ci style=\"width:${rate}%\">\u003c/i>\u003c/span>`}\n        \u003cbutton data-act=\"cstudy\" data-m=\"learn\" data-cid=\"${esc(c.id)}\" ${s.qp.length ? \"\" : \"disabled\"}>學習\u003c/button>\n        \u003cbutton data-act=\"cstudy\" data-m=\"practice\" data-cid=\"${esc(c.id)}\" ${s.qp.length ? \"\" : \"disabled\"}>練習\u003c/button>\n      \u003c/div>${s.qp.length ? \"\" : `\u003cdiv class=\"small muted\" style=\"margin-top:4px\">這個考點目前只出現在模考 C／D 保留卷，練習時不會出；練習題之後補。\u003c/div>`}\u003c/div>`;\n  }\n  if(!list.length) h += `\u003cdiv class=\"card muted\">沒有符合條件的考點。\u003c/div>`;\n  app.innerHTML = h;\n}\nfunction conceptsClick(act, t){\n  if(act !== \"cstudy\") return;\n  const cid = t.dataset.cid, mode = t.dataset.m === \"practice\" ? \"practice\" : \"learn\";\n  const list = shuffle(BANK.filter(q => (q.concepts || []).includes(cid) && q.set !== \"C\" && q.set !== \"D\").map(q => q.id));\n  if(!list.length) return;\n  SESS[mode] = {mode, list, i:0, perm:null, picked:[], answered:false, hint:false, t0:Date.now(), right:0, wrong:0, hints:0, ms:0, res:[], concept:cid};\n  go(mode);\n}\nfunction conceptsChange(t){\n  const k = t.dataset.cs; if(!k) return;\n  CS[k] = t.type === \"checkbox\" ? t.checked : t.value;\n  render();\n}\n\n/* ---------- view router ---------- */\nlet view = \"home\";\nfunction go(v){ view = v; render(); window.scrollTo(0,0); }\ndocument.getElementById(\"nav\").addEventListener(\"click\", e => { const b = e.target.closest(\"button[data-v]\"); if(b) go(b.dataset.v); });\ndocument.querySelectorAll(\"[data-fs]\").forEach(b => b.addEventListener(\"click\", () => { DB.fs = Math.min(26, Math.max(14, (DB.fs||18) + Number(b.dataset.fs))); applyPrefs(); save(); }));\n$(\"#theme\").addEventListener(\"click\", () => { const cur = DB.theme || (matchMedia(\"(prefers-color-scheme: dark)\").matches ? \"dark\" : \"light\"); DB.theme = cur === \"dark\" ? \"light\" : \"dark\"; applyPrefs(); save(); });\nfunction applyPrefs(){ document.documentElement.style.setProperty(\"--qfs\", (DB.fs||18)+\"px\"); if(DB.theme) document.documentElement.setAttribute(\"data-theme\", DB.theme); }\napplyPrefs();\nfunction render(){\n  document.querySelectorAll(\"#nav button\").forEach(b => b.classList.toggle(\"on\", b.dataset.v === view));\n  hideTip();\n  ({home:vHome, learn:() => vPractice(\"learn\"), practice:() => vPractice(\"practice\"), wrong:() => vPractice(\"wrong\"), exam:vExam, vocab:vVocab, tips:vTips, plan:vPlan, concepts:vConcepts})[view]();\n}\n\n/* ---------- home ---------- */\nfunction vHome(){\n  const L = latest(); const ids = Object.keys(L);\n  const nonOff = BANK.filter(q => !q.official);\n  const correct = ids.filter(id => L[id].c).length;\n  const wrongN = Object.keys(DB.wrong).filter(id => QBYID[id]).length;\n  let known = 0; GLOSS.forEach(g => { if(DB.vk[g.en.toLowerCase()] === 1) known++; });\n  const pr = recentAttempts(50, [\"practice\"]); const hintRate = pr.length ? pct(pr.filter(a => a.h).length, pr.length) : null;\n  const prl = pr.filter(a => \"lk\" in a); const lkAvg = prl.length ? (prl.reduce((s, a) => s + a.lk, 0) / prl.length).toFixed(1) : null;\n  const tm = recentAttempts(50, [\"practice\",\"exam\",\"wrong\"]); const avg = tm.length ? tm.reduce((s,a) => s+a.ms, 0)/tm.length : null;\n  const today = ymd(new Date());\n  const dBank = dayDiff(today, \"2026-12-07\");\n  const dExam = DB.examDate ? dayDiff(today, DB.examDate) : null;\n  let h = `\u003ch2>總覽\u003c/h2>`;\n  h += `\u003cdiv class=\"grid\">\n    \u003cdiv class=\"card stat\">\u003cb>${dBank > 0 ? dBank+\" 天\" : \"已換題庫\"}\u003c/b>\u003cspan>距 12/7 換題庫\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${dExam === null ? \"未設定\" : (dExam >= 0 ? dExam+\" 天\" : \"已考完\")}\u003c/b>\u003cspan>距考試日（在「讀書計畫」設定）\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${ids.length} / ${BANK.length}\u003c/b>\u003cspan>做過的題目\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${ids.length ? pct(correct, ids.length)+\"%\" : \"—\"}\u003c/b>\u003cspan>最近一次作答正確率\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${hintRate === null ? \"—\" : hintRate+\"%\"}\u003c/b>\u003cspan>練習時「看中文」比例（目標 \u003c 20%）\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${lkAvg === null ? \"—\" : lkAvg + \" 個\"}\u003c/b>\u003cspan>練習時每題平均查幾個字（點字，不算看中文）\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${avg === null ? \"—\" : Math.round(avg/1000)+\" 秒\"}\u003c/b>\u003cspan>平均每題用時（目標 ≤ ${Math.round(TARGET_SEC)} 秒）\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${wrongN}\u003c/b>\u003cspan>錯題本題數\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${known} / ${GLOSS.size}\u003c/b>\u003cspan>單字已認識\u003c/span>\u003c/div>\n  \u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">各 Domain 掌握度（每題取最近一次作答）\u003c/h3>\u003ctable>\u003ctr>\u003cth>Domain\u003c/th>\u003cth>比重\u003c/th>\u003cth>做過\u003c/th>\u003cth style=\"width:38%\">正確率\u003c/th>\u003c/tr>`;\n  for(const d in DOMAINS){\n    const pool = BANK.filter(q => String(q.domain) === d); const done = pool.filter(q => L[q.id]); const ok = done.filter(q => L[q.id].c).length; const p = pct(ok, done.length);\n    h += `\u003ctr>\u003ctd>D${d} ${esc(DOMAINS[d].zh)}\u003cdiv class=\"small muted\">${esc(DOMAINS[d].en)}\u003c/div>\u003c/td>\u003ctd>${DOMAINS[d].w}%\u003c/td>\u003ctd>${done.length}/${pool.length}\u003c/td>\u003ctd>${done.length ? `\u003cdiv class=\"bar ${p>=75?'ok':p\u003c60?'bad':''}\">\u003ci style=\"width:${p}%\">\u003c/i>\u003c/div>\u003cspan class=\"small\">${p}%\u003c/span>` : '\u003cspan class=\"small muted\">還沒做\u003c/span>'}\u003c/td>\u003c/tr>`;\n  }\n  h += `\u003c/table>\u003c/div>`;\n  if(DB.exams.length){\n    h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">模擬考紀錄\u003c/h3>\u003ctable>\u003ctr>\u003cth>時間\u003c/th>\u003cth>卷別\u003c/th>\u003cth>分數\u003c/th>\u003cth>用時\u003c/th>\u003c/tr>`;\n    DB.exams.slice(-8).reverse().forEach(x => { h += `\u003ctr>\u003ctd>${new Date(x.t).toLocaleString()}\u003c/td>\u003ctd>${esc(x.kind)}\u003c/td>\u003ctd>\u003cb>${x.pct}%\u003c/b>（${x.correct}/${x.n}）\u003c/td>\u003ctd>${fmt(x.usedMs)}\u003c/td>\u003c/tr>`; });\n    h += `\u003c/table>\u003c/div>`;\n  }\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">怎麼用這個網站\u003c/h3>\n  \u003col>\n    \u003cli>\u003cb>學習（中英對照）\u003c/b>：英文題目下面直接附中文，選項也有中文。先建立「這類題目在問什麼」的感覺。\u003c/li>\n    \u003cli>\u003cb>練習（英文直讀）\u003c/b>：只顯示英文；卡住才按「看中文翻譯」（會被記錄）。目標是把看中文比例壓到 20% 以下。\u003c/li>\n    \u003cli>\u003cb>模擬考\u003c/b>：63 題／120 分鐘，全英文、不給任何提示，跟正式考試一樣。交卷才看解答。\u003c/li>\n    \u003cli>\u003cb>逐字翻譯、拆句\u003c/b>：題目和選項的每個英文字都能看「這一題裡」的中文和詞性（\u003cspan class=\"gw vk\" data-en=\"example\" data-zh=\"範例〔名詞〕\">虛線底線\u003c/span>＝單字卡裡的字）；「拆句」把每句切成小塊、標出主幹（誰＋做什麼），最後一行白話。學習模式：字\u003cb>滑過或點一下\u003c/b>就出中文、拆句隨便看，都不記錄。練習模式（還沒送出答案時）：字要\u003cb>點\u003c/b>才出中文，記為「查字」（不算看中文）；按「拆句」會算看中文。送出答案後全部開放。模擬考作答中都沒有（正式考試沒有）。選答案請點選項左邊的字母圈或按 1–5（點到字會變成查字）。\u003cb class=\"q\">紫色字\u003c/b>是題目限定詞（BEST、FIRST、MOST…），決定你要選哪一種答案。\u003c/li>\n    \u003cli>答錯會自動進\u003cb>錯題本\u003c/b>；單字在\u003cb>單字卡\u003c/b>裡標「認識／不熟」。紀錄存在這台電腦的瀏覽器裡（換電腦或清瀏覽器資料就會不見）。\u003c/li>\n  \u003c/ol>\n  \u003cp class=\"small muted\">題庫 ${BANK.length} 題（含官方範例 ${BANK.filter(q=>q.official).length} 題）。${esc(BUILD_INFO.note || \"\")}\u003c/p>\u003c/div>`;\n  app.innerHTML = h;\n}\n\n/* ---------- practice / learn / wrong ---------- */\nconst SESS = {learn:null, practice:null, wrong:null};\nconst SETUP = {learn:{d:\"all\", t:\"all\", fresh:false, n:\"10\"}, practice:{d:\"all\", t:\"all\", fresh:true, n:\"20\"}, wrong:{}};\nfunction filterPool(st){\n  return BANK.filter(q => (st.d === \"all\" || (st.d === \"off\" ? q.official : String(q.domain) === st.d)) && (st.t === \"all\" || q.task === st.t) && (!st.fresh || !DB.att[q.id]) && (st.incRes || (q.set !== \"C\" && q.set !== \"D\")));\n}\nfunction vPractice(mode){\n  const S = SESS[mode];\n  if(!S) return vSetup(mode);\n  if(S.i >= S.list.length) return vSummary(mode);\n  const q = QBYID[S.list[S.i]];\n  if(!S.perm) { S.perm = shuffle(q.options_en.map((_,i) => i)); S.picked = []; S.answered = false; S.hint = false; S.zh = false; S.lk = {}; if(mode !== \"learn\") S.split = false; S.t0 = Date.now(); }\n  const head = `\u003cdiv class=\"row\" style=\"margin-bottom:10px\">\u003ch2 style=\"margin:0\">${mode===\"learn\"?\"學習（中英對照）\":mode===\"practice\"?\"練習（英文直讀）\":\"錯題重練\"}\u003c/h2>\n    \u003cspan class=\"muted small\" style=\"margin-left:auto\">第 ${S.i+1} / ${S.list.length} 題 · 答對 ${S.right} · 答錯 ${S.wrong}${mode!==\"learn\" ? \" · 看中文 \"+S.hints+\" 次 · 查字 \u003cspan id=\\\"lkn\\\">\"+((S.lkTotal||0)+Object.keys(S.lk||{}).length)+\"\u003c/span> 個\" : \"\"}\u003c/span>\n    \u003cbutton class=\"ghost small\" data-act=\"quit\">結束這輪\u003c/button>\u003c/div>`;\n  app.innerHTML = head + cardHTML(q, {mode, perm:S.perm, picked:S.picked, answered:S.answered, showZh: mode===\"learn\" || S.zh, split: !!S.split, timer:true});\n  startQTimer(mode);\n}\nfunction vSetup(mode){\n  let h = \"\";\n  if(mode === \"wrong\"){\n    const ids = Object.keys(DB.wrong).filter(id => QBYID[id]).sort();\n    h += `\u003ch2>錯題本\u003c/h2>\u003cdiv class=\"card\">\u003cp>答錯過的題目都在這裡。重練時答對就會移出錯題本（也可以手動移出）。\u003c/p>\n      \u003cdiv class=\"row\">\u003cbutton class=\"pri\" data-act=\"start\" ${ids.length?\"\":\"disabled\"}>重練全部錯題（${ids.length} 題，隨機順序）\u003c/button>\u003c/div>\u003c/div>`;\n    if(ids.length){\n      h += `\u003cdiv class=\"card\">\u003ctable>\u003ctr>\u003cth>題號\u003c/th>\u003cth>Domain / Task\u003c/th>\u003cth>錯幾次\u003c/th>\u003cth>題目開頭\u003c/th>\u003cth>\u003c/th>\u003c/tr>`;\n      ids.forEach(id => { const q = QBYID[id]; h += `\u003ctr>\u003ctd>${esc(id)}\u003c/td>\u003ctd>D${q.domain} · ${esc(q.task)}\u003c/td>\u003ctd>${DB.wrong[id]}\u003c/td>\u003ctd class=\"small\">${esc(q.stem_en.slice(0,90))}…\u003c/td>\u003ctd>\u003cbutton class=\"ghost small\" data-act=\"unwrong\" data-id=\"${esc(id)}\">移出\u003c/button>\u003c/td>\u003c/tr>`; });\n      h += `\u003c/table>\u003c/div>`;\n    }\n    app.innerHTML = h; return;\n  }\n  const st = SETUP[mode];\n  const pool = filterPool(st);\n  const tasks = Object.keys(TASKS).filter(t => st.d === \"all\" || t.startsWith(st.d + \".\"));\n  h += `\u003ch2>${mode===\"learn\"?\"學習（中英對照）\":\"練習（英文直讀）\"}\u003c/h2>`;\n  h += `\u003cdiv class=\"card\">\u003cp class=\"muted\" style=\"margin-top:0\">${mode===\"learn\" ? \"題目、選項都附中文翻譯，適合第一輪：先看懂題目在考什麼、學單字。\" : \"只顯示英文。卡住可以按「看中文翻譯」，但會被記錄。每個英文字都可以點來看中文（記為「查字」，不算看中文）；「拆句」算看中文。畫面會顯示每題用時，正式考試平均每題約 1 分 54 秒。\"}\u003c/p>\n    \u003cdiv class=\"row\">\n      \u003clabel>Domain \u003cselect data-set=\"d\">\u003coption value=\"all\">全部\u003c/option>${Object.keys(DOMAINS).map(d => `\u003coption value=\"${d}\" ${st.d===d?\"selected\":\"\"}>D${d} ${esc(DOMAINS[d].zh)}\u003c/option>`).join(\"\")}\u003coption value=\"off\" ${st.d===\"off\"?\"selected\":\"\"}>官方範例（3 題）\u003c/option>\u003c/select>\u003c/label>\n      \u003clabel>Task \u003cselect data-set=\"t\">\u003coption value=\"all\">全部\u003c/option>${st.d===\"off\"?\"\":tasks.map(t => `\u003coption value=\"${t}\" ${st.t===t?\"selected\":\"\"}>${t} ${esc(TASKS[t][1])}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n      \u003clabel>題數 \u003cselect data-set=\"n\">${[\"10\",\"20\",\"40\",\"all\"].map(n => `\u003coption value=\"${n}\" ${st.n===n?\"selected\":\"\"}>${n===\"all\"?\"全部\":n}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n      \u003clabel class=\"ck\">\u003cinput type=\"checkbox\" data-set=\"fresh\" ${st.fresh?\"checked\":\"\"}> 只出沒做過的\u003c/label>\n      \u003clabel class=\"ck\">\u003cinput type=\"checkbox\" data-set=\"incRes\" ${st.incRes?\"checked\":\"\"}> 包含模考 C／D 保留題（會讓模考失準）\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"pri\" data-act=\"start\" ${pool.length?\"\":\"disabled\"}>開始（符合條件 ${pool.length} 題）\u003c/button>\u003c/div>\u003c/div>`;\n  if(st.t !== \"all\" && TASKS[st.t]) h += `\u003cdiv class=\"card small\">\u003cb>${st.t}\u003c/b> ${esc(TASKS[st.t][0])}\u003cbr>\u003cspan class=\"muted\">${esc(TASKS[st.t][1])}\u003c/span>\u003c/div>`;\n  app.innerHTML = h;\n}\nfunction startSession(mode){\n  let list;\n  if(mode === \"wrong\") list = shuffle(Object.keys(DB.wrong).filter(id => QBYID[id]));\n  else { const st = SETUP[mode]; list = shuffle(filterPool(st).map(q => q.id)); if(st.n !== \"all\") list = list.slice(0, Number(st.n)); }\n  SESS[mode] = {mode, list, i:0, perm:null, picked:[], answered:false, hint:false, t0:Date.now(), right:0, wrong:0, hints:0, ms:0, res:[]};\n  render(); window.scrollTo(0,0);\n}\nfunction vSummary(mode){\n  const S = SESS[mode];\n  const n = S.list.length;\n  let h = `\u003ch2>這一輪結束\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"big\">${pct(S.right, n)}%\u003c/div>\u003cp>答對 ${S.right} / ${n} 題${mode!==\"learn\" ? ` · 看中文 ${S.hints} 次（${pct(S.hints, n)}%） · 查字 ${S.lkTotal||0} 個（每題平均 ${n ? ((S.lkTotal||0)/n).toFixed(1) : 0}）` : \"\"} · 平均每題 ${n ? Math.round(S.ms/n/1000) : 0} 秒\u003c/p>\n    \u003cdiv class=\"row\">\u003cbutton class=\"pri\" data-act=\"again\">再來一輪\u003c/button>${S.wrong && mode!==\"wrong\" ? `\u003cbutton data-act=\"towrong\">去錯題本重練\u003c/button>` : \"\"}\u003c/div>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003ctable>\u003ctr>\u003cth>題號\u003c/th>\u003cth>結果\u003c/th>\u003cth>用時\u003c/th>\u003cth>題目開頭\u003c/th>\u003c/tr>${S.res.map(r => `\u003ctr>\u003ctd>${esc(r.id)}\u003c/td>\u003ctd>${r.c ? '\u003cspan style=\"color:var(--ok)\">✓\u003c/span>' : '\u003cspan style=\"color:var(--bad)\">✗\u003c/span>'}${r.h ? ' \u003cspan class=\"small muted\">看了中文\u003c/span>' : ''}${r.lk ? ' \u003cspan class=\"small muted\">查字 '+r.lk+'\u003c/span>' : ''}\u003c/td>\u003ctd>${Math.round(r.ms/1000)} 秒\u003c/td>\u003ctd class=\"small\">${esc(QBYID[r.id].stem_en.slice(0,80))}…\u003c/td>\u003c/tr>`).join(\"\")}\u003c/table>\u003c/div>`;\n  app.innerHTML = h;\n}\nlet qTimerId = null;\nfunction startQTimer(mode){\n  clearInterval(qTimerId);\n  qTimerId = setInterval(() => {\n    const el = document.getElementById(\"qtimer\"); const S = SESS[mode];\n    if(!el || !S || S.answered || view !== mode){ return; }\n    const ms = Date.now() - S.t0; el.textContent = fmt(ms); el.classList.toggle(\"over\", ms/1000 > TARGET_SEC);\n  }, 500);\n}\n/* 一張題目卡 */\nfunction cardHTML(q, c){\n  const helps = c.mode !== \"exam\";\n  const showAns = !!c.answered;\n  const zhOpen = c.mode === \"learn\" || c.mode === \"review\" || c.showZh;\n  const right = showAns && sameSet(c.picked.map(di => c.perm[di]), q.answer);\n  let h = `\u003cdiv class=\"card qcard\">`;\n  // 模擬考比照正式考試：不顯示 Domain／Task／難度／題號，只顯示要選幾個\n  if(c.mode === \"exam\") h += `\u003cdiv class=\"qmeta\">${q.select > 1 ? `\u003cspan class=\"tag multi\">複選：選 ${q.select} 個\u003c/span>` : '\u003cspan class=\"muted\">單選\u003c/span>'}\u003c/div>`;\n  else h += `\u003cdiv class=\"qmeta\">\u003cspan class=\"tag\">D${q.domain} ${esc(DOMAINS[q.domain].zh)}\u003c/span>\u003cspan>Task ${esc(q.task)}\u003c/span>${q.official ? '\u003cspan class=\"tag off\">官方範例\u003c/span>' : ''}${q.select > 1 ? `\u003cspan class=\"tag multi\">複選：選 ${q.select} 個\u003c/span>` : ''}\u003cspan>${\"★\".repeat(q.difficulty||2)}\u003c/span>\n    ${c.timer && !showAns ? `\u003cspan class=\"sp\">用時 \u003cspan class=\"timer\" id=\"qtimer\">0:00\u003c/span> \u003cspan class=\"muted\">/ 目標 ${fmt(TARGET_SEC*1000)}\u003c/span>\u003c/span>` : `\u003cspan class=\"sp muted\">${esc(q.id)}\u003c/span>`}\u003c/div>`;\n  h += `\u003cdiv class=\"stem\">${stemHTML(q, helps, showAns)}\u003c/div>`;\n  if(helps){\n    if(zhOpen) h += `\u003cdiv class=\"zh\">${esc(q.stem_zh)}\u003c/div>`;\n    else if(!showAns) h += `\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cbutton class=\"ghost small\" data-act=\"hint\">看中文翻譯（會記為「用了提示」）\u003c/button>${splitBtn(q, c)}\u003cspan class=\"small muted\">${wordHint(c)}\u003c/span>\u003c/div>`;\n  }\n  h += splitHTML(q, c, helps, zhOpen, showAns);\n  h += `\u003cdiv class=\"opts\">`;\n  c.perm.forEach((oi, di) => {\n    const sel = c.picked.includes(di), isAns = q.answer.includes(oi);\n    let cls = \"opt\"; if(sel) cls += \" sel\"; if(showAns){ cls += \" locked\"; if(isAns) cls += \" ok\"; else if(sel) cls += \" bad\"; }\n    h += `\u003cdiv class=\"${cls}\" data-act=\"pick\" data-k=\"${di}\" role=\"button\" tabindex=\"0\">\u003cspan class=\"lt\">${LET[di]}\u003c/span>\u003cspan class=\"ot\">\u003cspan>${optHTML(q, oi, helps)}\u003c/span>${optSplitHTML(q, oi, c)}`;\n    if(helps && (zhOpen || showAns)) h += `\u003cspan class=\"ozh\">${esc(q.options_zh[oi])}\u003c/span>`;\n    if(showAns && isAns) h += `\u003cspan class=\"why okw\">✓ 正解\u003c/span>`;\n    if(showAns && !isAns && q.why_wrong_zh[oi]) h += `\u003cspan class=\"why\">✗ ${esc(q.why_wrong_zh[oi])}\u003c/span>`;\n    h += `\u003c/span>\u003c/div>`;\n  });\n  h += `\u003c/div>`;\n  if(c.mode !== \"exam\" && !showAns){\n    h += `\u003cdiv class=\"actions\">\u003cbutton class=\"pri\" data-act=\"submit\" ${c.picked.length === q.select ? \"\" : \"disabled\"}>送出答案\u003c/button>\u003cspan class=\"small muted\">鍵盤：\u003ckbd>1\u003c/kbd>–\u003ckbd>5\u003c/kbd> 選、\u003ckbd>Enter\u003c/kbd> 送出／下一題\u003c/span>\u003c/div>`;\n  }\n  if(showAns){\n    h += `\u003cdiv class=\"explain\">`;\n    if(c.mode !== \"review\" || c.picked.length) h += `\u003cdiv class=\"res ${right?\"ok\":\"bad\"}\">${right ? \"答對了 ✓\" : \"答錯了 ✗\"}　\u003cspan class=\"small muted\">正解：${c.perm.map((oi,di) => q.answer.includes(oi) ? LET[di] : \"\").join(\"\")}\u003c/span>\u003c/div>`;\n    else h += `\u003cdiv class=\"res bad\">未作答　\u003cspan class=\"small muted\">正解：${c.perm.map((oi,di) => q.answer.includes(oi) ? LET[di] : \"\").join(\"\")}\u003c/span>\u003c/div>`;\n    h += `\u003cp>${esc(q.explain_zh)}\u003c/p>`;\n    h += `\u003cdiv class=\"clue-box\">\u003cdiv class=\"small muted\">決定答案的關鍵句（題目裡已用黃底標出）\u003c/div>\u003cdiv>\u003cb>${clueHTML(q)}\u003c/b>\u003c/div>\u003cdiv>${esc(q.key_clue_zh)}\u003c/div>\u003c/div>`;\n    if(q.vocab && q.vocab.length) h += `\u003ch3>這題的單字\u003c/h3>\u003ctable>${q.vocab.map(v => `\u003ctr>\u003ctd style=\"width:45%\">\u003cb>${esc(v.en)}\u003c/b>\u003c/td>\u003ctd>${esc(v.zh)}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/table>`;\n    h += `\u003c/div>`;\n    if(c.mode !== \"review\"){\n      h += `\u003cdiv class=\"actions\">\u003cbutton class=\"pri\" data-act=\"next\">下一題 →\u003c/button>${DB.wrong[q.id] ? `\u003cbutton class=\"ghost\" data-act=\"unwrong\" data-id=\"${esc(q.id)}\">移出錯題本\u003c/button>` : `\u003cbutton class=\"ghost\" data-act=\"addwrong\" data-id=\"${esc(q.id)}\">加入錯題本\u003c/button>`}\u003c/div>`;\n    }\n  }\n  return h + `\u003c/div>`;\n}\nfunction sameSet(a, b){ if(a.length !== b.length) return false; const s = new Set(a); return b.every(x => s.has(x)); }\nfunction pickOption(arr, di, sel){\n  const k = arr.indexOf(di);\n  if(sel === 1) return [di];\n  if(k >= 0) { arr.splice(k,1); return arr; }\n  if(arr.length \u003c sel) arr.push(di);\n  return arr;\n}\n\n/* ---------- click handling ---------- */\napp.addEventListener(\"click\", e => {\n  const v = e.target.closest(\".v,.gw\");\n  if(v){ noteLookup(v); showTip(v); if(v.closest(\".opt\")) return; }\n  const t = e.target.closest(\"[data-act]\"); if(!t) return;\n  const act = t.dataset.act;\n  // practice-like modes\n  if([\"learn\",\"practice\",\"wrong\"].includes(view)){\n    const mode = view, S = SESS[mode];\n    if(act === \"start\") return startSession(mode);\n    if(act === \"quit\"){ SESS[mode] = null; return render(); }\n    if(act === \"again\"){ SESS[mode] = null; return render(); }\n    if(act === \"towrong\"){ SESS.wrong = null; return go(\"wrong\"); }\n    if(act === \"unwrong\"){ delete DB.wrong[t.dataset.id]; save(); return render(); }\n    if(act === \"addwrong\"){ DB.wrong[t.dataset.id] = (DB.wrong[t.dataset.id]||0) + 1; save(); return render(); }\n    if(!S) return;\n    const q = QBYID[S.list[S.i]];\n    if(act === \"hint\"){ S.hint = true; S.zh = true; return render(); }\n    if(act === \"split\"){ if(lookupCounted()) S.hint = true; S.split = !S.split; return render(); }\n    if(act === \"pick\" && !S.answered){ S.picked = pickOption(S.picked, Number(t.dataset.k), q.select); return render(); }\n    if(act === \"submit\" && !S.answered && S.picked.length === q.select) return submitPractice(mode);\n    if(act === \"next\"){ S.i++; S.perm = null; render(); window.scrollTo(0,0); return; }\n  }\n  if(view === \"exam\") return examClick(act, t);\n  if(view === \"vocab\") return vocabClick(act, t);\n  if(view === \"plan\") return planClick(act, t);\n  if(view === \"concepts\") return conceptsClick(act, t);\n});\napp.addEventListener(\"change\", e => {\n  const t = e.target;\n  if(t.dataset.set && SETUP[view]){ const st = SETUP[view]; const k = t.dataset.set; st[k] = t.type === \"checkbox\" ? t.checked : t.value; if(k === \"d\") st.t = \"all\"; render(); }\n  if(view === \"plan\") planChange(t);\n  if(view === \"concepts\") conceptsChange(t);\n  if(view === \"vocab\" && t.dataset.vf){ VS.filter = t.value; VS.i = 0; VS.flip = false; VS.order = null; render(); }\n});\napp.addEventListener(\"input\", e => { if(view === \"vocab\" && e.target.id === \"vq\"){ VS.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $(\"#vq\"); if(el){ el.focus(); el.setSelectionRange(pos,pos); } } });\nfunction submitPractice(mode){\n  const S = SESS[mode]; const q = QBYID[S.list[S.i]];\n  const ok = sameSet(S.picked.map(di => S.perm[di]), q.answer);\n  const ms = Date.now() - S.t0;\n  S.answered = true; S.ms += ms; if(ok) S.right++; else S.wrong++; if(S.hint) S.hints++;\n  const lk = Object.keys(S.lk || {}).length; S.lkTotal = (S.lkTotal || 0) + lk;\n  S.res.push({id:q.id, c:ok, ms, h:S.hint, lk});\n  record(q, ok, ms, S.hint, mode, lk);\n  if(mode === \"wrong\" && ok) { delete DB.wrong[q.id]; save(); }\n  render();\n}\ndocument.addEventListener(\"keydown\", e => {\n  if(e.target.matches && e.target.matches(\"input,select,textarea\")) return;\n  if([\"learn\",\"practice\",\"wrong\"].includes(view)){\n    const S = SESS[view]; if(!S || S.i >= S.list.length) return; const q = QBYID[S.list[S.i]];\n    const n = Number(e.key);\n    if(!S.answered && n >= 1 && n \u003c= q.options_en.length){ S.picked = pickOption(S.picked, n-1, q.select); render(); }\n    else if(e.key === \"Enter\"){ e.preventDefault(); if(!S.answered && S.picked.length === q.select) submitPractice(view); else if(S.answered){ S.i++; S.perm = null; render(); window.scrollTo(0,0); } }\n  } else if(view === \"exam\" && E && !E.done){\n    const q = QBYID[E.list[E.i]]; const n = Number(e.key);\n    if(n >= 1 && n \u003c= q.options_en.length){ E.picks[q.id] = pickOption(E.picks[q.id] || [], n-1, q.select); render(); }\n    else if(e.key === \"ArrowRight\"){ examGoto(E.i+1); } else if(e.key === \"ArrowLeft\"){ examGoto(E.i-1); }\n  } else if(view === \"vocab\" && VS.mode === \"card\"){\n    if(e.key === \" \" ){ e.preventDefault(); VS.flip = !VS.flip; render(); }\n    else if(e.key === \"ArrowRight\"){ vocabMark(1); } else if(e.key === \"ArrowLeft\"){ vocabMark(0); }\n  }\n});\n\n/* ---------- exam ---------- */\nconst TARGET63 = {1:11,2:8,3:12,4:10,5:9,6:9,7:4};\nconst TARGET21 = {1:4,2:3,3:4,4:3,5:3,6:3,7:1};\nlet E = null, eTimer = null;\nfunction examPools(){ const p = {}; BANK.filter(q => !q.official && q.set !== \"C\" && q.set !== \"D\").forEach(q => (p[q.domain] = p[q.domain] || []).push(q.id)); for(const d in p) p[d].sort(); return p; }\nfunction buildExam(kind){\n  // A／B／C／D 是固定卷（題目的 set 欄位；A/B 於 2026-11-12 依原抽題結果凍結）；R63／R21 從練習池（不含 C、D）依比重隨機抽\n  if([\"A\",\"B\",\"C\",\"D\"].includes(kind)) return shuffle(BANK.filter(q => q.set === kind).map(q => q.id));\n  const p = examPools(); let list = [];\n  const T = kind === \"R63\" ? TARGET63 : TARGET21;\n  for(const d in T) list = list.concat(shuffle(p[d] || []).slice(0, T[d]));\n  return shuffle(list);\n}\nfunction startExam(kind){\n  const list = buildExam(kind);\n  const mins = kind === \"R21\" ? Math.round(list.length * 120 / 63) : 120;\n  const name = {A:\"模考 A\", B:\"模考 B\", C:\"模考 C\", D:\"模考 D\", R63:\"隨機 63 題\", R21:\"迷你 21 題\"}[kind];\n  E = {kind:name, list, i:0, picks:{}, flags:{}, perm:{}, spent:{}, start:Date.now(), dur:mins*60000, qT0:Date.now(), done:false, rev:0};\n  list.forEach(id => { E.perm[id] = shuffle(QBYID[id].options_en.map((_,i) => i)); });\n  clearInterval(eTimer); eTimer = setInterval(examTick, 1000);\n  render(); window.scrollTo(0,0);\n}\nfunction examTick(){\n  if(!E || E.done){ clearInterval(eTimer); return; }\n  const left = E.start + E.dur - Date.now();\n  const el = document.getElementById(\"etimer\"); if(el){ el.textContent = fmt(left); el.classList.toggle(\"over\", left \u003c 10*60000); }\n  if(left \u003c= 0){ alert(\"時間到，自動交卷。\"); submitExam(); }\n}\nfunction examGoto(i){ if(!E || i \u003c 0 || i >= E.list.length) return; const id = E.list[E.i]; E.spent[id] = (E.spent[id]||0) + (Date.now() - E.qT0); E.qT0 = Date.now(); E.i = i; render(); window.scrollTo(0,0); }\nfunction submitExam(){\n  const id = E.list[E.i]; E.spent[id] = (E.spent[id]||0) + (Date.now() - E.qT0);\n  E.done = true; E.usedMs = Math.min(E.dur, Date.now() - E.start); clearInterval(eTimer);\n  let correct = 0; const per = {};\n  E.res = {};\n  E.list.forEach(id => {\n    const q = QBYID[id]; const pk = E.picks[id] || []; const ok = pk.length === q.select && sameSet(pk.map(di => E.perm[id][di]), q.answer);\n    E.res[id] = ok; if(ok) correct++;\n    per[q.domain] = per[q.domain] || [0,0]; per[q.domain][1]++; if(ok) per[q.domain][0]++;\n    record(q, ok, E.spent[id] || 0, false, \"exam\");\n  });\n  E.correct = correct; E.per = per;\n  DB.exams.push({t:Date.now(), kind:E.kind, n:E.list.length, correct, pct:pct(correct, E.list.length), per, usedMs:E.usedMs}); save();\n  E.view = \"result\"; render(); window.scrollTo(0,0);\n}\nwindow.addEventListener(\"beforeunload\", e => { if(E && !E.done){ e.preventDefault(); e.returnValue = \"\"; } });\nfunction vExam(){\n  if(!E) return vExamSetup();\n  if(!E.done) return vExamRun();\n  if(E.view === \"review\") return vExamReview();\n  return vExamResult();\n}\nfunction seenCount(kind){ return buildExam(kind).filter(id => DB.att[id]).length; }\nfunction vExamSetup(){\n  const p = examPools(); const total = Object.values(p).reduce((s,a) => s+a.length, 0);\n  let h = `\u003ch2>模擬考\u003c/h2>\u003cdiv class=\"card\">\u003cp style=\"margin-top:0\">跟正式考試一樣：\u003cb>全英文、沒有中文、沒有逐字翻譯和拆句、沒有紫色提示\u003c/b>；可以標記題目、隨時跳題；交卷後才看解答。單選題全對才算分，複選題要兩個都選對。\u003c/p>\n  \u003cdiv class=\"row\">\n    \u003cbutton class=\"pri\" data-act=\"ex\" data-k=\"A\">模考 A（63 題／120 分鐘）\u003c/button>\n    \u003cbutton class=\"pri\" data-act=\"ex\" data-k=\"B\">模考 B（63 題／120 分鐘）\u003c/button>\n    \u003cbutton class=\"pri\" data-act=\"ex\" data-k=\"C\">模考 C（保留卷）\u003c/button>\n    \u003cbutton class=\"pri\" data-act=\"ex\" data-k=\"D\">模考 D（保留卷）\u003c/button>\n    \u003cbutton data-act=\"ex\" data-k=\"R63\">隨機 63 題（依官方比重抽）\u003c/button>\n    \u003cbutton data-act=\"ex\" data-k=\"R21\">迷你 21 題／40 分鐘\u003c/button>\n  \u003c/div>\n  \u003cp class=\"small muted\">各卷題目互不重疊，各 Domain 題數依官方比重分配（每卷 D1 10–11、D2 8–9、D3 12、D4 10、D5 9、D6 9、D7 4 題）。\u003cb>C、D 是保留卷：學習、練習時不會出\u003c/b>，留到最後一週量真實程度。目前題庫非範例題 ${total} 題。中途重新整理頁面會讓這次模考作廢。\u003c/p>\n  \u003cp class=\"small\">模考 A 已做過 \u003cb>${seenCount(\"A\")}\u003c/b>／63 題、模考 B 已做過 \u003cb>${seenCount(\"B\")}\u003c/b>／63 題、模考 C 已做過 \u003cb>${seenCount(\"C\")}\u003c/b>／63 題、模考 D 已做過 \u003cb>${seenCount(\"D\")}\u003c/b>／63 題。\u003cspan class=\"muted\">做過的題目越多，分數越會偏高（記得答案），要判斷「準備好了沒」時，優先用沒做過的卷。\u003c/span>\u003c/p>\u003c/div>`;\n  if(DB.exams.length){\n    h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">歷次成績\u003c/h3>\u003ctable>\u003ctr>\u003cth>時間\u003c/th>\u003cth>卷別\u003c/th>\u003cth>分數\u003c/th>\u003cth>用時\u003c/th>${Object.keys(DOMAINS).map(d => `\u003cth>D${d}\u003c/th>`).join(\"\")}\u003c/tr>`;\n    DB.exams.slice().reverse().forEach(x => { h += `\u003ctr>\u003ctd class=\"small\">${new Date(x.t).toLocaleString()}\u003c/td>\u003ctd>${esc(x.kind)}\u003c/td>\u003ctd>\u003cb>${x.pct}%\u003c/b>\u003c/td>\u003ctd>${fmt(x.usedMs)}\u003c/td>${Object.keys(DOMAINS).map(d => `\u003ctd class=\"small\">${x.per[d] ? pct(x.per[d][0], x.per[d][1])+\"%\" : \"—\"}\u003c/td>`).join(\"\")}\u003c/tr>`; });\n    h += `\u003c/table>\u003c/div>`;\n  }\n  app.innerHTML = h;\n}\nfunction vExamRun(){\n  const id = E.list[E.i], q = QBYID[id];\n  const answered = E.list.filter(x => (E.picks[x]||[]).length === QBYID[x].select).length;\n  let h = `\u003cdiv class=\"ebar\">\u003cspan class=\"timer\" id=\"etimer\">${fmt(E.start + E.dur - Date.now())}\u003c/span>\u003cspan class=\"muted small\">剩餘\u003c/span>\n    \u003cspan style=\"margin-left:auto\" class=\"small\">第 ${E.i+1} / ${E.list.length} 題 · 已答 ${answered}\u003c/span>\n    \u003cbutton data-act=\"flag\">${E.flags[id] ? \"取消標記\" : \"標記\"}\u003c/button>\n    \u003cbutton data-act=\"prev\" ${E.i ? \"\" : \"disabled\"}>← 上一題\u003c/button>\n    \u003cbutton data-act=\"nxt\" ${E.i \u003c E.list.length-1 ? \"\" : \"disabled\"}>下一題 →\u003c/button>\n    \u003cbutton class=\"pri\" data-act=\"submitexam\">交卷\u003c/button>\u003c/div>`;\n  h += cardHTML(q, {mode:\"exam\", perm:E.perm[id], picked:E.picks[id] || [], answered:false});\n  h += `\u003cdiv class=\"card\">\u003cdiv class=\"small muted\">題目導覽（藍底＝已答、橘線＝已標記）\u003c/div>\u003cdiv class=\"navgrid\">${E.list.map((x, i) => `\u003cbutton data-act=\"goto\" data-i=\"${i}\" class=\"${(E.picks[x]||[]).length === QBYID[x].select ? \"ans\" : \"\"} ${E.flags[x] ? \"flag\" : \"\"} ${i === E.i ? \"cur\" : \"\"}\">${i+1}\u003c/button>`).join(\"\")}\u003c/div>\u003c/div>`;\n  app.innerHTML = h;\n}\nfunction vExamResult(){\n  const n = E.list.length, p = pct(E.correct, n);\n  let h = `\u003ch2>${esc(E.kind)}：成績\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"big\" style=\"color:${p>=75?\"var(--ok)\":p>=60?\"var(--warn)\":\"var(--bad)\"}\">${p}%\u003c/div>\n    \u003cp>答對 ${E.correct} / ${n} 題 · 用時 ${fmt(E.usedMs)}（限時 ${fmt(E.dur)}）· 平均每題 ${Math.round(E.usedMs/n/1000)} 秒\u003c/p>\n    \u003cp class=\"small muted\">官方是 100–1000 的換算分數、720 分及格，沒有公布答對幾題等於幾分，所以這裡只顯示答對比例。自己設的上場標準可以抓「兩回模考都穩定 75–80% 以上、而且時間有剩」。\u003c/p>\n    \u003cdiv class=\"row\">\u003cbutton class=\"pri\" data-act=\"rev\" data-i=\"0\">逐題看解答\u003c/button>\u003cbutton data-act=\"newexam\">回模擬考首頁\u003c/button>\u003c/div>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">各 Domain\u003c/h3>\u003ctable>${Object.keys(DOMAINS).map(d => { const x = E.per[d]; if(!x) return \"\"; const pp = pct(x[0], x[1]); return `\u003ctr>\u003ctd>D${d} ${esc(DOMAINS[d].zh)}\u003c/td>\u003ctd>${x[0]}/${x[1]}\u003c/td>\u003ctd style=\"width:40%\">\u003cdiv class=\"bar ${pp>=75?\"ok\":pp\u003c60?\"bad\":\"\"}\">\u003ci style=\"width:${pp}%\">\u003c/i>\u003c/div>\u003c/td>\u003ctd>${pp}%\u003c/td>\u003c/tr>`; }).join(\"\")}\u003c/table>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003cdiv class=\"small muted\">點題號看解答（綠＝對、紅＝錯）\u003c/div>\u003cdiv class=\"navgrid\">${E.list.map((x, i) => `\u003cbutton data-act=\"rev\" data-i=\"${i}\" class=\"${E.res[x] ? \"r-ok\" : \"r-bad\"}\">${i+1}\u003c/button>`).join(\"\")}\u003c/div>\u003c/div>`;\n  app.innerHTML = h;\n}\nfunction vExamReview(){\n  const id = E.list[E.rev], q = QBYID[id];\n  let h = `\u003cdiv class=\"row\" style=\"margin-bottom:10px\">\u003ch2 style=\"margin:0\">${esc(E.kind)}：第 ${E.rev+1} / ${E.list.length} 題解答\u003c/h2>\n    \u003cspan style=\"margin-left:auto\">\u003c/span>\u003cbutton data-act=\"rprev\" ${E.rev ? \"\" : \"disabled\"}>← 上一題\u003c/button>\u003cbutton data-act=\"rnext\" ${E.rev \u003c E.list.length-1 ? \"\" : \"disabled\"}>下一題 →\u003c/button>\u003cbutton data-act=\"rwrongnext\">下一個錯題 →\u003c/button>\u003cbutton class=\"ghost\" data-act=\"result\">回成績\u003c/button>\u003c/div>`;\n  h += cardHTML(q, {mode:\"review\", perm:E.perm[id], picked:E.picks[id] || [], answered:true, split: !!(E.split && E.split[id])});\n  app.innerHTML = h;\n}\nfunction examClick(act, t){\n  if(act === \"ex\") return startExam(t.dataset.k);\n  if(!E) return;\n  const id = E.list[E.i], q = QBYID[id];\n  if(!E.done){\n    if(act === \"pick\"){ E.picks[id] = pickOption(E.picks[id] || [], Number(t.dataset.k), q.select); return render(); }\n    if(act === \"flag\"){ E.flags[id] = !E.flags[id]; return render(); }\n    if(act === \"prev\") return examGoto(E.i - 1);\n    if(act === \"nxt\") return examGoto(E.i + 1);\n    if(act === \"goto\") return examGoto(Number(t.dataset.i));\n    if(act === \"submitexam\"){\n      const un = E.list.filter(x => (E.picks[x]||[]).length !== QBYID[x].select).length; const fl = E.list.filter(x => E.flags[x]).length;\n      if(confirm(`確定交卷？\\n未完成作答：${un} 題\\n標記中：${fl} 題`)) submitExam();\n      return;\n    }\n    return;\n  }\n  if(act === \"split\" && E.view === \"review\"){ const rid = E.list[E.rev]; E.split = E.split || {}; E.split[rid] = !E.split[rid]; render(); return; }\n  if(act === \"rev\"){ E.view = \"review\"; E.rev = Number(t.dataset.i); render(); window.scrollTo(0,0); return; }\n  if(act === \"rprev\"){ E.rev = Math.max(0, E.rev-1); render(); window.scrollTo(0,0); return; }\n  if(act === \"rnext\"){ E.rev = Math.min(E.list.length-1, E.rev+1); render(); window.scrollTo(0,0); return; }\n  if(act === \"rwrongnext\"){ for(let k = E.rev+1; k \u003c E.list.length; k++) if(!E.res[E.list[k]]){ E.rev = k; render(); window.scrollTo(0,0); return; } alert(\"後面沒有錯題了。\"); return; }\n  if(act === \"result\"){ E.view = \"result\"; render(); return; }\n  if(act === \"newexam\"){ E = null; render(); return; }\n}\n\n/* ---------- vocab ---------- */\nlet VS = {mode:\"card\", filter:\"todo\", i:0, flip:false, q:\"\", order:null};\nfunction vocabList(){\n  const arr = [...GLOSS.values()];\n  const f = VS.filter;\n  return arr.filter(g => {\n    const k = g.en.toLowerCase(), s = DB.vk[k];\n    if(f === \"all\") return true;\n    if(f === \"todo\") return s !== 1;\n    if(f === \"weak\") return s === 0;\n    if(f === \"new\") return s === undefined;\n    if(f === \"known\") return s === 1;\n    return g.cat === f;\n  });\n}\nfunction exampleFor(g){\n  for(const id of g.qids){\n    const q = QBYID[id]; if(!q) continue;\n    const texts = [q.stem_en, ...q.options_en];\n    const re = new RegExp(\"(?\u003c![A-Za-z])\" + g.en.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\").replace(/\\s+/g, \"\\\\s+\"), \"i\");\n    for(const t of texts){ const sents = t.split(/(?\u003c=[.?!])\\s+/); const s = sents.find(x => re.test(x)); if(s) return {s, id, zh:q.stem_zh}; }\n  }\n  return null;\n}\nfunction vVocab(){\n  let known = 0, weak = 0; GLOSS.forEach(g => { const s = DB.vk[g.en.toLowerCase()]; if(s === 1) known++; else if(s === 0) weak++; });\n  const cats = Object.entries(CORE_CAT).map(([k, v]) => [k, v]).concat(Object.keys(DOMAINS).map(d => [\"D\"+d, \"D\"+d+\" 題目單字\"]));\n  let h = `\u003ch2>單字卡\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"row\">\n    \u003cbutton class=\"${VS.mode===\"card\"?\"pri\":\"\"}\" data-act=\"vmode\" data-m=\"card\">卡片\u003c/button>\u003cbutton class=\"${VS.mode===\"list\"?\"pri\":\"\"}\" data-act=\"vmode\" data-m=\"list\">清單\u003c/button>\n    \u003clabel>範圍 \u003cselect data-vf=\"1\">${[[\"todo\",\"還不熟＋沒標過\"],[\"weak\",\"標為不熟的\"],[\"new\",\"沒標過的\"],[\"known\",\"已認識的\"],[\"all\",\"全部\"]].concat(cats).map(([k,v]) => `\u003coption value=\"${k}\" ${VS.filter===k?\"selected\":\"\"}>${esc(v)}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n    \u003cspan class=\"small muted\" style=\"margin-left:auto\">共 ${GLOSS.size} · 認識 ${known} · 不熟 ${weak} · 沒標過 ${GLOSS.size-known-weak}\u003c/span>\u003c/div>\u003c/div>`;\n  const list = vocabList();\n  if(VS.mode === \"card\"){\n    if(!VS.order || VS.order.length !== list.length) VS.order = shuffle(list.map(g => g.en.toLowerCase()));\n    if(!list.length){ app.innerHTML = h + `\u003cdiv class=\"card\">這個範圍沒有單字了 🎉 換個範圍看看。\u003c/div>`; return; }\n    if(VS.i >= VS.order.length) VS.i = 0;\n    const g = GLOSS.get(VS.order[VS.i]);\n    const ex = exampleFor(g);\n    h += `\u003cdiv class=\"card fc\">\u003cdiv class=\"small muted\">${VS.i+1} / ${VS.order.length} · ${esc(CORE_CAT[g.cat] || g.cat)}\u003c/div>\u003cdiv class=\"w\">${esc(g.en)}\u003c/div>`;\n    if(VS.flip){\n      h += `\u003cdiv class=\"m\">${esc(g.zh)}\u003c/div>`;\n      if(ex) h += vocabExHTML(ex, g);\n    } else h += `\u003cdiv style=\"margin-top:18px\">\u003cbutton data-act=\"vflip\">翻面看中文（空白鍵）\u003c/button>\u003c/div>`;\n    h += `\u003c/div>\u003cdiv class=\"row\" style=\"justify-content:center\">\u003cbutton data-act=\"vmark\" data-s=\"0\">✗ 不熟（←）\u003c/button>\u003cbutton class=\"pri\" data-act=\"vmark\" data-s=\"1\">✓ 認識（→）\u003c/button>\u003cbutton class=\"ghost\" data-act=\"vskip\">跳過\u003c/button>\u003c/div>`;\n  } else {\n    const qq = VS.q.trim().toLowerCase();\n    const rows = list.filter(g => !qq || g.en.toLowerCase().includes(qq) || g.zh.includes(qq)).sort((a,b) => a.en.localeCompare(b.en));\n    h += `\u003cdiv class=\"card\">\u003cinput type=\"text\" id=\"vq\" placeholder=\"搜尋英文或中文\" value=\"${esc(VS.q)}\" style=\"width:100%;margin-bottom:10px\">\u003ctable>\u003ctr>\u003cth>英文\u003c/th>\u003cth>中文\u003c/th>\u003cth>分類\u003c/th>\u003cth>狀態\u003c/th>\u003c/tr>${rows.map(g => { const k = g.en.toLowerCase(), s = DB.vk[k]; return `\u003ctr>\u003ctd>\u003cb>${esc(g.en)}\u003c/b>\u003c/td>\u003ctd>${esc(g.zh)}\u003c/td>\u003ctd class=\"small muted\">${esc(CORE_CAT[g.cat] || g.cat)}\u003c/td>\u003ctd>\u003cbutton class=\"ghost small\" data-act=\"vset\" data-k=\"${esc(k)}\" data-s=\"${s===1?\"0\":\"1\"}\">${s===1?\"✓ 認識\":s===0?\"✗ 不熟\":\"未標\"}\u003c/button>\u003c/td>\u003c/tr>`; }).join(\"\")}\u003c/table>\u003c/div>`;\n  }\n  app.innerHTML = h;\n}\nfunction vocabMark(s){ const k = VS.order && VS.order[VS.i]; if(!k) return; DB.vk[k] = s; save(); VS.flip = false; const list = vocabList(); if(list.length !== VS.order.length){ VS.order = VS.order.filter(x => list.some(g => g.en.toLowerCase() === x)); } else VS.i++; render(); }\nfunction vocabClick(act, t){\n  if(act === \"vmode\"){ VS.mode = t.dataset.m; return render(); }\n  if(act === \"vflip\"){ VS.flip = !VS.flip; return render(); }\n  if(act === \"vsplit\"){ VS.split = !VS.split; return render(); }\n  if(act === \"vmark\") return vocabMark(Number(t.dataset.s));\n  if(act === \"vskip\"){ VS.i++; VS.flip = false; return render(); }\n  if(act === \"vset\"){ DB.vk[t.dataset.k] = Number(t.dataset.s); save(); return render(); }\n}\n\n/* ---------- tips ---------- */\nfunction vTips(){\n  const pats = [\n    [\"Which change best reduces risk?\",\"哪一個改動最能降低風險？\",\"找「根本解」：拿掉權限 > 加確認 > 加 log\"],\n    [\"What is the most likely first place to investigate?\",\"最可能應該先查哪裡？\",\"找「題目裡唯一改變的東西」對應的那一層\"],\n    [\"Which optimization most directly addresses both?\",\"哪個優化最直接地同時解決兩者？\",\"both＝兩個限制都要解，只解一個的刪掉\"],\n    [\"Which approach is MOST appropriate?\",\"哪個做法最合適？\",\"多個選項都「能用」，選最符合題目限制的\"],\n    [\"What should the architect do FIRST?\",\"架構師第一步該做什麼？\",\"先量測／先釐清需求／先查根因，不是直接動手改\"],\n    [\"Which design meets the requirements with the LEAST operational overhead?\",\"哪個設計能滿足需求、而且維運負擔最小？\",\"LEAST overhead＝最簡單、最少自己維護的\"],\n    [\"What is the PRIMARY reason ...?\",\"主要原因是什麼？\",\"只有一個是「主要」，其他可能也對但是次要\"],\n    [\"Which TWO actions should the team take? (Choose TWO.)\",\"團隊應採取哪兩個行動？（選兩個）\",\"兩個都要對才給分；先刪明顯錯的\"],\n    [\"..., while keeping latency under 2 seconds\",\"……，同時要讓延遲維持在 2 秒以內\",\"while＝附加的硬限制，違反它的選項直接刪\"],\n    [\"... without increasing cost\",\"……，在不增加成本的前提下\",\"without＝不能做的事\"],\n    [\"... regardless of task fit\",\"不管任務適不適合\",\"通常是錯誤選項的特徵：無視條件的一刀切\"],\n    [\"Which statement BEST describes ...?\",\"哪個敘述最能描述……？\",\"概念題；找最精確、不誇大的那個\"],\n    [\"What is the MOST likely cause?\",\"最可能的原因是什麼？\",\"對照症狀出現的「時間點」和「什麼沒變」\"],\n    [\"Which TWO metrics should be tracked?\",\"應追蹤哪兩個指標？\",\"指標要能對應題目說的目標（品質／延遲／成本／安全）\"],\n    [\"The team must comply with HIPAA. ...\",\"團隊必須符合 HIPAA。……\",\"看到法規名＝答案要處理資料流（遮罩、BAA、駐留、稽核）\"]\n  ];\n  let h = `\u003ch2>英文讀題技巧\u003c/h2>`;\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">五步讀題法（每題約 1 分 54 秒）\u003c/h3>\u003col>\n    \u003cli>\u003cb>先讀最後一句（問句）\u003c/b>：抓出限定詞 \u003cb class=\"q\">BEST / MOST likely / FIRST / LEAST / NOT / Choose TWO\u003c/b>。這決定你要找「最好的」「第一步」還是「錯的那個」。\u003c/li>\n    \u003cli>\u003cb>回頭掃題幹，只找「限制條件」\u003c/b>：數字（2 秒、8,000 tokens）、\u003ci>only\u003c/i>、\u003ci>must\u003c/i>、\u003ci>both\u003c/i>、\u003ci>while\u003c/i>、\u003ci>without\u003c/i>、法規名（HIPAA、GDPR）、「什麼沒有變」（unchanged）。背景故事看過就好，不用每個字都懂。\u003c/li>\n    \u003cli>\u003cb>每個選項只問一句\u003c/b>：「它有沒有直接解決題目講的那個限制？」沒有就刪。\u003c/li>\n    \u003cli>\u003cb>先懷疑這幾種選項\u003c/b>：換更大的模型、加 log 事後再查、全部重寫、一刀切（regardless of）、加 multi-agent（題目沒說需要）。官方三題範例的錯誤選項全都是這幾型。\u003c/li>\n    \u003cli>\u003cb>卡超過 2.5 分鐘就標記跳過\u003c/b>，最後再回來。不要讓一題吃掉三題的時間。\u003c/li>\n  \u003c/ol>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">看不懂單字時\u003c/h3>\u003cul>\n    \u003cli>先判斷是\u003cb>好事還是壞事\u003c/b>就夠了：\u003ci>reduce / mitigate / ensure / improve\u003c/i> 是好事；\u003ci>bloat / stale / excessive / degrade / leak\u003c/i> 是壞事。\u003c/li>\n    \u003cli>字尾猜詞性：\u003ci>-tion / -ment / -ity\u003c/i> 是名詞、\u003ci>-ize / -ate\u003c/i> 是動詞、\u003ci>-ive / -able / -ous\u003c/i> 是形容詞、\u003ci>-ly\u003c/i> 是副詞。\u003c/li>\n    \u003cli>技術詞你本來就會（latency、cache、token、RAG、OAuth），英文差的部分通常是\u003cb>連接詞和限定詞\u003c/b>——這些在單字卡「題目限定詞與常用字」那一類，先背這一類。\u003c/li>\n  \u003c/ul>\u003c/div>`;\n  h += `\u003cdiv class=\"card pat\">\u003ch3 style=\"margin-top:0\">常見問句句型\u003c/h3>\u003cp class=\"small muted\" style=\"margin:0 0 6px\">英文例句的每個字都可以滑過或點一下看中文。\u003c/p>\u003ctable>\u003ctr>\u003cth>英文\u003c/th>\u003cth>中文\u003c/th>\u003cth>解題方向\u003c/th>\u003c/tr>${pats.map(p => `\u003ctr>\u003ctd>${tipHTML(p[0])}\u003c/td>\u003ctd>${esc(p[1])}\u003c/td>\u003ctd class=\"small\">${esc(p[2])}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/table>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">考場規則（官方 Exam Guide）\u003c/h3>\u003cul>\n    \u003cli>63 題、120 分鐘；單選＋複選，每題會寫要選幾個。\u003c/li>\n    \u003cli>換算分數 100–1000，\u003cb>720 分及格\u003c/b>；成績單會列各 Domain 答對百分比。\u003c/li>\n    \u003cli>Pearson VUE 線上監考或考場；桌面不能有任何筆記、手機、第二螢幕。\u003c/li>\n    \u003cli>沒過要等 14 天才能重考（第二次沒過等 30 天），而 12/7 會換題庫——所以\u003cb>第一次就要過\u003c/b>，重考會遇到新題庫。\u003c/li>\n    \u003cli>可以改期或取消到考前 24 小時；24 小時內改期會沒收報名費。\u003c/li>\n  \u003c/ul>\u003c/div>`;\n  app.innerHTML = h;\n}\n\n/* ---------- plan ---------- */\n// 讀書計畫＝一串有先後順序的單元：先上官方課程（照官方真實章節；每章上完只做「這一章對到的考點」的練習池題）→ 課程上完才英文直讀練習 → 最後模考。\n// 打勾的單元固定在完成那天；沒做的單元從今天起依「每日可用時間」重排，提早完成會自動往前移、落後會列出排不進去的單元。\n// 規則：單元絕對不超過當天可用時間（0 分鐘＝那種日子不排）；章節太長才切成幾部分，課後題放在最後一部分。\n// 2026-11-13 v3：①章節來自官方課程（COURSE_CH，mkplan.py 由 chapters.json 填入；還沒抓到的課沿用「依分鐘切段」）\n//               ②課後題只出「本章考點」且所有考點都已上過的練習池題（不含 C/D），解決「上第 1 段卻考整個 D1、D2」的超綱\n//               ③計畫頁加「5 門課 ↔ 7 個 Domain」對照表；每個單元連到精譯版對應章節；網址 #concept=ID、#ch=章 可直接開考點／課後題\n// 2026-11-15 版面精簡：計畫頁是唯一入口。每個單元只留一行（打勾＋名稱＋分鐘＋「① 讀這章」「② 課後題」），\n//               每格重複的說明併成一個預設收合的「說明」，對照表也預設收合；精譯版在同一個分頁開，\n//               網址 #plan 直接開計畫頁（精譯版的「回讀書計畫」、按上一頁都回到這裡）\nconst COURSE = [\n  {n:1, name:\"Claude Platform & Solution Design\", zh:\"Claude 平台與解決方案設計\", min:238, doms:[1,2], also:[3,4,5]},\n  {n:2, name:\"Enterprise Integration & Production\", zh:\"企業整合與正式上線\", min:158, doms:[3,4], also:[1,5]},\n  {n:3, name:\"Responsible AI, Safety & Risk for Architects\", zh:\"負責任的 AI、安全與風險\", min:114, doms:[5], also:[3]},\n  {n:4, name:\"Stakeholder Engagement, Lifecycle & GTM\", zh:\"利害關係人溝通、生命週期與市場推廣\", min:178, doms:[6], also:[3]},\n  {n:5, name:\"Team Enablement & Operational Productivity\", zh:\"團隊賦能與維運生產力\", min:45, doms:[7], also:[]}\n];\n// 各門課的官方章節：{門號:[{id:\"c1-01\", name, zh, min, minSrc, concepts:[考點 id…]}]}；空的＝原文還沒抓到\nconst COURSE_CH = window.__EXAM.COURSE_CH; // @@CHAPTERS@@ 由 chapters.json 填入\nconst ZH_PAGE = \"ccar-p-course-zh.html\";\nconst CH_Q_MAX = 10;      // 一章課後題最多出幾題\nconst READ_FACTOR = 1.5; // 英文閱讀較慢：課程實際花費抓官方標示時數的 1.5 倍（讀精譯版也先用同一個倍數）\nconst PLAN_START = \"2026-11-13\";\nconst MOCK_MIN = 120;     // 模考作答必須一次連續做完\n// 單元列的小按鈕：網站的樣式表在計畫段外面（上線只准改計畫段）⇒ 用 inline style\nconst PBTN = \"font-size:13px;padding:3px 10px;border-radius:7px;line-height:1.5\";\nfunction planCaps(){\n  const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === \"\" || Number.isNaN(n) ? d : Math.max(0, Math.min(600, n)); };\n  return {wd:num(DB.capWd, 120), we:num(DB.capWe, 180)};\n}\n// 某一章的課後題池：練習池（不含 C/D）裡，主要考點屬於這一章、而且題目標的每個考點都已經在「這一章或之前的章」上過\nfunction chapterPool(chId){\n  const cov = new Set(); let target = null;\n  for(const c of COURSE){\n    for(const ch of (COURSE_CH[c.n] || [])){\n      (ch.concepts || []).forEach(x => cov.add(x));\n      if(ch.id === chId){ target = ch; break; }\n    }\n    if(target) break;\n  }\n  if(!target) return [];\n  const own = new Set(target.concepts || []);\n  return BANK.filter(q => q.set !== \"C\" && q.set !== \"D\" && (q.concepts || []).length && own.has(q.concepts[0]) && q.concepts.every(x => cov.has(x))).map(q => q.id);\n}\nfunction findChapter(chId){\n  for(const c of COURSE){ const chs = COURSE_CH[c.n] || []; const i = chs.findIndex(ch => ch.id === chId); if(i >= 0) return {c, ch:chs[i], i}; }\n  return null;\n}\n// 開始某一章的課後題（學習模式、中英對照）；沒做過的題優先\nfunction startChapterSession(chId){\n  const pool = chapterPool(chId);\n  if(!pool.length) return false;\n  const list = shuffle(pool.filter(id => !DB.att[id])).concat(shuffle(pool.filter(id => DB.att[id]))).slice(0, CH_Q_MAX);\n  SESS.learn = {mode:\"learn\", list, i:0, perm:null, picked:[], answered:false, hint:false, t0:Date.now(), right:0, wrong:0, hints:0, ms:0, res:[], chapter:chId};\n  view = \"learn\";\n  return true;\n}\nfunction planUnits(){\n  const caps = planCaps();\n  const pos = [caps.wd, caps.we].filter(c => c > 0);\n  // 一個學習單元的目標長度：配合「比較少的那種日子」的時間，介於 30～55 分鐘\n  const target = pos.length ? Math.max(30, Math.min(55, Math.min(...pos))) : 55;\n  const qMin = target >= 45 ? 15 : 10;           // 每段課後做題的時間（上限）\n  const chunk = target - qMin;                   // 每段課程的時間\n  const u = [];\n  COURSE.forEach(c => {\n    const chs = COURSE_CH[c.n] || [];\n    if(chs.length){\n      chs.forEach((ch, ci) => {\n        const total = Math.max(5, Math.round(ch.min * READ_FACTOR));\n        const nq = Math.min(CH_Q_MAX, chapterPool(ch.id).length);\n        const qm = nq ? Math.min(qMin, Math.max(5, Math.ceil(nq * 1.5))) : 0;\n        const k = Math.max(1, Math.ceil(total / (target - qm)));   // 太長才切；每部分（含最後一段的課後題）都 ≤ target\n        const per = Math.ceil(total / k);\n        for(let i = 1; i \u003c= k; i++){\n          const last = i === k;\n          // 每個單元畫面上只有一行；「課後題怎麼出、切段怎麼接」的說明在計畫頁的「說明」裡講一次\n          u.push({id:`ch:${ch.id}${k > 1 ? \"-p\" + i : \"\"}`, kind:\"course\", course:c.n, ch:ch.id, last, nq:last ? nq : 0, part:i, parts:k, read:per, min:per + (last ? qm : 0),\n            title:`第 ${c.n} 門第 ${ci + 1} 章 ${ch.name}`});\n        }\n      });\n      return;\n    }\n    // 章節資料還沒抓到：沿用依分鐘切段（沒有課後題按鈕 ⇒ 這一行要自己寫出做哪個 Domain 的題）\n    const total = Math.round(c.min * READ_FACTOR);\n    const k = Math.max(1, Math.ceil(total / chunk));   // 無條件進位：每段一定 ≤ chunk，才放得進時間少的那種日子\n    const per = Math.round(total / k);\n    const dz = c.doms.map(d => \"D\" + d).join(\"、\");\n    for(let i = 1; i \u003c= k; i++){\n      u.push({id:`c${c.n}-${i}`, kind:\"course\", course:c.n, part:i, parts:k, read:per, min:per + qMin,\n        title:`第 ${c.n} 門 ${c.name} 第 ${i}／${k} 段`,\n        then:`② 學習模式 ${qMin >= 15 ? \"5–10\" : \"3–5\"} 題，Domain 只選 ${dz}`});\n    }\n  });\n  // 練習總量約 300 分鐘（120 題）；每回長度配合單元目標\n  const pMin = Math.min(50, target), rounds = Math.ceil(300 / pMin), pq = Math.round(pMin / 2.5);\n  for(let i = 1; i \u003c= rounds; i++){\n    u.push({id:`p${i}`, kind:\"practice\", min:pMin, title:`練習模式 ${pq} 題　第 ${i}／${rounds} 回`});\n  }\n  [[\"C\", \"本站模考 C（保留卷）\"], [\"D\", \"本站模考 D（保留卷）\"], [\"AB\", \"本站模考 A 或 B（挑做過比較少的那卷）\"]].forEach(([k, t], i) => {\n    u.push({id:`m${k}`, kind:\"mock\", mock:k, min:MOCK_MIN, title:t});\n    u.push({id:`r${i + 1}`, kind:\"review\", min:45, title:\"檢討上一回模考\"});\n  });\n  return u;\n}\n// 舊版計畫（依分鐘切段）的打勾，在那門課改成章節之後就對不上了：列出來請他改勾章節\nfunction planLegacy(){\n  const pd = DB.planDone || {};\n  return Object.keys(pd).filter(k => { const m = k.match(/^c(\\d)-(\\d+)$/); return m && (COURSE_CH[m[1]] || []).length; }).map(k => ({id:k, d:pd[k]}));\n}\n// 回傳完成日（YYYY-MM-DD）或 null；模考單元若已有對應卷別的交卷紀錄，視為已完成\nfunction unitDone(u){\n  const pd = DB.planDone || {};\n  if(pd[u.id]) return pd[u.id];\n  if(u.kind === \"mock\"){\n    const names = u.mock === \"AB\" ? [\"模考 A\", \"模考 B\"] : [\"模考 \" + u.mock];\n    const x = DB.exams.find(e => names.includes(e.kind));\n    if(x) return ymd(new Date(x.t));\n  }\n  return null;\n}\nfunction planSchedule(){\n  const today = ymd(new Date());\n  const exam = DB.examDate || \"2026-12-06\";\n  const caps = planCaps();\n  const maxCap = Math.max(caps.wd, caps.we);\n  const units = planUnits();\n  // 計畫從「11/13、今天、最早完成日」三者中最早的那天開始顯示：\n  // 11/12 就打勾的單元要出現在 11/12 那列，不能被塞進第一列（2026-11-12 Peter 回報的 bug）\n  const doneDates = units.map(unitDone).filter(Boolean);\n  const start = [PLAN_START, today, ...doneDates].sort()[0];\n  const days = [];\n  for(let d = new Date(start + \"T00:00:00\"), e = new Date(exam + \"T00:00:00\"); d \u003c= e; d.setDate(d.getDate() + 1)) days.push(ymd(d));\n  // 考前最後 2 天＋考試日不排新單元；沒設考試日時最後 3 天都是複習\n  const reviewFrom = days[Math.max(0, days.length - 3)];\n  const byDay = {};\n  days.forEach(d => { byDay[d] = {done:[], todo:[], used:0}; });\n  const left = [], tooBig = [];\n  units.forEach(u => {\n    const dd = unitDone(u);\n    if(dd){\n      const k = byDay[dd] ? dd : days[days.length - 1];   // 只有完成日在考試日之後才會走到這裡\n      byDay[k].done.push(u); byDay[k].used += u.min;\n    } else if(u.min > maxCap) tooBig.push(u);     // 任何一天都放不下（例如每天都不到 120 分鐘卻要模考）\n    else left.push(u);\n  });\n  let i = 0;\n  for(const d of days){\n    if(d \u003c today || d >= reviewFrom || i >= left.length) continue;\n    const wd = new Date(d + \"T00:00:00\").getDay();\n    let cap = (wd === 0 || wd === 6 ? caps.we : caps.wd) - byDay[d].used;\n    // 依順序放，放得下才放；下一個放不下就換下一天（不會為了塞進去而超時）\n    while(i \u003c left.length && left[i].min \u003c= cap){\n      left[i].sched = d; byDay[d].todo.push(left[i]); cap -= left[i].min; i++;\n    }\n  }\n  return {days, byDay, overflow:left.slice(i), tooBig, left, exam, reviewFrom, today, caps, units};\n}\nfunction planMapTable(){\n  let h = `\u003cdetails style=\"margin-top:6px\">\u003csummary class=\"small\">5 門課 ↔ 考試 7 個 Domain\u003c/summary>\n    \u003cp class=\"small muted\" style=\"margin:6px 0 8px\">考試配分照 Exam Guide 的 7 個 Domain；備考課程分成 5 門，是兩套不同的分類。對應是依各門課官方頁面的學習目標推的（官方沒有標）。\u003c/p>\n    \u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"plan\">\u003ctr>\u003cth>官方課程\u003c/th>\u003cth>主要 Domain（配分）\u003c/th>\u003cth>也會碰到\u003c/th>\u003cth>章節\u003c/th>\u003c/tr>`;\n  COURSE.forEach(c => {\n    const chs = COURSE_CH[c.n] || [];\n    h += `\u003ctr>\u003ctd>\u003ca style=\"color:var(--accent)\" href=\"${ZH_PAGE}#c${c.n}\" data-act=\"read\">第 ${c.n} 門 ${esc(c.name)}\u003c/a>\u003cbr>\u003cspan class=\"small muted\">${esc(c.zh)} · 官方 ${c.min} 分鐘\u003c/span>\u003c/td>\n      \u003ctd class=\"small\">${c.doms.map(d => `D${d} ${esc(DOMAINS[d].zh)}（${DOMAINS[d].w}%）`).join(\"\u003cbr>\")}\u003c/td>\n      \u003ctd class=\"small\">${c.also.map(d => \"D\" + d).join(\"、\") || \"—\"}\u003c/td>\n      \u003ctd class=\"small\">${chs.length ? `${chs.length} 章（照官方章節排）` : \"還沒抓到（暫時依分鐘切段）\"}\u003c/td>\u003c/tr>`;\n  });\n  return h + `\u003c/table>\u003c/div>\u003c/details>`;\n}\n// 「說明」：原本散在頁首、每個單元、表格下方的說明，集中在這裡講一次（預設收合）\nfunction planNote(){\n  const legacy = COURSE.filter(c => !(COURSE_CH[c.n] || []).length);\n  const li = [\n    `順序固定：先讀官方課程（\u003ca style=\"color:var(--accent)\" href=\"${ZH_PAGE}\" data-act=\"read\">精譯版\u003c/a>）→ 課程全部讀完才做英文直讀練習 → 最後模考。`,\n    `② 課後題：只出這一章考點的練習題（中英對照、最多 ${CH_Q_MAX} 題，沒做過的先出；不含模考 C／D，不會考到還沒讀的內容）。沒有這種題的章就沒有 ② 按鈕，讀完直接打勾。`,\n    `章節太長會切成前半／後半（或第 1／3 段…），課後題放在最後一段。`\n  ];\n  if(legacy.length) li.push(`第 ${legacy.map(c => c.n).join(\"、\")} 門的章節資料還沒抓到，暫時依分鐘切段：讀完做學習模式，Domain 只選那門課的主要 Domain（會出到還沒讀的內容，當預習、答錯不用在意）。`);\n  li.push(`練習：英文直讀、只出沒做過的；卡住才按「看中文」，做完把錯題重練一次。目標：看中文 \u003c 20%。`,\n    `模考：63 題，一次連續作答 ${MOCK_MIN} 分鐘，中途不要停；交卷後會自動打勾。檢討：逐題看解答＋錯題本重練，分數最低的 Domain 回去重讀對應的那門課（下面的對照表）。`,\n    `排程：每個單元都不會超過當天的可用時間（填 0＝那種日子不排）。打勾的單元留在完成那天，其他單元從今天起自動重排（提早完成就往前移）；空檔的日子有時間可以直接做下一個單元。考前最後 2 天是複習日。考試日要在 12/7 換題庫之前；沒設定就以 12/6 計算。`,\n    `時間是估計：課程抓官方標示的 1.5 倍（讀英文比較慢）；課程單元後面的分鐘是閱讀時間，右欄「預估」是當天合計（含每章做題 5–15 分）；練習一回 25–50 分；模考 ${MOCK_MIN} 分、檢討 45 分。`,\n    `官方備考課程（免費）：Anthropic Partner Academy → Exam prep courses → Claude Certified Architect - Professional Prep Course，共 5 門，官方標示 ${COURSE.map(c => c.min).join(\"／\")} 分鐘。`);\n  return `\u003cdetails id=\"plannote\" style=\"margin-top:8px\">\u003csummary class=\"small\">說明\u003c/summary>\u003cul class=\"small\" style=\"margin:6px 0 0;padding-left:20px\">${li.map(x => `\u003cli>${x}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/details>`;\n}\n// 課程單元的「① 讀這章」：切開的章標出讀哪一段（2 段＝前半／後半；3 段以上＝第 i／k 段）\nfunction planReadLabel(u){\n  if(!u.ch) return \"① 讀這段\";\n  if(u.parts \u003c= 1) return \"① 讀這章\";\n  if(u.parts === 2) return u.part === 1 ? \"① 讀這章（前半）\" : \"① 讀這章（後半）\";\n  return `① 讀這章（第 ${u.part}／${u.parts} 段）`;\n}\nfunction vPlan(){\n  const P = planSchedule();\n  const inp = \"font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);width:84px\";\n  let h = `\u003ch2>讀書計畫\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"row\">\n    \u003clabel>我的考試日 \u003cinput type=\"date\" id=\"examdate\" value=\"${esc(DB.examDate)}\" min=\"2026-11-13\" max=\"2026-12-06\">\u003c/label>\n    \u003clabel>平日每天 \u003cinput type=\"number\" id=\"capwd\" min=\"0\" max=\"600\" step=\"10\" value=\"${P.caps.wd}\" style=\"${inp}\"> 分鐘\u003c/label>\n    \u003clabel>假日每天 \u003cinput type=\"number\" id=\"capwe\" min=\"0\" max=\"600\" step=\"10\" value=\"${P.caps.we}\" style=\"${inp}\"> 分鐘\u003c/label>\u003c/div>\n    \u003cp id=\"planhow\" style=\"margin:10px 0 0\">\u003cb>每天由上往下：① 讀這章 → ② 做課後題 → 打勾\u003c/b>\u003c/p>\n    ${planNote()}${planMapTable()}\u003c/div>`;\n  const legacy = planLegacy();\n  if(legacy.length && !DB.planLegacyAck){\n    h += `\u003cdiv class=\"card\" style=\"border-color:var(--warn)\">\u003cb>計畫改版了：課程改成照官方章節排\u003c/b>\u003cp class=\"small\" style=\"margin:6px 0\">你在舊版計畫勾過：${legacy.map(x => `${esc(x.id.replace(/^c(\\d)-(\\d+)$/, \"第 $1 門第 $2 段\"))}（${esc(x.d.slice(5))}）`).join(\"、\")}。舊版是用分鐘數硬切的段落，對不到新的章節，所以沒有自動換算。請在下面把你\u003cb>已經上完的章節\u003c/b>重新打勾。\u003c/p>\u003cbutton data-act=\"legacyok\">我知道了\u003c/button>\u003c/div>`;\n  }\n  // 進度一行＋警告各一行，放在表格上面\n  const doneN = P.units.filter(u => unitDone(u)).length;\n  const cLeft = P.left.filter(u => u.kind === \"course\");\n  const sch = P.left.filter(u => u.sched);\n  const allEnd = sch.length ? sch[sch.length - 1].sched : null;\n  const warn = s => `\u003cdiv class=\"small\" style=\"color:var(--bad);margin-top:4px\">⚠ ${s}\u003c/div>`;\n  let st = `\u003cb>已完成 ${doneN} / ${P.units.length} 個單元\u003c/b>`, warns = \"\";\n  if(P.caps.wd === 0 && P.caps.we === 0){\n    warns += warn(\"平日和假日都設成 0 分鐘，排不進任何單元。\");\n  } else {\n    if(P.tooBig.length) warns += warn(`模考要一次連續作答 ${MOCK_MIN} 分鐘，但每天的可用時間都不到 ⇒ ${P.tooBig.length} 回模考排不進去：把假日設到至少 ${MOCK_MIN} 分鐘。`);\n    if(P.overflow.length){\n      const m = P.overflow.reduce((s, u) => s + u.min, 0);\n      warns += warn(`還有 \u003cb>${P.overflow.length} 個單元\u003c/b>（約 ${m} 分鐘，從「${esc(P.overflow[0].title)}」起）排不進考前：調高每日時間，或把考試日往後挪（最晚 12/6）。`);\n    } else if(P.left.length){\n      const courseEnd = cLeft.length ? cLeft[cLeft.length - 1].sched : null;\n      const buf = allEnd ? dayDiff(allEnd, P.reviewFrom) - 1 : 0;\n      st += ` · 課程${courseEnd ? `預計 \u003cb>${courseEnd.slice(5)}\u003c/b> 讀完` : \"已全部讀完\"}，全部單元預計 \u003cb>${allEnd.slice(5)}\u003c/b> 做完（複習日前緩衝 ${Math.max(0, buf)} 天）`;\n    } else if(!P.tooBig.length){\n      st += \" · 全部單元都完成了，剩下的天數照複習日的做法就好\";\n    }\n  }\n  h += `\u003cdiv class=\"card\">\u003cdiv class=\"small\" id=\"planstat\">${st}\u003c/div>${warns}\u003ctable class=\"plan\" style=\"margin-top:8px\">\u003ctr>\u003cth style=\"width:96px\">日期\u003c/th>\u003cth>要做的單元（打勾＝完成）\u003c/th>\u003cth style=\"width:64px\">預估\u003c/th>\u003c/tr>`;\n  const pd = DB.planDone || {};\n  // 一個單元一行：打勾＋名稱·分鐘＋必要按鈕（課程：① 讀這章、最後一段且有題才有 ② 課後題）\n  const unitRow = (u, done) => {\n    const auto = u.kind === \"mock\" && !pd[u.id] && !!unitDone(u);\n    let btn = \"\";\n    if(u.kind === \"course\"){\n      btn = `\u003ca class=\"btn\" style=\"${PBTN};text-decoration:none;color:var(--accent)\" href=\"${ZH_PAGE}#${u.ch || \"c\" + u.course}\" data-act=\"read\">${planReadLabel(u)}\u003c/a>`;\n      if(u.last && u.nq) btn += `\u003cbutton style=\"${PBTN}\" data-act=\"chq\" data-ch=\"${esc(u.ch)}\">② 課後題（${u.nq} 題）\u003c/button>`;\n      if(u.then) btn += `\u003cspan class=\"small muted\">${esc(u.then)}\u003c/span>`;\n      btn = `\u003cspan style=\"display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px\">${btn}\u003c/span>`;   // 窄螢幕換行時兩顆按鈕留在同一行\n    }\n    return `\u003cdiv class=\"pu\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:4px 0\">\u003clabel style=\"display:inline-flex;gap:8px;align-items:center\">\u003cinput type=\"checkbox\" data-pu=\"${u.id}\" ${done ? \"checked\" : \"\"} ${auto ? \"disabled\" : \"\"}>\u003cspan${done ? ' class=\"muted\"' : \"\"}>${esc(u.title)} \u003cspan class=\"small muted\">· ${u.read || u.min} 分${auto ? \"（已有交卷紀錄）\" : \"\"}\u003c/span>\u003c/span>\u003c/label>${btn}\u003c/div>`;\n  };\n  P.days.forEach(d => {\n    const wdN = new Date(d + \"T00:00:00\").getDay();\n    const wd = \"日一二三四五六\"[wdN];\n    const isExam = !!DB.examDate && d === P.exam;\n    const isRev = d >= P.reviewFrom && !isExam;\n    const b = P.byDay[d];\n    const cap = wdN === 0 || wdN === 6 ? P.caps.we : P.caps.wd;\n    let cell = \"\";\n    if(isExam) cell = \"考試：睡飽、提早報到。看題先找限定詞與限制條件，超過 2.5 分鐘先標記跳過。\";\n    else if(isRev) cell = \"複習日：只做錯題本＋單字卡「標為不熟的」，不做新題；把讀題技巧頁再讀一遍。\";\n    cell += b.done.map(u => unitRow(u, true)).join(\"\") + b.todo.map(u => unitRow(u, false)).join(\"\");\n    if(!cell) cell = d \u003c P.today ? '\u003cspan class=\"muted\">—\u003c/span>' : (cap === 0 ? '\u003cspan class=\"small muted\">（0 分鐘，不排）\u003c/span>' : '\u003cspan class=\"small muted\">（空檔）\u003c/span>');\n    const mins = b.used + b.todo.reduce((s, u) => s + u.min, 0);\n    h += `\u003ctr class=\"${d === P.today ? \"today\" : \"\"} ${d \u003c P.today ? \"past\" : \"\"} ${isExam ? \"exam\" : \"\"}\">\u003ctd>${d.slice(5)}（${wd}）\u003c/td>\u003ctd>${cell}\u003c/td>\u003ctd class=\"small\">${mins ? mins + \" 分\" : \"\"}${!isExam && !isRev && d >= P.today ? `\u003cbr>\u003cspan class=\"muted\">可用 ${cap}\u003c/span>` : \"\"}\u003c/td>\u003c/tr>`;\n  });\n  h += `\u003c/table>\u003c/div>`;\n  app.innerHTML = h;\n}\nfunction planChange(t){\n  if(t.id === \"examdate\"){ DB.examDate = t.value; save(); render(); return; }\n  if(t.id === \"capwd\" || t.id === \"capwe\"){\n    const n = Number(t.value);\n    const v = Number.isNaN(n) ? 0 : Math.max(0, Math.min(600, n));\n    if(t.id === \"capwd\") DB.capWd = v; else DB.capWe = v;\n    save(); render(); return;\n  }\n  if(t.dataset.pu){\n    DB.planDone = DB.planDone || {};\n    if(t.checked) DB.planDone[t.dataset.pu] = ymd(new Date()); else delete DB.planDone[t.dataset.pu];\n    save(); render();\n  }\n}\n// 網址直達：#concept=1.1-03 開考點清單並捲到那一張；#ch=c1-03 直接開那一章的課後題（從精譯版點過來）；\n// #plan 開讀書計畫（精譯版的「回讀書計畫」用這個）\nfunction planHash(){\n  const h = decodeURIComponent(location.hash.slice(1));\n  if(h === \"plan\"){ view = \"plan\"; return true; }\n  let m = h.match(/^concept=(.+)$/);\n  if(m && CONCEPTS.some(c => c.id === m[1])){ CS.d = m[1].split(\".\")[0]; CS.weak = false; CS.sort = \"id\"; CS.focus = m[1]; view = \"concepts\"; return true; }\n  m = h.match(/^ch=(c\\d+-\\d+)$/);\n  if(m){ if(!startChapterSession(m[1])) view = \"plan\"; return true; }\n  return false;\n}\nfunction planFocus(){\n  if(!CS.focus || view !== \"concepts\") return;\n  const el = app.querySelector(`.cpt[data-cid=\"${CS.focus}\"]`);\n  if(el){ el.scrollIntoView({block:\"center\"}); el.style.outline = \"3px solid var(--accent)\"; }\n  CS.focus = null;\n}\nplanHash();\nsetTimeout(planFocus, 0);\nwindow.addEventListener(\"hashchange\", () => { if(planHash()){ render(); window.scrollTo(0, 0); planFocus(); } });\nfunction planClick(act, t){\n  // 「① 讀這章」在同一個分頁開精譯版：先把這頁的網址記成 #plan，讀完按上一頁就回到計畫頁（不擋連結本身的跳轉）\n  if(act === \"read\"){ try { history.replaceState(null, \"\", \"#plan\"); } catch(e) {} return; }\n  if(act === \"chq\"){ if(startChapterSession(t.dataset.ch)){ render(); window.scrollTo(0, 0); } return; }\n  if(act === \"legacyok\"){ DB.planLegacyAck = true; save(); render(); }\n}\n/* ---------- plan end ---------- */\n\nrender();\n\u00
