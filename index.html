3c/script>\n\u003c/body>\n\u003c/html>\n", "names": ["BANK", "CONCEPTS", "QGLOSS", "TASKS", "CORE_VOCAB", "COURSE_CH"], "zhPage": "ccar-p-course-zh.html"}};
/* 模擬考（CCAR-F／CCAR-P）：原模擬考頁的程式在 EXAM_TPL（資料常數已換成 window.__EXAM.X），
   題庫與其他資料從 Supabase 讀（exam_questions、exam_meta），組回原本的常數後放進 iframe srcdoc 執行
   - 網址：#f/exam[/concept=1.1-03 | ch=c1-03 | plan]，與原頁的 #concept=…／#ch=…／#plan 相同
   - 框內連到課程頁的連結（ccar-?-course-zh.html#c1-03）改成單頁網址 */
const Exam = (function () {
  "use strict";
  const box = document.getElementById("ex");
  const MARK = "/*__EXAM_DATA__*/";
  const DATA = Object.create(null);
  let track = null;
  let frame = null;

  function msg(text) {
    box.innerHTML = `<div class="pc-msg">${esc(text)}</div>`;
    frame = null;
    track = null;
  }

  function load(t) {
    if (!DATA[t]) {
      DATA[t] = Promise.all([
        sb(`exam_questions?select=id,data,gloss&track_code=eq.${t}&order=sort_order`),
        sb(`exam_meta?select=name,data&track_code=eq.${t}`)
      ]).then(([qs, meta]) => {
        if (!qs.length) throw new Error("讀不到題庫（或目前的網路不在允許的 IP 名單內）");
        const E = Object.create(null);
        meta.forEach(m => { E[m.name] = m.data; });
        E.BANK = qs.map(q => q.data);
        const qg = {};
        qs.forEach(q => { if (q.gloss) qg[q.id] = q.gloss; });
        E.QGLOSS = Object.assign(qg, E.QGLOSS_EXTRA || {});
        delete E.QGLOSS_EXTRA;
        const miss = EXAM_TPL[t].names.filter(n => !(n in E));
        if (miss.length) throw new Error("資料庫缺少模擬考資料：" + miss.join("、"));
        return E;
      }).catch(err => {
        delete DATA[t];
        throw err;
      });
    }
    return DATA[t];
  }

  // 框內網址換成 #hash 並通知模擬考程式（它聽 hashchange）
  // srcdoc 的相對網址會以父頁為基準而被擋（SecurityError），所以一律寫完整的 about:srcdoc#…
  function setInnerHash(h) {
    const w = frame && frame.contentWindow;
    if (!w) return;
    try {
      w.history.replaceState(null, "", "about:srcdoc#" + h);
      w.dispatchEvent(new HashChangeEvent("hashchange"));
    } catch (e) { console.warn(e); }
  }

  // ccar-f-course-zh.html#c2 → #f/c2；#c1-03 → #f/c1/c1-03；沒有 # → 首頁頁籤
  function courseRoute(t, hash) {
    const m = String(hash || "").match(/^c(\d+)(?:-\d+)?$/);
    if (!m) return "#" + t;
    return hash.includes("-") ? `#${t}/c${m[1]}/${hash}` : `#${t}/c${m[1]}`;
  }

  function mount(t, E, hash) {
    track = t;
    const json = JSON.stringify(E).replace(/\x3C/g, "\\u003C");
    const inject = "\x3Cscript>window.__EXAM=" + json + ";try{history.replaceState(null,\"\",\"about:srcdoc#\"+" +
      JSON.stringify(hash || "") + ")}catch(e){}\x3C/script>";
    const html = EXAM_TPL[t].html.replace(MARK, () => inject);
    box.innerHTML = "";
    frame = document.createElement("iframe");
    frame.title = t === "f" ? "CCAR-F 模擬考" : "CCAR-P 模擬考";
    frame.addEventListener("load", () => {
      const page = EXAM_TPL[t].zhPage;
      frame.contentDocument.addEventListener("click", e => {
        const a = e.target.closest && e.target.closest("a[href]");
        if (!a) return;
        const href = a.getAttribute("href");
        if (href === page || href.startsWith(page + "#")) {
          e.preventDefault();
          location.hash = courseRoute(t, href.split("#")[1]);
        }
      }, true);
    });
    frame.srcdoc = html;
    box.appendChild(frame);
    document.title = frame.title + "（CCAR 官方備考課程・中文版）";
  }

  return {
    get track() {
      return track;
    },
    msg,
    load,
    mount,
    open(hash) {
      document.title = (track === "f" ? "CCAR-F 模擬考" : "CCAR-P 模擬考") + "（CCAR 官方備考課程・中文版）";
      if (hash) setInnerHash(hash);
    }
  };
})();

/* ---------- 單頁路由 ----------
   #f／#p（或空白）     首頁，對應專區頁籤
   #f/c{門}[/{單元或章}] CCAR-F 課程頁
   #p/c{門}[/{章或段落}] CCAR-P 課程頁
   #f/exam[/{concept=…|ch=…|plan}]、#p/exam[/…] 模擬考 */
const HOME_TITLE = document.title;
const COURSE_CACHE = Object.create(null);
let routeSeq = 0;

function courseRow(track, n) {
  const k = track + n;
  if (!COURSE_CACHE[k]) {
    const cols = track === "p" ? "data,frame_html" : "data";
    COURSE_CACHE[k] = sb(`course_content?select=${cols}&track_code=eq.${track}&course_n=eq.${n}`).then(rows => {
      if (!rows.length) throw new Error(`找不到第 ${n} 門課的資料（或目前的網路不在允許的 IP 名單內）`);
      return rows[0];
    }).catch(err => {
      delete COURSE_CACHE[k];
      throw err;
    });
  }
  return COURSE_CACHE[k];
}

function setView(v) {
  document.body.classList.toggle("v-fcourse", v === "fcourse");
  document.body.classList.toggle("v-pcourse", v === "pcourse");
  document.getElementById("home").hidden = v !== "home";
  document.getElementById("fc").hidden = v !== "fcourse";
  document.getElementById("pc").hidden = v !== "pcourse";
  document.getElementById("ex").hidden = v !== "exam";
  document.body.classList.toggle("v-exam", v === "exam");
  if (v !== "fcourse") FCourse.hidePop();
}

async function router() {
  const seq = ++routeSeq;
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  let m = h.match(/^f\/c(\d+)(?:\/(.*))?$/);
  if (m) {
    const n = +m[1];
    setView("fcourse");
    if (FCourse.n !== n) {
      FCourse.loading("載入課程中…");
      try {
        const row = await courseRow("f", n);
        if (seq !== routeSeq) return;
        FCourse.load(row.data);
      } catch (err) {
        if (seq !== routeSeq) return;
        console.error(err);
        FCourse.loading("課程資料載入失敗：" + err.message);
        return;
      }
    }
    FCourse.open(m[2] || "");
    return;
  }
  m = h.match(/^p\/c(\d+)(?:\/(.*))?$/);
  if (m) {
    const n = +m[1];
    setView("pcourse");
    if (PCourse.n !== n) {
      PCourse.msg("載入課程中…（每門約 2 MB，第一次開比較久）");
      try {
        const row = await courseRow("p", n);
        if (seq !== routeSeq) return;
        PCourse.mount(n, row, m[2] || "");
      } catch (err) {
        if (seq !== routeSeq) return;
        console.error(err);
        PCourse.msg("課程資料載入失敗：" + err.message);
      }
      return;
    }
    PCourse.open(m[2] || "");
    return;
  }
  m = h.match(/^(f|p)\/exam(?:\/(.*))?$/);
  if (m) {
    const t = m[1];
    setView("exam");
    if (Exam.track !== t) {
      Exam.msg("載入模擬考題庫中…（約 3 MB，第一次開比較久）");
      try {
        const E = await Exam.load(t);
        if (seq !== routeSeq) return;
        Exam.mount(t, E, m[2] || "");
      } catch (err) {
        if (seq !== routeSeq) return;
        console.error(err);
        Exam.msg("模擬考資料載入失敗：" + err.message);
      }
      return;
    }
    Exam.open(m[2] || "");
    return;
  }
  setView("home");
  document.title = HOME_TITLE;
  switchTab(h.toLowerCase() === "p" ? "p" : "f");
}

window.addEventListener("hashchange", router);

router();
document.getElementById("list-f").innerHTML = document.getElementById("list-p").innerHTML = '<p class="src">載入中…</p>';
loadData().then(() => {
  renderF();
  renderP();
}).catch(err => {
  console.error(err);
  document.getElementById("list-f").innerHTML = document.getElementById("list-p").innerHTML =
    `<p class="src">課程資料載入失敗：${esc(err.message)}</p>`;
});
</script>
