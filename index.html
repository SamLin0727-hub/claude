<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR 官方備考課程・中文版</title>
<style>
:root {
  color-scheme: light;
  --bg: #faf9f5;
  --surface: #e8e6dc;
  --ink: #141413;
  --mid: #615f5b;
  --muted: #8f8b80;
  --white: #ffffff;
  --line: #d1cfc5;
  --primary: #2c2b25;
  --primary-hover: #141413;
  --accent-p: #d97757;
  --accent-p-hover: #bd5d3a;
  --tint-p: #f4ddd2;
  --font: "Styrene B", "Segoe UI", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  --head: Copernicus, Georgia, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.7 var(--font); }
.wrap { max-width: 880px; margin: 0 auto; padding: 28px 16px 64px; }
h1 { font: 600 28px/1.3 var(--head); letter-spacing: -0.6px; margin: 0 0 6px; }
.src { color: var(--mid); font-size: 14px; margin: 0 0 22px; }

/* 頂部專區切換按鈕 */
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.tab-btn {
  cursor: pointer;
  text-align: left;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
  transition: all 0.15s ease;
  font-family: inherit;
  color: var(--ink);
}
.tab-btn:hover { border-color: var(--mid); }
.tab-btn .tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 2px 9px;
  border-radius: 999px;
  margin-bottom: 6px;
}
.tab-btn.f .tag { background: #efede6; color: var(--primary); }
.tab-btn.p .tag { background: var(--tint-p); color: var(--accent-p-hover); }
.tab-btn .title { display: block; font-size: 18px; font-weight: 600; }
.tab-btn .desc { display: block; font-size: 13px; color: var(--mid); margin-top: 2px; }

.tab-btn.f.active { border-color: var(--primary); box-shadow: 0 4px 14px rgba(20, 20, 19, 0.08); }
.tab-btn.p.active { border-color: var(--accent-p); box-shadow: 0 4px 14px rgba(217, 119, 87, 0.14); }

/* 專區標題列與直接前往按鈕 */
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.sec-head h2 { margin: 0; font-size: 20px; font-family: var(--head); }
.sec-actions { display: flex; gap: 14px; font-size: 14px; }
.sec-actions a { color: var(--primary-hover); font-weight: 600; text-decoration: none; }
.sec-actions a:hover { text-decoration: underline; }
.theme-p .sec-actions a { color: var(--accent-p-hover); }

/* 課程卡片樣式 */
.course {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 14px;
  margin: 0 0 14px;
  overflow: hidden;
}
.course > summary {
  cursor: pointer;
  list-style: none;
  padding: 14px 18px;
  display: flex;
  gap: 12px;
  align-items: baseline;
  flex-wrap: wrap;
}
.course > summary::-webkit-details-marker { display: none; }
.course .num { font-size: 11px; letter-spacing: 0.12em; color: var(--mid); font-weight: 600; white-space: nowrap; }
.theme-p .course .num { color: var(--accent-p); }
.course .t { font-weight: 600; font-size: 17px; font-family: var(--head); }
.theme-p .course .t { font-family: var(--font); }
.course .en { color: var(--mid); font-size: 13px; width: 100%; }
.course .tag { color: var(--mid); font-size: 14px; width: 100%; }
.course .go { margin-left: auto; font-size: 13px; color: var(--primary-hover); text-decoration: none; white-space: nowrap; font-weight: 600; }
.theme-p .course .go { color: var(--accent-p-hover); }

ol.ch { margin: 0; padding: 4px 18px 14px 46px; border-top: 1px solid var(--line); }
ol.ch li { margin: 6px 0; }
ol.ch a { color: var(--ink); text-decoration: none; }
ol.ch a:hover { color: var(--primary-hover); text-decoration: underline; }
.theme-p ol.ch a:hover { color: var(--accent-p-hover); }
ol.ch .m { color: var(--muted); font-size: 12.5px; margin-left: 6px; }
ol.ch .e { color: var(--mid); font-size: 12.5px; display: block; }

/* 常見疑問摺疊區塊 */
.more { margin-top: 26px; }
.more > summary { cursor: pointer; color: var(--mid); font-size: 14px; font-weight: 600; }
.qa { background: var(--white); border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; }
.qa > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; }
.qa .b { padding: 0 14px 12px; font-size: 15px; }
.qa .b p { margin: 8px 0; }

.hidden { display: none; }
</style>
<style>
/* ===== CCAR-F 課程頁（原 ccar-f-course-zh-cN.html） ===== */
/* CCAR-F 官方課程中文版：照官方 Skilljar 單元頁的實際樣式（2026-11-16 在官方頁 getComputedStyle 讀出）
   官方沒有深色模式 ⇒ 只有淺色。官方字型（Tiempos／Copernicus／Styrene）是 Anthropic 自有字型、不隨檔附帶：
   字型名照官方排第一順位，英文退到 Georgia（serif）／Segoe UI，中文用微軟正黑體。 */
body.v-fcourse{color-scheme:light;
  --bg:#faf9f5;--side:#f0eee6;--ink:#141413;--ink2:#2a2a2a;--mid:#615f5b;--muted:#8f8b80;
  --rule:#d1cfc5;--rule2:#d5d5d5;--toprule:#c5ccd5;--white:#fff;--btn:#2c2b25;--code-ink:#a10d0d;--code-bg:#eee;
  --primary:#d97757;--primary-hover:#bd5d3a;--tint:#f4ddd2;--green:#788c5d;--green-h:#5d7045;--green-t:rgba(227,236,222,.55);
  --serif:Tiempos,"Tiempos Text",Georgia,"Times New Roman","Microsoft JhengHei","PingFang TC","Noto Sans TC",serif;
  --head:Copernicus,Georgia,"Microsoft JhengHei","PingFang TC","Noto Sans TC",serif;
  --sans:"Styrene B","Styrene A","Segoe UI",Arial,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
  --mono:Consolas,"Liberation Mono",Courier,monospace}
*{box-sizing:border-box}
body.v-fcourse{height:100vh;background:var(--bg);color:var(--ink)}
#fc{height:100%}
body.v-fcourse{font:20px/34px var(--serif);letter-spacing:-.3px;overflow:hidden}
:where(#fc) a{color:var(--ink)}
/* 頂部：官方 60px、底色同頁面、沒有分隔線 */
.zl-top{height:60px;display:flex;align-items:center;gap:26px;padding:0 20px;background:var(--bg);font:16px/1.7 var(--sans);letter-spacing:-.3px}
.zl-top .zl-brand{font-weight:700;letter-spacing:.04em;font-size:17px}
.zl-top a{color:#000;text-decoration:none}
.zl-top a:hover{text-decoration:underline}
.zl-top .sp{flex:1}
#zl-menu{display:none;border:1px solid var(--rule);background:var(--white);color:var(--ink);border-radius:8px;padding:4px 10px;font:15px var(--sans);cursor:pointer}
.zl-wrap{display:flex;height:calc(100% - 60px - 50px)}
/* 側欄：官方 420px、#f0eee6、右邊 1px #d5d5d5 */
#zl-sb{width:420px;flex:none;background:var(--side);overflow-y:auto;border-right:1px solid var(--rule2)}
#zl-course{padding:52px 16px 4px;font:600 26px/36.4px var(--head);letter-spacing:-.65px;color:var(--ink)}
.zl-course-en{display:block;font:400 14px/1.5 var(--sans);color:var(--mid);margin-top:4px;letter-spacing:0}
.zl-sblinks{padding:2px 16px 20px;font:18px/20px var(--sans);letter-spacing:-.3px}
.zl-sblinks a{color:var(--mid);text-decoration:underline}
.zl-sec-h{padding:32px 16px 10px;font:500 18px/20px var(--sans);color:var(--ink2)}
.zl-item{display:flex;gap:9px;align-items:center;min-height:44px;padding:11px 12px 9px;border-bottom:1px solid var(--rule);color:var(--ink);text-decoration:none;font:18px/1.35 var(--serif);letter-spacing:-.3px}
.zl-item:hover{text-decoration:underline}
/* 完成圈：看過＝實心勾、沒看過＝空心圈（官方 fa-check-circle／fa-circle-o） */
.zl-ic{width:16px;height:16px;flex:none;border:1.5px solid var(--ink);border-radius:50%;position:relative;opacity:.55}
.zl-item.seen .zl-ic{background:var(--ink);opacity:1}
.zl-item.seen .zl-ic::after{content:"";position:absolute;left:4.3px;top:1.6px;width:3.5px;height:7px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.zl-item.active .zl-it{text-decoration:underline;text-underline-offset:3px}
#zl-main{flex:1;overflow-y:auto}
.zl-inner{max-width:900px;margin:0 auto;padding:36px 40px 70px}
/* 標題列：官方 padding 12 0 10、底線 1px #c5ccd5；標題 Copernicus 24/600 #2a2a2a */
.zl-head{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--toprule);padding:12px 0 10px;margin-bottom:16px}
.zl-head .zl-ht{flex:1;min-width:0}
#zl-sec{font:14px/1.4 var(--sans);color:var(--mid);margin-bottom:2px;letter-spacing:0}
#zl-title{margin:0;font:600 24px/33.6px var(--head);letter-spacing:-.6px;color:var(--ink2)}
#zl-tog{flex:none;font:500 14px/1 var(--sans);color:var(--ink2);background:var(--white);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;cursor:pointer}
#zl-tog:hover{border-color:var(--ink2)}
#zl-tog[aria-pressed="true"]{background:var(--side)}
.zl-video{position:relative;width:100%;aspect-ratio:16/9;background:#000;margin:0 0 6px;overflow:hidden}
.zl-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.zl-yt{position:absolute;inset:0;display:block}
#zl-body .zl-yt img{width:100%;height:100%;max-width:none;object-fit:cover;opacity:.85}
.zl-yt:hover img{opacity:1}
.zl-yt-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.72);color:#fff;font:600 16px/1 var(--sans);padding:14px 20px;border-radius:999px;white-space:nowrap}
.zl-yt:hover .zl-yt-play{background:#c4302b}
.zl-vnote{font:13px/1.5 var(--sans);color:var(--muted);margin:0 0 22px;letter-spacing:0}
.zl-vnote a{color:var(--mid)}
/* 講義：官方內文 Tiempos 20/31、清單 20/28、小標 Styrene 32／24（500） */
#zl-body img{max-width:100%;height:auto;margin-bottom:10px}
#zl-body .zl-main>*:first-child,#zl-body sjwc-lesson-content-item>*:first-child{margin-top:0}
#zl-body .zl-notes,#zl-body .zl-transcript{max-width:720px;margin:24px auto 0}
/* 官方：影片全寬（約 820px），內文欄 720px 置中 */
#zl-body .zl-main :is(p,ul,ol,h2,h3,h4,table,blockquote,pre,.af-command,.af-callout,.af-figure,.af-widget){max-width:720px;margin-left:auto;margin-right:auto}
#zl-body .zl-main p:has(> .zl-video){max-width:none}
#zl-body .zr-ex,#zl-body .zr-end,#zl-body > .zl-card{max-width:720px;margin-left:auto;margin-right:auto}
#zl-body p{margin:0 0 16px;font:20px/31px var(--serif);letter-spacing:-.1px}
#zl-body li{margin:0 0 4px;font:20px/28px var(--serif)}
#zl-body ul,#zl-body ol{padding-left:28px;margin:0 0 16px}
#zl-body h2{font:500 32px/36.8px var(--sans);margin:64px 0 32px;color:var(--ink)}
#zl-body h3{font:500 24px/27.6px var(--sans);margin:32px 0 8px;color:var(--ink)}
#zl-body h4{font:500 20px/1.4 var(--sans);margin:24px 0 8px}
#zl-body strong,#zl-body b{font-weight:600}
#zl-body a{color:var(--ink);text-decoration:underline}
#zl-body code{font:18px/1.5 var(--mono);color:var(--code-ink);background:var(--code-bg);border-radius:3px;padding:2px 4px}
#zl-body pre{background:var(--side);border-radius:8px;padding:12px 14px;overflow-x:auto;font-size:14px;line-height:1.5}
#zl-body pre code{background:none;padding:0;font-size:14px}
#zl-body .af-command{background:var(--side);border-radius:8px;padding:8px 12px;margin:16px 0;overflow-x:auto;font-size:14px;line-height:20px}
#zl-body .af-command code{background:none;font:12.6px/20px ui-monospace,SFMono-Regular,Menlo,monospace}
#zl-body table{border-collapse:collapse;margin:10px 0 16px;font-size:17px;line-height:1.5}
#zl-body th,#zl-body td{border:1px solid var(--rule);padding:5px 9px;text-align:left;vertical-align:top}
.zl-trh{max-width:720px;margin:26px auto 6px;font:14px/1.6 var(--sans);color:var(--mid);background:var(--white);border:1px dashed var(--rule);border-radius:8px;padding:8px 12px;letter-spacing:0}
.zs-miss{outline:1px dashed #c60f13}
.zl-card{background:var(--white);border:1px solid var(--rule);border-radius:8px;padding:16px 20px;font:16px/1.75 var(--sans);letter-spacing:0}
.zl-card a{color:var(--ink)}
.zl-sametag{font:11px/1 var(--sans);color:var(--mid);border:1px solid var(--rule);border-radius:4px;padding:2px 4px;margin-left:6px;white-space:nowrap;vertical-align:2px;letter-spacing:0}
.zl-same{margin-bottom:22px}
/* 底部：官方白底 50px、上邊 1px #d5d5d5；Previous 純文字、Next 深色按鈕（#2c2b25、圓角 8、14px） */
.zl-nav{height:50px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-top:1px solid var(--rule2);background:var(--white)}
.zl-nav a{display:inline-block;text-decoration:none}
#zl-prev{color:#000;font:20px/44px var(--serif)}
#zl-prev:hover{text-decoration:underline}
#zl-next{background:var(--btn);color:#fff;font:500 14px/14px var(--serif);border-radius:8px;padding:10px 24px}
#zl-next:hover{background:#000}
.zl-nav a[hidden]{visibility:hidden;display:inline-block}
#zl-shade{display:none}
/* 中文段落用無襯線（正黑體），英文維持官方 serif */
#zl-body [lang="zh-Hant"]{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",var(--sans);letter-spacing:0;font-size:.95em}
/* 我們加的元件（官方沒有：術語、譯註、我們的例子、章末框） */
.zr-t{border-bottom:1.5px dotted currentColor;cursor:help;border-radius:2px}
.zr-t.hot{border-bottom:2px solid var(--primary)}
.zr-t:hover,.zr-t:focus{background:rgba(217,119,87,.12);outline:none}
.zr-t.zr-miss::after{content:"？";color:#c60f13;font-weight:700;margin-left:1px}
.zr-n{display:inline-block;font:600 11px/1 var(--sans);color:var(--primary-hover);background:var(--tint);border-radius:4px;padding:2px 4px;margin:0 2px 0 4px;cursor:pointer;vertical-align:2px;user-select:none}
.zr-n::before{content:"註"}
.zr-zhbtn{font:600 11px/1 var(--sans);color:var(--primary-hover);background:var(--tint);border:0;border-radius:4px;padding:3px 5px;margin-left:6px;cursor:pointer;vertical-align:2px}
.zr-pop{position:fixed;z-index:9999;max-width:min(440px,calc(100vw - 16px));background:#fff;color:#141413;border:1px solid rgba(0,0,0,.18);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.18);padding:10px 13px;font:14px/1.65 "Microsoft JhengHei",var(--sans);letter-spacing:0;text-align:left}
.zr-pop[hidden]{display:none}
.zr-pop-h{font-weight:700;color:var(--primary-hover);margin-bottom:3px}
.zr-pop-why{margin-top:6px;font-size:12.5px;color:#5c5147}
.zr-ex{margin:6px 0 16px;border:1px solid rgba(120,140,93,.55);border-left:4px solid var(--green);border-radius:8px;background:var(--green-t);font:15px/1.7 "Microsoft JhengHei",var(--sans);letter-spacing:0}
.zr-ex>summary{cursor:pointer;padding:6px 12px;color:var(--green-h);font-weight:600;font-size:14px;line-height:1.5}
.zr-ex[open]>summary{border-bottom:1px solid rgba(120,140,93,.35)}
.zr-exb{padding:8px 14px 10px}
#zl-body .zr-exb p,#zl-body .zr-exb li{font:15px/1.7 "Microsoft JhengHei",var(--sans);margin:0 0 8px}
.zr-exb ul{margin:4px 0 8px;padding-left:22px}
.zr-rw li.r::marker{content:"✅ "}
.zr-rw li.w::marker{content:"❌ "}
.zr-src{font-size:12.5px;color:var(--mid);margin-top:6px}
.zr-muted{color:var(--mid);font-size:12.5px}
.zr-end{margin:44px 0 8px;padding-top:16px;border-top:1px dashed var(--rule);font:15.5px/1.7 "Microsoft JhengHei",var(--sans);letter-spacing:0}
.zr-end-h{font-size:12px;letter-spacing:.1em;color:var(--mid);margin-bottom:8px}
.zr-box{background:var(--white);border:1px solid var(--rule);border-radius:8px;margin:8px 0}
.zr-box>summary{cursor:pointer;padding:9px 14px;font-weight:600}
.zr-box[open]>summary{border-bottom:1px solid var(--rule)}
.zr-exam{margin:8px 0;padding:0 16px 4px 34px}
#zl-body .zr-exam li{margin-bottom:10px;font:15px/1.7 "Microsoft JhengHei",var(--sans)}
#zl-body .zr-exam a{color:var(--ink2)}
.zr-hw{display:inline-block;margin:8px 0;padding:10px 20px;border-radius:8px;background:var(--btn);color:#fff!important;text-decoration:none!important;font-weight:600}
.zr-hw:hover{background:#000}
@media (max-width:900px){
  #zl-menu{display:inline-block}
  #zl-sb{position:fixed;top:60px;bottom:50px;left:0;width:min(360px,88vw);z-index:50;transform:translateX(-105%);transition:transform .2s;box-shadow:4px 0 18px rgba(0,0,0,.15)}
  body.zl-sb-open #zl-sb{transform:none}
  body.zl-sb-open #zl-shade{display:block;position:fixed;inset:60px 0 50px 0;background:rgba(0,0,0,.25);z-index:40}
  .zl-inner{padding:20px 16px 60px}
  #zl-body p{font-size:18px;line-height:29px}
  #zl-body h2{font-size:26px;line-height:1.3;margin:40px 0 20px}
  .zl-top{gap:12px}
  .zl-top .zl-hide-s{display:none}
}


/* ===== CCAR-P 課程頁（官方原版頁面在 iframe 內） ===== */
body.v-pcourse{overflow:hidden}
#pc{position:fixed;inset:0;background:#fff;z-index:10}
#pc iframe{display:block;width:100%;height:100%;border:0}
#pc .pc-msg{max-width:640px;margin:80px auto;padding:16px 20px;background:var(--white);border:1px solid var(--line);border-radius:10px;color:var(--mid)}

/* ===== 模擬考（原模擬考頁在 iframe 內） ===== */
body.v-exam{overflow:hidden}
#ex{position:fixed;inset:0;background:#fff;z-index:10}
#ex iframe{display:block;width:100%;height:100%;border:0}
#ex .pc-msg{max-width:640px;margin:80px auto;padding:16px 20px;background:var(--white);border:1px solid var(--line);border-radius:10px;color:var(--mid)}
</style>
</head>
<body>
<div class="wrap" id="home">
  <h1>CCAR 官方備考課程・中文版</h1>
  <p class="src">內容譯自 Anthropic Partner Academy 官方備考課程，請選擇課程專區或直接點選章節開始學習。</p>

  <div class="tabs">
    <button type="button" class="tab-btn f active" id="btn-f" onclick="switchTab('f')">
      <span class="tag">CCAR-F</span>
      <span class="title">CCAR-F 官方課程中文版</span>
      <span class="desc">7 門課程・AI 協作、Claude API、雲端平台、Claude Code 與 MCP</span>
    </button>
    <button type="button" class="tab-btn p" id="btn-p" onclick="switchTab('p')">
      <span class="tag">CCAR-P</span>
      <span class="title">CCAR-P 官方課程中文版</span>
      <span class="desc">5 門課程・架構設計、企業整合上線、安全治理與團隊賦能</span>
    </button>
  </div>

  <!-- CCAR-F 專區 -->
  <section id="sec-f">
    <div class="sec-head">
      <h2>CCAR-F 課程列表</h2>
      <div class="sec-actions">
        <a href="#f/exam">模擬考網站 →</a>
      </div>
    </div>
    <div id="list-f"></div>
  </section>

  <!-- CCAR-P 專區 -->
  <section id="sec-p" class="theme-p hidden">
    <div class="sec-head">
      <h2>CCAR-P 課程列表</h2>
      <div class="sec-actions">
        <a href="#p/exam">模擬考網站 →</a>

  /* ---------- 我們的例子、章末（考試怎麼考／常見疑問／課後題） ---------- */
  function md(src, chId) {
    const lines = String(src || "").replace(/\r/g, "").split("\n");
    let h = "", list = [], para = [];
    const flushP = () => { if (para.length) { h += `<p>${rich(para.join(" "), chId)}</p>`; para = []; } };
    const flushL = () => { while (list.length) h += `</${list.pop()}>`; };
    for (let i = 0; i < lines.length; i++) {
      const ln = lines[i];
      if (/^\s*\|.*\|\s*$/.test(ln)) {
        flushP(); flushL();
        const rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; }
        i--;
        const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(x => x.trim());
        const body = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
        h += `<div class="zr-tbl"><table>${body.map((r, k) => `<tr>${cells(r).map(c => k === 0 ? `<th>${rich(c, chId)}</th>` : `<td>${rich(c, chId)}</td>`).join("")}</tr>`).join("")}</table></div>`;
        continue;
      }
      const li = ln.match(/^(\s*)(?:[-*]|(\d+)\.)\s+(.*)$/);
      if (li) {
        flushP();
        const depth = Math.floor(li[1].length / 2) + 1, tag = li[2] ? "ol" : "ul";

  function exampleEl(x, chId) {

      ? `<ul class="zr-rw">${(x.right || []).map(r => `<li class="r">${rich(r, chId)}</li>`).join("")}${(x.wrong || []).map(r => `<li class="w">${rich(r, chId)}</li>`).join("")}</ul>` : "";
    d.innerHTML = `<summary>🏢 ${rich(x.title || "我們的例子", chId)}</summary><div class="zr-exb">${x.body ? md(x.body, chId) : ""}${lists}${x.src ? `<div class="zr-src">事實出處：${esc(x.src)}</div>` : ""}</div>`;
    d.addEventListener("click", e => e.stopPropagation());
    return d;
  }
  const INTER = "label,button,summary,a,[onclick],[role=button],[role=radio],[role=checkbox],.flip-card,[draggable=true],.bucket-chip,.mc-opt,.mcq-opt,.decision-opt,.check-item,.signal-item";
  function anchorAfter(el, scr) {
    let a = el;
    const inter = a.closest(INTER);
    if (inter && scr.contains(inter) && inter !== scr) a = inter;
    const up = a.closest("li,td,th,tr,dt,dd,summary,option");
    if (up && scr.contains(up)) a = up.closest("ul,ol,table,dl,details,select") || a;
    if (a.closest("summary")) a = a.closest("details");
    // 卡片格／橫排（grid、flex 橫向）裡面不能多塞一格：改放到整個格子區塊後面
    for (let g = a.parentElement; g && g !== scr; g = g.parentElement) {
      const cs = getComputedStyle(g);
      if (/grid/.test(cs.display) || (/flex/.test(cs.display) && !/column/.test(cs.flexDirection))) { a = g; break; }
    }
    return a === scr ? null : a;
  }
  function placeExamples() {
    for (const ch of D.chapters) for (const x of (ch.examples || [])) {
      const seg = SEG[x.after], u = ZR.unitBySeg[x.after];
      const sid = seg ? seg.sid : ch.screens[ch.screens.length - 1];
      const scr = document.getElementById(sid === "SPLASH" ? ch.screens[0] : sid);
      if (!scr) continue;
      const box = exampleEl(x, ch.id);
      const a = u && u.anchor && scr.contains(u.anchor) ? anchorAfter(u.anchor, scr) : null;
      if (a) { let ref = a; while (ref.nextElementSibling && ref.nextElementSibling.classList.contains("zr-ex")) ref = ref.nextElementSibling; ref.after(box); }
      else { const end = scr.querySelector(":scope > .zr-end"); if (end) end.before(box); else scr.appendChild(box); }
    }
  }
  function endBlock(ch) {
    const el = document.createElement("div");
    el.className = "zr zr-end"; el.lang = "zh-Hant";
    let h = `<div class="zr-end-h">本章結束・${esc(ch.title_zh)}</div>`;
    if ((ch.exam || []).length) {
      h += `<details class="zr-box"><summary>考試怎麼考（${ch.exam.length} 個考點）</summary><ul class="zr-exam">${ch.exam.map(e => `<li><a href="${D.mock}#concept=${encodeURIComponent(e.cid)}" target="_blank">${esc(e.cid)}　${esc(e.zh || "")}</a> <span class="zr-muted">${esc(e.en || "")}</span><div>${rich(e.how || "", ch.id)}</div></li>`).join("")}</ul></details>`;
    }
    if ((ch.qa || []).length) {
      h += `<details class="zr-box"><summary>常見疑問（${ch.qa.length} 題）</summary>${ch.qa.map(q => `<details class="zr-qa"><summary>${rich(q.q, ch.id)}</summary><div class="zr-qab">${md(q.a, ch.id)}${q.check ? `<div class="zr-src">📌 拿原文核對：${rich(q.check, ch.id)}</div>` : ""}<div class="zr-src">${esc(q.src || "")}</div></div></details>`).join("")}</details>`;
    }
    if (ch.nConcepts) h += `<a class="zr-hw" href="${D.mock}#ch=${encodeURIComponent(ch.id)}" target="_blank">做這章課後題（模擬考網站，只出本章考點）→</a>`;
    el.innerHTML = h;
    el.addEventListener("click", e => e.stopPropagation());
    return el;
  }
  function placeEnds() {
    for (const ch of D.chapters) {
      const scr = document.getElementById(ch.screens[ch.screens.length - 1]);
      if (scr && !scr.querySelector(":scope > .zr-end")) scr.appendChild(endBlock(ch));
    }
  }
  function sidebarLinks() {
    const head = document.querySelector(".sidebar-head");
    if (!head || head.querySelector(".zr-links")) return;
    const d = document.createElement("div");
    d.className = "zr zr-links";
    d.innerHTML = `<a href="${D.home}">← 5 門課目錄</a><span>·</span><a href="${D.mock}" target="_blank">模擬考網站</a>`;
    head.appendChild(d);
  }

  /* ---------- 網址：#c1-05、#ch=c1-05、#c1-05-012 直接開到那章 ---------- */
  function hideSplash() { const s = document.getElementById("splash"); if (s) s.classList.add("hide"); document.body.classList.remove("splash-open"); }
  function goScreen(sid) {
    const idx = SCREENS.findIndex(s => s.id === sid);
    if (idx < 0) return false;
    hideSplash();
    if (typeof window.goTo === "function") window.goTo(idx);
    else if (typeof window.showScreen === "function") window.showScreen(idx);
    else if (typeof window.goToScreen === "function") window.goToScreen(sid);
    else return false;
    return true;
  }
  function route() {
    const h = decodeURIComponent(location.hash.replace(/^#/, ""));
    const m = h.match(/^(?:ch=)?(c\d+-\d\d)(-\d{3})?$/);
    if (!m || !CHAP[m[1]]) return false;
    const ch = CHAP[m[1]];
    let sid = ch.screens[0];
    if (m[2] && SEG[h.replace(/^ch=/, "")] && SEG[h.replace(/^ch=/, "")].sid !== "SPLASH") sid = SEG[h.replace(/^ch=/, "")].sid;
    return goScreen(sid);
  }
  ZR.route = route; ZR.goScreen = goScreen;

  /* ---------- 啟動 ---------- */
  buildMaps();
  patchNav();
  rebuildNav();          // 第 1 門在這之前已經畫好側欄 ⇒ 用中文資料重畫；第 2～5 門在 DOMContentLoaded 才畫，會直接用到中文
  function start() {
    if (ZR.ready) return;
    patchNav();
    rebuildNav();
    addToggles();
    sidebarLinks();
    translateAll();
    placeEnds();
    placeExamples();
    let burst = 0, burstTimer = 0;
    mo = new MutationObserver(recs => {
      if (quietDepth) return;
      if (!burstTimer) burstTimer = setTimeout(() => { burst = 0; burstTimer = 0; }, 0);
      if (++burst > 30) { if (burst === 31) ZR.warn.push("觀察器連續觸發超過 30 次，暫停這一輪（可能有元素每次掃描都被改寫）"); return; }
      const dirty = new Set();
      for (const r of recs) {
        const t = r.target.nodeType === 1 ? r.target : r.target.parentElement;
        if (!t || t.closest(".zr")) continue;
        const s = t.closest("section.screen");
        dirty.add(s ? s.id : "SPLASH");
      }
      dirty.forEach(translateScope);
    });
    mo.observe(document.body, { childList: true, subtree: true, characterData: true });
    ZR.ready = true;
    // 第 2～5 門的官方初始化掛在 window 的 DOMContentLoaded（比 document 晚觸發），最後會再打開開場頁 ⇒ 等它跑完再轉
    setTimeout(route, 0);
    window.addEventListener("hashchange", route);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
  else start();
})();

</script>

/* CCAR-F 課程頁（原 ccar-f-course-zh-cN.html 的 runtime，改成單頁內的一個畫面）
   - 資料由 router 從 Supabase 讀 course_content.data（原 window.__ZHD）後 load() 進來
   - 網址：#f/c{門}/{單元 lid 或章 id}；上一頁／下一頁走瀏覽器歷史
   - 進度記在 localStorage，key 與原頁相同（ccarf-course-c{門}-seen／last） */
const FCourse = (function () {
	"use strict";
	let D = null;
	let CHAP = null;
	let LES = null;
	let SEG = null;
	let KEY = "";
	const ZR = window.__ZR = { ready: false, warn: [], missing: [] };
	const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
	const lessonHref = lid => `#f/c${D.n}/${encodeURIComponent(lid)}`;
	const mockHref = h => `#f/exam${h ? "/" + h.replace(/^#/, "") : ""}`;
	const store = {
		get(k, d) {
			try {
				const v = localStorage.getItem(KEY + "-" + k);
				return v === null ? d : JSON.parse(v);
			} catch (e) {
				return d;
			}
		},
		set(k, v) {
			try {
				localStorage.setItem(KEY + "-" + k, JSON.stringify(v));
			} catch (e) { /* 私密視窗等：只是不記 */ }
		}
	};

	/* ---------- 術語、行內格式 ---------- */
	function termOf(chId, en) {
		const k = en.toLowerCase();
		const c = CHAP[chId];
		const t = c && (c.terms || []).find(x => x.en.toLowerCase() === k);
		return t || (D.globalTerms || []).find(x => x.en.toLowerCase() === k) || null;
	}
	function inline(s) {
		const keep = [];
		let h = esc(s).replace(/`([^`]+)`/g, (_, c) => {
			keep.push(c);
			return "\u0000" + (keep.length - 1) + "\u0000";
		});
		h = h.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
			.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, "$1<em>$2</em>")
			.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
			.replace(/\n/g, "<br>");
		return h.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${keep[+i]}</code>`);
	}
	function termHtml(enRaw, zhRaw, chId) {
		const en = enRaw.trim();
		const t = termOf(chId, en);
		const z = ((zhRaw || "") || (t ? t.zh : "")).trim();
		if (!z) {
			ZR.missing.push(en);
		}
		return `<span class="zr-t${t && t.hot ? " hot" : ""}${z ? "" : " zr-miss"}" tabindex="0" data-z="${esc(z || "？（這個術語沒有中文定義）")}"${t && t.why ? ` data-why="${esc(t.why)}"` : ""}>${esc(en)}</span>`;
	}
	function rich(s, chId) {
		const codes = [];
		const terms = [];
		const ph = String(s ?? "").replace(/`([^`]+)`/g, (_, c) => {
			codes.push(c);
			return "\u0002" + (codes.length - 1) + "\u0002";
		}).replace(/\{\{([^{}|]+)(?:\|([^{}]+))?\}\}/g, (_, en, zh) => {
			terms.push([en, zh]);
			return "\u0001" + (terms.length - 1) + "\u0001";
		});
		return inline(ph)
			.replace(/\u0001(\d+)\u0001/g, (_, i) => termHtml(terms[+i][0], terms[+i][1], chId))
			.replace(/\u0002(\d+)\u0002/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
	}
	const plain = s => String(s ?? "").replace(/\{\{([^{}|]+)(?:\|[^{}]+)?\}\}/g, "$1").replace(/\*\*(.+?)\*\*/g, "$1").replace(/`([^`]+)`/g, "$1");
	const titleZh = l => {
		const s = SEG[l.lid + "-000"];
		return s && s.zh ? plain(s.zh) : l.title_en;
	};
	function md(src, chId) {
		const lines = String(src || "").replace(/\r/g, "").split("\n");
		let h = "";
		const list = [];
		let para = [];
		const flushP = () => {
			if (para.length) {
				h += `<p>${rich(para.join(" "), chId)}</p>`;
				para = [];
			}
		};
		const flushL = () => {
			while (list.length) {
				h += `</${list.pop()}>`;
			}
		};
		for (const ln of lines) {
			const li = ln.match(/^(\s*)(?:[-*]|(\d+)\.)\s+(.*)$/);
			if (li) {
				flushP();
				const depth = Math.floor(li[1].length / 2) + 1;
				const tag = li[2] ? "ol" : "ul";
				while (list.length > depth) {
					h += `</${list.pop()}>`;
				}
				while (list.length < depth) {
					h += `<${tag}>`;
					list.push(tag);
				}
				h += `<li>${rich(li[3], chId)}</li>`;
				continue;
			}
			if (!ln.trim()) {
				flushP();
				flushL();
				continue;
			}
			flushL();
			para.push(ln.trim());
		}
		flushP();
		flushL();
		return h;
	}

	/* ---------- 側欄 ---------- */
	const ICON = { video: "影片", text: "文字", quiz: "測驗", survey: "問卷" };
	function sidebar() {
		const seen = new Set(store.get("seen", []));
		const sb = document.getElementById("zl-sb-list");
		sb.innerHTML = D.chapters.map(c => `<div class="zl-sec" data-ch="${esc(c.id)}">
			<div class="zl-sec-h">${rich(c.title_zh || c.title_en, c.id)}</div>
			${c.lids.map(lid => {
				const l = LES[lid];
				return `<a class="zl-item${seen.has(lid) ? " seen" : ""}" href="${lessonHref(lid)}" data-lid="${esc(lid)}"><span class="zl-ic" aria-hidden="true" title="${ICON[l.type] || ""}"></span><span class="zl-it">${esc(titleZh(l))}${l.same ? `<span class="zl-sametag">同第 ${l.same.course} 門</span>` : ""}</span></a>`;
			}).join("")}
		</div>`).join("");
	}
	function markSidebar(lid) {
		document.querySelectorAll(".zl-item").forEach(a => a.classList.toggle("active", a.dataset.lid === lid));
		const a = document.querySelector(`.zl-item[data-lid="${CSS.escape(lid)}"]`);
		if (a) {
			a.classList.add("seen");
			const box = document.getElementById("zl-sb");
			const r = a.getBoundingClientRect();
			const br = box.getBoundingClientRect();
			if (r.top < br.top + 40 || r.bottom > br.bottom - 40) {
				box.scrollTop += r.top - br.top - br.height / 3;
			}
		}
	}

	/* ---------- 單元內容 ---------- */
	let cur = null;
	let enMode = false;
	const EN = new Map();
	function noteMark(sid) {
		const s = SEG[sid];
		return s && s.note ? `<span class="zr-n" role="button" tabindex="0" data-note="${esc(sid)}" aria-label="譯註"></span>` : "";
	}
	function videoHtml(l) {
		if (l.mediaId && l.player) {
			return `<div class="zl-video"><iframe src="https://cdn.jwplayer.com/players/${esc(l.mediaId)}-${esc(l.player)}.html" title="${esc(l.title_en)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
				<div class="zl-vnote">影片是官方英文原片（可開英文字幕）。<a href="${esc(l.href)}" target="_blank" rel="noopener">到官方網站看這個單元</a></div>`;
		}
		return "";
	}
	function fixYoutube(root, l) {
		root.querySelectorAll("iframe[src*='youtube']").forEach(f => {
			f.setAttribute("referrerpolicy", "strict-origin-when-cross-origin");
			f.setAttribute("loading", "lazy");
			const m = (f.getAttribute("src") || "").match(/embed\/([\w-]+)/);
			const box = document.createElement("div");
			box.className = "zl-video";
			f.replaceWith(box);
			// 從本機檔案（file://）開時 YouTube 嵌入會報「錯誤 153」（要求來源網址）⇒ 改放縮圖，點了到 YouTube 播
			if (location.protocol === "file:" && m) {
				box.innerHTML = `<a class="zl-yt" href="https://www.youtube.com/watch?v=${esc(m[1])}" target="_blank" rel="noopener" title="在 YouTube 播放"><img src="https://i.ytimg.com/vi/${esc(m[1])}/hqdefault.jpg" alt=""><span class="zl-yt-play">▶ 在 YouTube 播放（英文原片）</span></a>`;
				const n = document.createElement("div");
				n.className = "zl-vnote";
				n.innerHTML = `影片是官方英文原片（YouTube 可開英文字幕）。<a href="${esc(l.href)}" target="_blank" rel="noopener">到官方網站看這個單元</a>`;
				box.after(n);
				return;
			}
			box.appendChild(f);
			if (m) {
				const n = document.createElement("div");
				n.className = "zl-vnote";
				n.innerHTML = `影片是官方英文原片。播不出來時：<a href="https://www.youtube.com/watch?v=${esc(m[1])}" target="_blank" rel="noopener">到 YouTube 看</a>・<a href="${esc(l.href)}" target="_blank" rel="noopener">到官方網站看這個單元</a>`;
				box.after(n);
			}
		});
	}
	// 講義裡連到其他課程頁／模擬考的相對連結：改成單頁網址或 CCAR-F/ 下的檔案
	function fixLocalLinks(root) {
		root.querySelectorAll("a[href]").forEach(a => {
			const href = a.getAttribute("href");
			const m = href.match(/^ccar-f-course-zh-c(\d+)\.html(?:#(.*))?$/);
			if (m) {
				a.setAttribute("href", `#f/c${m[1]}${m[2] ? "/" + m[2] : ""}`);
				a.removeAttribute("target");
				a.dataset.local = "1";
			} else if (/^ccar-f-mock-exam\.html/.test(href)) {
				a.setAttribute("href", mockHref(href.split("#")[1] || ""));
				a.removeAttribute("target");
				a.dataset.local = "1";
			}
		});
	}
	function exampleEl(x, chId) {
		const d = document.createElement("details");
		d.className = "zr-ex";
		d.lang = "zh-Hant";
		const lists = (x.right || []).length || (x.wrong || []).length
			? `<ul class="zr-rw">${(x.right || []).map(r => `<li class="r">${rich(r, chId)}</li>`).join("")}${(x.wrong || []).map(r => `<li class="w">${rich(r, chId)}</li>`).join("")}</ul>`
			: "";
		d.innerHTML = `<summary>🏢 ${rich(x.title || "我們的例子", chId)}</summary><div class="zr-exb">${x.body ? md(x.body, chId) : ""}${lists}${x.src ? `<div class="zr-src">事實出處：${esc(x.src)}</div>` : ""}</div>`;
		return d;
	}
	function anchorAfter(span, root) {
		let a = span.closest("li,td,th,dt,dd,p,h1,h2,h3,h4,h5,h6,figcaption,div") || span;
		const up = a.closest("li,td,th,tr,dt,dd");
		if (up && root.contains(up)) {
			a = up.closest("ul,ol,table,dl") || a;
			for (let p = a.parentElement; p && p !== root; p = p.parentElement) {
				if (/^(UL|OL)$/.test(p.tagName)) {
					a = p;
				}
			}
		}
		return a === root ? null : a;
	}
	function endBlock(ch) {
		const el = document.createElement("div");
		el.className = "zr-end";
		el.lang = "zh-Hant";
		let h = `<div class="zr-end-h">本章結束・${esc(plain(ch.title_zh || ch.title_en))}</div>`;
		if ((ch.exam || []).length) {
			h += `<details class="zr-box"><summary>考試怎麼考（${ch.exam.length} 個考點）</summary><ul class="zr-exam">${ch.exam.map(e => `<li><a href="${mockHref("#concept=" + encodeURIComponent(e.cid))}">${esc(e.cid)}　${esc(e.zh || "")}</a> <span class="zr-muted">${esc(e.en || "")}</span><div>${rich(e.how || "", ch.id)}</div></li>`).join("")}</ul></details>`;
		}
		if (ch.nConcepts) {
			h += `<a class="zr-hw" href="${mockHref("#ch=" + encodeURIComponent(ch.id))}">做這章課後題（模擬考網站，只出本章考點）→</a>`;
		}
		el.innerHTML = h;
		return el;
	}
	function applyLang(root, toEn) {
		root.querySelectorAll(".zs").forEach(sp => {
			const sid = sp.dataset.sid;
			const s = SEG[sid];
			if (!EN.has(sp)) {
				EN.set(sp, sp.innerHTML);
			}
			if (toEn || !s || !s.zh) {
				sp.innerHTML = EN.get(sp);
				sp.classList.toggle("zs-miss", !toEn && !(s && s.zh) && !(cur && cur.same));
				sp.removeAttribute("lang");
				return;
			}
			const chId = s.ch;
			if (s.mode === "en") {
				sp.innerHTML = EN.get(sp) + `<button type="button" class="zr-zhbtn" data-sid="${esc(sid)}" aria-label="看中文">中</button>`;
			} else {
				sp.innerHTML = rich(s.zh, chId) + noteMark(sid);
				sp.lang = "zh-Hant";
			}
		});
		const h = document.getElementById("zl-title");
		if (h && cur) {
			h.textContent = toEn ? cur.title_en : titleZh(cur);
		}
		document.querySelectorAll(".zl-th").forEach(x => {
			x.hidden = !toEn;
		});
		document.querySelectorAll(".zl-tz").forEach(x => {
			x.hidden = toEn;
		});
	}
	function show(lid, keepScroll) {
		const l = LES[lid];
		if (!l) {
			return false;
		}
		cur = l;
		enMode = false;
		EN.clear();
		const ch = CHAP[l.ch];
		const main = document.getElementById("zl-body");
		let body = "";
		if (l.type === "quiz") {
			body = `<div class="zl-card">這是官方課程的測驗。題目只在官方網站上（要登入 Anthropic Partner Academy），沒有收進中文版。<br>要練這一章的觀念，做本章的課後題（模擬考網站）。<br><a href="${esc(l.href)}" target="_blank" rel="noopener">到官方網站做測驗</a></div>`;
		} else if (l.type === "survey") {
			body = `<div class="zl-card">這是官方課程的滿意度問卷，中文版略過。</div>`;
		} else {
			body = videoHtml(l) + (l.tpl || "");
		}
		if (l.same) {
			const sm = String(l.same.file || "").match(/c(\d+)\.html$/);
			const sameHref = sm ? `#f/c${sm[1]}/${encodeURIComponent(l.same.lid)}` : `CCAR-F/${esc(l.same.file)}#${esc(l.same.lid)}`;
			body = `<div class="zl-card zl-same">這一課的主題跟第 ${l.same.course} 門〈${esc(plain(l.same.title_zh))}〉相同（官方講義另外寫過，內容大同小異），中文版沒有重翻。<br><a href="${sameHref}" data-local="1">讀第 ${l.same.course} 門這一課的中文版 →</a>　<span class="zr-muted">下面是本課的官方英文原文。</span></div>` + body;
		}
		main.innerHTML = body;
		const tr = main.querySelector(".zl-transcript");
		if (tr) {
			const h = document.createElement("div");
			h.className = "zl-trh";
			h.innerHTML = `<span class="zl-tz">這個單元官方只有影片、沒有講義。以下是影片內容（字幕翻譯）：</span><span class="zl-th" hidden>Video transcript (English captions):</span>`;
			tr.before(h);
		}
		main.querySelectorAll("a[href^='/']").forEach(a => {
			a.href = "https://anthropic-partners.skilljar.com" + a.getAttribute("href");
		});
		fixLocalLinks(main);
		main.querySelectorAll("a[href]").forEach(a => {
			if (!a.target && !a.dataset.local) {
				a.target = "_blank";
				a.rel = "noopener";
			}
		});
		fixYoutube(main, l);
		applyLang(main, false);
		(ch && ch.examples || []).forEach(x => {
			if (!x.after || !x.after.startsWith(lid + "-")) {
				return;
			}
			const sp = main.querySelector(`.zs[data-sid="${CSS.escape(x.after)}"]`);
			const box = exampleEl(x, ch.id);
			const a = sp ? anchorAfter(sp, main) : null;
			if (a) {
				let ref = a;
				while (ref.nextElementSibling && ref.nextElementSibling.classList.contains("zr-ex")) {
					ref = ref.nextElementSibling;
				}
				ref.after(box);
			} else {
				main.appendChild(box);
			}
		});
		if (ch && ch.lids[ch.lids.length - 1] === lid) {
			main.appendChild(endBlock(ch));
		}
		document.getElementById("zl-title").textContent = titleZh(l);
		document.getElementById("zl-sec").innerHTML = ch ? rich(ch.title_zh || ch.title_en, ch.id) : "";
		const tog = document.getElementById("zl-tog");
		tog.textContent = "顯示英文";
		tog.setAttribute("aria-pressed", "false");
		tog.hidden = !main.querySelector(".zs") || !!l.same;
		const prev = D.lessons[l.i - 1];
		const next = D.lessons[l.i + 1];
		const pb = document.getElementById("zl-prev");
		const nb = document.getElementById("zl-next");
		pb.hidden = !prev;
		nb.hidden = !next;
		if (prev) {
			pb.href = lessonHref(prev.lid);
			pb.title = titleZh(prev);
		}
		if (next) {
			nb.href = lessonHref(next.lid);
			nb.title = titleZh(next);
		}
		document.title = `${titleZh(l)}・第 ${D.n} 門 ${D.name_zh}`;
		markSidebar(lid);
		const seen = new Set(store.get("seen", []));
		seen.add(lid);
		store.set("seen", [...seen]);
		store.set("last", lid);
		if (!keepScroll) {
			document.getElementById("zl-main").scrollTop = 0;
			window.scrollTo(0, 0);
		}
		document.body.classList.remove("zl-sb-open");
		return true;
	}
	function setEN(on) {
		enMode = on;
		applyLang(document.getElementById("zl-body"), on);
		const tog = document.getElementById("zl-tog");
		tog.textContent = on ? "顯示中文" : "顯示英文";
		tog.setAttribute("aria-pressed", on ? "true" : "false");
	}

	/* ---------- 浮層（術語中文、譯註、英文優先段的中文） ---------- */
	let pop = null;
	function hidePop() {
		if (pop) {
			pop.hidden = true;
		}
	}
	function showPop(t) {
		if (!pop) {
			pop = document.createElement("div");
			pop.className = "zr-pop";
			pop.lang = "zh-Hant";
			pop.setAttribute("role", "dialog");
			document.body.appendChild(pop);
		}
		if (t.classList.contains("zr-t")) {
			pop.innerHTML = `<div class="zr-pop-h">${esc(t.textContent)}</div><div>${esc(t.dataset.z)}</div>${t.dataset.why ? `<div class="zr-pop-why">考試：${esc(t.dataset.why)}</div>` : ""}`;
		} else if (t.classList.contains("zr-zhbtn")) {
			const s = SEG[t.dataset.sid];
			pop.innerHTML = `<div class="zr-pop-h">中文</div><div>${s ? rich(s.zh, s.ch) : ""}</div>`;
		} else {
			const s = SEG[t.dataset.note];
			pop.innerHTML = `<div class="zr-pop-h">譯註</div><div>${s ? rich(s.note, s.ch) : ""}</div>`;
		}
		pop.hidden = false;
		pop.style.left = "0px";
		pop.style.top = "0px";
		const r = t.getBoundingClientRect();
		const w = pop.offsetWidth;
		const h = pop.offsetHeight;
		const x = Math.min(Math.max(8, r.left), innerWidth - w - 8);
		let y = r.bottom + 6;
		if (y + h > innerHeight - 8) {
			y = Math.max(8, r.top - h - 6);
		}
		pop.style.left = x + "px";
		pop.style.top = y + "px";
	}

	/* ---------- 事件：只綁一次，處理時看目前是否在本畫面 ---------- */
	const active = () => D && document.body.classList.contains("v-fcourse");
	document.addEventListener("click", e => {
		if (!active()) {
			return;
		}
		const t = e.target.closest && e.target.closest(".zr-t, .zr-n, .zr-zhbtn");
		if (t) {
			e.preventDefault();
			showPop(t);
			return;
		}
		if (pop && !e.target.closest(".zr-pop")) {
			pop.hidden = true;
		}
	}, true);
	document.addEventListener("keydown", e => {
		if (!active()) {
			return;
		}
		if (e.key === "Escape") {
			hidePop();
		}
		const c = e.target.classList;
		if (e.key === "Enter" && c && (c.contains("zr-t") || c.contains("zr-n"))) {
			e.preventDefault();
			showPop(e.target);
		}
		if (e.target.closest && e.target.closest("input,textarea")) {
			return;
		}
		if (e.key === "ArrowRight" && e.altKey && cur && D.lessons[cur.i + 1]) {
			location.hash = lessonHref(D.lessons[cur.i + 1].lid);
		}
		if (e.key === "ArrowLeft" && e.altKey && cur && D.lessons[cur.i - 1]) {
			location.hash = lessonHref(D.lessons[cur.i - 1].lid);
		}
	}, true);
	document.addEventListener("scroll", hidePop, true);
	document.getElementById("zl-tog").addEventListener("click", () => setEN(!enMode));
	document.getElementById("zl-menu").addEventListener("click", () => document.body.classList.toggle("zl-sb-open"));
	document.getElementById("zl-shade").addEventListener("click", () => document.body.classList.remove("zl-sb-open"));

	/* ---------- 對外 ---------- */
	return {
		get n() {
			return D ? D.n : null;
		},
		// 換一門課：重建索引與側欄
		load(data) {
			D = data;
			CHAP = Object.create(null);
			D.chapters.forEach((c, i) => {
				c.i = i;
				CHAP[c.id] = c;
			});
			LES = Object.create(null);
			D.lessons.forEach((l, i) => {
				l.i = i;
				LES[l.lid] = l;
			});
			SEG = D.segs;
			KEY = "ccarf-course-c" + D.n;
			cur = null;
			hidePop();
			document.getElementById("zl-course").innerHTML = `${esc(D.name_zh)}<span class="zl-course-en">${esc(D.name_en)}</span>`;
			sidebar();
			ZR.ready = true;
		},
		// rest：單元 lid、章 id（如 c2-03），或空字串（回到上次讀的單元）
		open(rest) {
			hidePop();
			const h = String(rest || "").replace(/^ch=/, "");
			if (LES[h]) {
				return show(h);
			}
			const c = CHAP[h];
			// 讀書計畫連到章：第 3、6 門跳過「同第 2 門」的單元，直接到本章第一個有中文的單元
			const lid = c && c.lids.length
				? (c.lids.find(x => !LES[x].same) || c.lids[0])
				: (LES[store.get("last", null)] ? store.get("last", null) : D.lessons[0].lid);
			history.replaceState(null, "", lessonHref(lid));
			return show(lid);
		},
		loading(msg) {
			document.getElementById("zl-course").textContent = "";
			document.getElementById("zl-sb-list").innerHTML = "";
			document.getElementById("zl-sec").textContent = "";
			document.getElementById("zl-title").textContent = "";
			document.getElementById("zl-tog").hidden = true;
			document.getElementById("zl-prev").hidden = true;
			document.getElementById("zl-next").hidden = true;
			document.getElementById("zl-body").innerHTML = `<div class="zl-card">${esc(msg)}</div>`;
			D = null;
		},
		hidePop
	};
})();

/* CCAR-P 課程頁：官方原版頁面（course_content.frame_html）放進 iframe srcdoc，注入課程資料與中文化 runtime
   - srcdoc 與本頁同源 ⇒ 官方頁的進度（localStorage）沿用，也能直接攔截框內的連結
   - 網址：#p/c{門}[/{章 id 或段落 id}]；框內換頁由官方程式處理，不改網址 */
const PCourse = (function () {
  "use strict";
  const box = document.getElementById("pc");
  const RUNTIME = document.getElementById("p-runtime").textContent;
  const HOME = "#__home";
  const MOCK = "#__exam";
  let n = null;
  let data = null;
  let frame = null;
  let pending = "";

  function msg(text) {
    box.innerHTML = `<div class="pc-msg">${esc(text)}</div>`;
    frame = null;
    n = null;
  }

  // 同原 runtime 的 route()：章 id → 該章第一個畫面；段落 id → 該段所在畫面
  function screenFor(rest) {
    const h = String(rest || "").replace(/^ch=/, "");
    const m = h.match(/^(c\d+-\d\d)(-\d{3})?$/);
    if (!m) return null;
    const ch = data.chapters.find(c => c.id === m[1]);
    if (!ch) return null;
    let sid = ch.screens[0];
    if (m[2]) {
      const seg = data.segs.find(s => s.id === h);
      if (seg && seg.sid !== "SPLASH") sid = seg.sid;
    }
    return sid;
  }

  function goto(rest) {
    const sid = screenFor(rest);
    const zr = frame && frame.contentWindow && frame.contentWindow.__ZR;
    if (sid && zr && typeof zr.goScreen === "function") zr.goScreen(sid);
  }

  function pageHtml(row) {
    const d = Object.assign({}, row.data, { home: HOME, mock: MOCK });
    // 本段程式也嵌在 script 標籤裡：HTML 註解開頭與 script 開始／結束標籤的字面字串會讓解析器吞掉後面的程式 ⇒ 角括號一律寫成 \x3C
    const json = JSON.stringify(d).replace(/\x3C\//g, "\\u003C/").replace(/\x3C!--/g, "\\u003C!--");
    const inject = "\x3Cscript>window.__ZHD=" + json + ";\x3C/script>\n\x3Cscript>" + RUNTIME + "\x3C/script>\n";
    const html = row.frame_html;
    const at = html.lastIndexOf("</body>");
    return at < 0 ? html + inject : html.slice(0, at) + inject + html.slice(at);
  }

  function mount(courseN, row, rest) {
    n = courseN;
    data = row.data;
    pending = rest;
    box.innerHTML = "";
    frame = document.createElement("iframe");
    frame.title = data.name_zh || "";
    frame.addEventListener("load", () => {
      const doc = frame.contentDocument;
      // 框內「← 5 門課目錄」回首頁的 CCAR-P 頁籤；模擬考連結（#__exam、#__exam#concept=…）改到單頁的模擬考
      doc.addEventListener("click", e => {
        const a = e.target.closest && e.target.closest("a[href]");
        if (!a) return;
        const href = a.getAttribute("href");
        if (href === HOME) {
          e.preventDefault();
          location.hash = "#p";
        } else if (href.startsWith(MOCK)) {
          e.preventDefault();
          const rest = href.slice(MOCK.length).replace(/^#/, "");
          location.hash = "#p/exam" + (rest ? "/" + rest : "");
        }
      }, true);
      // 官方初始化跑完（會再打開開場頁）才轉到指定章
      setTimeout(() => goto(pending), 300);
    });
    frame.srcdoc = pageHtml(row);
    box.appendChild(frame);
    document.title = `第 ${data.n} 門・${data.name_zh}（CCAR-P 官方課程中文版）`;
  }

  return {
    get n() {
      return n;
    },
    msg,
    mount,
    open(rest) {
      document.title = `第 ${data.n} 門・${data.name_zh}（CCAR-P 官方課程中文版）`;
      if (rest) goto(rest);
    }
  };
})();

lor:var(--fg);border-bottom-color:var(--accent);font-weight:600}\nmain{max-width:980px;margin:0 auto;padding:16px}\nh2{font-size:20px;margin:4px 0 12px}\nh3{font-size:16px;margin:18px 0 8px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}\n.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}\n.stat b{display:block;font-size:24px;line-height:1.2}\n.stat span{color:var(--muted);font-size:13px}\nbutton,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:8px}\nbutton.pri{background:var(--accent);border-color:var(--accent);color:#fff}\nbutton.ghost{background:none}\nbutton:disabled{opacity:.45;cursor:not-allowed}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.muted{color:var(--muted)}\n.small{font-size:13px}\nselect,input[type=text],input[type=date]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}\nlabel.ck{display:inline-flex;gap:6px;align-items:center}\n.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}\n.bar i{display:block;height:100%;background:var(--accent)}\n.bar.ok i{background:var(--ok)}\n.bar.bad i{background:var(--bad)}\ntable{border-collapse:collapse;width:100%}\ntd,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}\nth{font-size:13px;color:var(--muted);font-weight:600}\n.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent)}\n.tag.multi{background:var(--bad-weak);color:var(--bad)}\n.tag.off{background:var(--ok-weak);color:var(--ok)}\n/* question */\n.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}\n.qmeta .sp{margin-left:auto}\n.stem{font-size:var(--qfs);line-height:1.75}\n.zh{margin-top:10px;padding:10px g);padding:6px 10px;border-radius:8px;font-size:14px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}\n/* exam */\n.ebar{position:sticky;top:86px;z-index:4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);padding:8px 0;margin-bottom:8px;border-bottom:1px solid var(--line)}\n.ebar .timer{font-size:20px}\n.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px;margin-top:8px}\n.navgrid button{padding:5px 0;font-size:13px;border-radius:6px}\n.navgrid button.ans{background:var(--accent-weak);border-color:var(--accent)}\n.navgrid button.flag{box-shadow:inset 0 -3px 0 var(--warn)}\n.navgrid button.cur{outline:2px solid var(--fg)}\n.navgrid button.r-ok{background:var(--ok-weak);border-color:var(--ok)}\n.navgrid button.r-bad{background:var(--bad-weak);border-color:var(--bad)}\n.big{font-size:40px;font-weight:800;line-height:1.1}\n/* vocab */\n.fc{text-align:center;padding:34px 16px}\n.fc .w{font-size:32px;font-weight:700}\n.fc .m{font-size:22px;margin-top:10px}\n.fc .ex{margin-top:16px;text-align:left;font-size:16px;line-height:1.7}\n.pat td:first-child{font-family:ui-monospace,Consolas,monospace;font-size:14px}\n.plan td{font-size:14px}\n.plan tr.today td{background:var(--accent-weak)}\n.plan tr.past td{color:var(--muted)}\n.plan tr.exam td{background:var(--ok-weak);font-weight:600}\nkbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px}\n@media (max-width:600px){\n  .ebar{top:84px}\n  .big{font-size:32px}\n  .hwrap .fs{display:none}\n}\n/* 逐字翻譯＋拆句（2026-11-13） */\n.gw{cursor:pointer;border-radius:3px}\n.gw:hover{background:var(--accent-weak)}\n.gw.vk{text-decoration:underline dotted var(--muted);text-underline-offset:4px}\n.gw.hit{background:var(--mark)}\n.gw.lk{box-shadow:inset 0 -2px 0 var(--warn)}\n.gq mark.clue{padding:0;border-radius:0}\n.gsplit{margin-top:12px;padding:10px 12px;border:1px dashed var(--accent);border-radius:10px;background:var(--card);cursor:default}\n.gsplit-o{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);cursor:default}\n.gsent{margin:8px 0 14px}\n.gcks{display:flex;flex-wrap:wrap;gap:6px}\n.gck{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;padding:4px 8px;max-width:100%}\n.gck.core{border-color:var(--accent);background:var(--accent-weak)}\n.gce{font-size:calc(var(--qfs) - 2px);line-height:1.4}\n.gcz{font-size:14px;line-height:1.4}\n.gcr{font-size:12px;color:var(--muted)}\n.gck.core .gcr{color:var(--accent);font-weight:600}\n.gline{font-size:14px;margin-top:6px}\n.gask{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--mark);font-size:14px}\n/* 情境（CCAR-F：每題掛在 6 個官方情境之一） */\n.scbox{margin:0 0 12px;padding:8px 12px;border:1px solid var(--line);border-left:3px solid var(--qual);border-radius:0 8px 8px 0;background:var(--card);font-size:14px}\n.scbox .row{gap:6px 10px}\n.scdesc{margin-top:8px;font-size:calc(var(--qfs) - 2px);line-height:1.7}\n.scintro{font-size:var(--qfs);line-height:1.8}\n.navgrid .sch{grid-column:1/-1;font-size:13px;color:var(--muted);margin-top:8px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}\n.navgrid .sch button{padding:2px 8px;font-size:12px}\n\u003c/style>\n\u003cstyle>\n@media (max-width:900px){nav{flex-wrap:wrap;overflow-x:visible}nav button{padding:6px 8px}}\n@media (max-width:600px){.hwrap .fs{display:flex}.hwrap .fs button{padding:4px 8px}}\n.ebar{top:var(--zr-hdr,86px)!important}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003cdiv class=\"hwrap\">\n    \u003cdiv class=\"brand\">CCAR-F 模擬考 \u003csmall>Claude Certified Architect – Foundations\u003c/small>\u003c/div>\n    \u003cdiv class=\"row fs\">\u003cspan class=\"small muted\">字級\u003c/span>\u003cbutton data-fs=\"-1\">A−\u003c/button>\u003cbutton data-fs=\"1\">A＋\u003c/button>\u003cbutton id=\"theme\">深/淺\u003c/button>\u003c/div>\n  \u003c/div>\n  \u003cnav id=\"nav\">\n    \u003cbutton data-v=\"home\">首頁\u003c/button>\n    \u003cbutton data-v=\"learn\">學習（中英對照）\u003c/button>\n    \u003cbutton data-v=\"practice\">練習（英文直讀）\u003c/button>\n    \u003cbutton data-v=\"exam\">模擬考\u003c/button>\n    \u003cbutton data-v=\"wrong\">錯題本\u003c/button>\n    \u003cbutton data-v=\"vocab\">單字卡\u003c/button>\n    \u003cbutton data-v=\"tips\">讀題技巧\u003c/button>\n    \u003cbutton data-v=\"concepts\">考點清單\u003c/button>\n    \u003cbutton data-v=\"plan\">讀書計畫\u003c/button>\n  \u003c/nav>\n\u003c/header>\n\u003cscript>(function(){var h=document.querySelector(\"header\");function f(){document.documentElement.style.setProperty(\"--zr-hdr\",h.offsetHeight+\"px\");}f();new ResizeObserver(f).observe(h);})();\u003c/script>\n\u003cmain id=\"app\">\u003c/main>\n\u003cdiv id=\"tip\" class=\"tip\" hidden>\u003c/div>\n/*__EXAM_DATA__*/\u003cscript>\n\"use strict\";\nconst BANK = window.__EXAM.BANK;\nconst CONCEPTS = window.__EXAM.CONCEPTS;\nconst SCENARIOS = window.__EXAM.SCENARIOS;\nconst DOMAINS = {\"1\":{\"en\":\"Agentic Architecture & Orchestration\",\"zh\":\"代理架構與編排\",\"w\":27},\"2\":{\"en\":\"Tool Design & MCP Integration\",\"zh\":\"工具設計與 MCP 整合\",\"w\":18},\"3\":{\"en\":\"Claude Code Configuration & Workflows\",\"zh\":\"Claude Code 設定與工作流程\",\"w\":20},\"4\":{\"en\":\"Prompt Engineering & Structured Output\",\"zh\":\"提示工程與結構化輸出\",\"w\":20},\"5\":{\"en\":\"Context Management & Reliability\",\"zh\":\"上下文管理與可靠性\",\"w\":15}};\nconst TASKS = window.__EXAM.TASKS;\nconst CORE_VOCAB = window.__EXAM.CORE_VOCAB;\nconst TIP_PATS = window.__EXAM.TIP_PATS;\nconst BUILD_INFO = {\"note\":\"官方範例 12 題＋依官方 Exam Guide v1.0 的 30 個 task（256 個考點）仿出 361 題：三個模型分考點出題、兩個非出題模型盲答交叉審查、仲裁、改寫題再由第三個模型複核。模考 A–D 各 60 題（C、D 是保留卷，練習時不出）。\"};\nconst QGLOSS = window.__EXAM.QGLOSS;\n\n/* 單字分類：q=題目限定詞 a=代理與編排 t=工具與MCP c=Claude Code p=提示與結構化輸出 x=上下文與可靠性；D1–D5＝題目單字\n   CORE_VOCAB 由 site/mkvocab.py 產生（核心字表 data/core_vocab.json＋題庫每題 vocab 彙整），題庫更新後重跑 */\nconst CORE_CAT = {q:\"題目限定詞與常用字\", a:\"代理與編排\", t:\"工具與 MCP\", c:\"Claude Code\", p:\"提示與結構化輸出\", x:\"上下文與可靠性\"};\n/* ---------- storage ---------- */\nconst STORE_KEY = \"ccarf-mock-v1\";\nlet DB = {att:{}, wrong:{}, vk:{}, exams:[], plan:{}, examDate:\"\", fs:18, theme:\"\", scOpen:{}};\nfunction load(){ try{ const s = localStorage.getItem(STORE_KEY); if(s) DB = Object.assign(DB, JSON.parse(s)); }catch(e){} }\nfunction save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){} }\nload();\n\n/* ---------- helpers ---------- */\nconst $ = s => document.querySelector(s);\nconst app = $(\"#app\");\nconst esc = s => String(s ?? \"\").replace(/[&\u003c>\"']/g, c => ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst QBYID = Object.fromEntries(BANK.map(q => [q.id, q]));\nconst LET = \"ABCDE\";\nfunction shuffle(a, rnd){ rnd = rnd || Math.random; a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }\nfunction mulberry(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nfunction fmt(ms){ ms = Math.max(0, Math.round(ms/1000)); const h=Math.floor(ms/3600), m=Math.floor(ms%3600/60), s=ms%60; return (h? h+\":\"+String(m).padStart(2,\"0\") : m) + \":\" + String(s).padStart(2,\"0\"); }\nfunction pct(a,b){ return b ? Math.round(a*100/b) : 0; }\nfunction ymd(d){ return d.getFullYear()+\"-\"+String(d.getMonth()+1).padStart(2,\"0\")+\"-\"+String(d.getDate()).padStart(2,\"0\"); }\nfunction dayDiff(a, b){ const A=new Date(a+\"T00:00:00\"), B=new Date(b+\"T00:00:00\"); return Math.round((B-A)/86400000); }\nconst TARGET_SEC = 120*60/60; // 正式考試 60 題／120 分鐘＝每題 2 分鐘\n\n/* ---------- glossary ---------- */\nconst GLOSS = (function(){\n  const map = new Map();\n  CORE_VOCAB.forEach(([en, zh, c]) => { const k=en.toLowerCase(); if(!map.has(k)) map.set(k, {en, zh, cat:c, qids:[]}); });\n  BANK.forEach(q => (q.vocab||[]).forEach(v => {\n    const k = String(v.en).toLowerCase().trim(); if(!k) return;\n    if(!map.has(k)) map.set(k, {en:v.en, zh:v.zh, cat:\"D\"+q.domain, qids:[]});\n    const g = map.get(k); if(!g.qids.includes(q.id)) g.qids.push(q.id);\n  }));\n  // 為 core 字找例句出處（官方範例題優先）；每個字的例句題號也把官方範例排前面\n  const off = id => QBYID[id] && QBYID[id].official ? 1 : 0;\n  const all = BANK.slice().sort((a, b) => (b.official ? 1 : 0) - (a.official ? 1 : 0)).map(q => [q.id, (q.stem_en+\" \"+q.options_en.join(\" \")).toLowerCase()]);\n  map.forEach((g, k) => { if(g.qids.length) return; const re = new RegExp(\"(^|[^a-z])\"+k.replace(/[.*+?^${}()|[\\]\\\\]/g,\"\\\\$&\"), \"i\"); for(const [id, t] of all){ if(re.test(t)){ g.qids.push(id); if(g.qids.length>=3) break; } } });\n  map.forEach(g => g.qids.sort((a, b) => off(b) - off(a)));\n  return map;\n})();\nconst GLOSS_RE = (function(){\n  const keys = [...GLOSS.keys()].sort((a,b) => b.length - a.length).map(k => k.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\").replace(/\\s+/g, \"\\\\s+\"));\n  return new RegExp(\"(?\u003c![A-Za-z])(\" + keys.join(\"|\") + \")(?:s|es|ed|d|ing)?(?![A-Za-z])\", \"gi\");\n})();\nconst QUAL_RE = /(?\u003c![A-Za-z])(BEST|MOST|FIRST|LEAST|PRIMARY|NOT|EXCEPT|ONLY|TWO|THREE)(?![A-Za-z])/gi;\nfunction glossLookup(w){\n  let k = w.toLowerCase().replace(/\\s+/g, \" \");\n  if(GLOSS.has(k)) return GLOSS.get(k);\n  for(const suf of [\"ing\",\"ed\",\"es\",\"s\",\"d\"]){ if(k.endsWith(suf)){ const b = k.slice(0, -suf.length); if(GLOSS.has(b)) return GLOSS.get(b); if(GLOSS.has(b+\"e\")) return GLOSS.get(b+\"e\"); } }\n  return null;\n}\n/* 把英文轉成 HTML：底線單字（點了看中文）、紫色限定詞、黃底關鍵句 */\nfunction renderText(text, o){\n  o = o || {};\n  text = String(text || \"\");\n  if(o.clue){\n    const k = text.indexOf(o.clue);\n    if(k >= 0){ const p = Object.assign({}, o, {clue:null}); return renderText(text.slice(0,k), p) + '\u003cmark class=\"clue\">' + renderText(o.clue, p) + '\u003c/mark>' + renderText(text.slice(k+o.clue.length), p); }\n  }\n  if(!o.vocab && !o.qual) return esc(text);\n  const hits = [];\n  if(o.vocab){ for(const m of text.matchAll(GLOSS_RE)){ const g = glossLookup(m[0]) || glossLookup(m[1]); if(g) hits.push([m.index, m.index+m[0].length, \"v\", g]); } }\n  if(o.qual){ for(const m of text.matchAll(QUAL_RE)){ const w=m[0]; const strong = w === w.toUpperCase() || /^(best|most|first|least|primary|except)$/i.test(w); if(strong) hits.push([m.index, m.index+w.length, \"q\"]); } }\n  hits.sort((a,b) => a[0]-b[0] || (b[1]-b[0])-(a[1]-a[0]));\n  let out = \"\", last = 0;\n  for(const h of hits){\n    if(h[0] \u003c last) continue;\n    out += esc(text.slice(last, h[0]));\n    const w = text.slice(h[0], h[1]);\n    if(h[2] === \"v\"){ const isQ = o.qual && /^(best|most|first|least|primary|except|most likely|most appropriate|most directly|most effective)$/i.test(w); out += '\u003cspan class=\"v'+(o.hl && o.hl===h[3].en.toLowerCase()?' hit':'')+'\" data-zh=\"'+esc(h[3].zh)+'\" data-en=\"'+esc(h[3].en)+'\">' + (isQ ? '\u003cb class=\"q\">'+esc(w)+'\u003c/b>' : esc(w)) + '\u003c/span>'; }\n    else out += '\u003cb class=\"q\">' + esc(w) + '\u003c/b>';\n    last = h[1];\n  }\n  return out + esc(text.slice(last));\n}\n\n/* ---------- 逐字翻譯＋拆句（QGLOSS；2026-11-13 peter-e8 加入） ----------\n   規則：學習模式、模考交卷後的解答、單字卡、讀題技巧頁：每個字滑過或點一下就出中文，拆句隨時可開，都不記錄。\n   練習／錯題重練（還沒送出答案時）：字要「點」才出中文，記為「查字」（同一題同一個字只算一次），不算看中文；按「拆句」算看中文。\n   送出答案後：全部開放、不記錄。模擬考作答中：全部沒有（正式考試沒有這些輔助）。\n   題目文字跟 QGLOSS 建立時不一樣（hash 對不上）就退回原本的單字底線，不會顯示錯位的翻譯。 */\nconst ART_TIP = {a:\"一個（冠詞，通常不用翻）\", an:\"一個（冠詞，通常不用翻）\", the:\"這個／那個（冠詞：指特定的那一個，通常不用翻）\"};\nlet tipEl = null;\nfunction fnv(s){ let h = 0x811c9dc5; for(let i = 0; i \u003c s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; } return h.toString(16); }\nconst QG_CACHE = {};\nfunction qg(q){\n  if(!q || typeof QGLOSS === \"undefined\") return null;\n  if(q.id in QG_CACHE) return QG_CACHE[q.id];\n  const g = QGLOSS[q.id];\n  return (QG_CACHE[q.id] = g && g.h === fnv(q.stem_en + \"\\u0001\" + q.options_en.join(\"\\u0001\")) ? g : null);\n}\nfunction lookupCounted(){\n  if(view !== \"practice\" && view !== \"wrong\") return false;\n  const S = SESS[view];\n  return !!(S && S.i \u003c S.list.length && S.perm && !S.answered);\n}\nfunction noteLookup(el){\n  if(!lookupCounted()) return;\n  const S = SESS[view]; S.lk = S.lk || {};\n  const k = el.dataset.k || (\"v:\" + String(el.dataset.en || \"\").toLowerCase());\n  if(S.lk[k]) return;\n  S.lk[k] = 1; el.classList.add(\"lk\");\n  const c = document.getElementById(\"lkn\"); if(c) c.textContent = (S.lkTotal || 0) + Object.keys(S.lk).length;\n}\nfunction qualRanges(text){\n  const r = [];\n  for(const m of text.matchAll(QUAL_RE)){ const w = m[0]; if(w === w.toUpperCase() || /^(best|most|first|least|primary|except)$/i.test(w)) r.push([m.index, m.index + w.length]); }\n  return r;\n}\nfunction isHl(w, gl, hl){\n  const s = w.toLowerCase();\n  if(s === hl || (gl && gl.en.toLowerCase() === hl)) return true;\n  return new RegExp(\"(^|[^a-z])\" + hl.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\") + \"([^a-z]|$)\").test(s);\n}\n/* text：原文；toks：[[起, 迄, 中文, 詞性]]；o：{seg, from, to, clue:[起,迄], qual, hl} */\nfunction glossHTML(text, toks, o){\n  o = o || {};\n  const from = o.from || 0, to = o.to ?? text.length;\n  const qr = o.qual ? qualRanges(text) : [];\n  const cl = o.clue || null;\n  const S = (view === \"practice\" || view === \"wrong\") ? SESS[view] : null;\n  const lkSet = S && S.lk;\n  // 單字卡要標亮的字／片語在原文出現的範圍（片語可能跨好幾個字，例 most directly）\n  const hr = o.hl ? [...text.matchAll(new RegExp(\"(?\u003c![A-Za-z])\" + o.hl.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\").replace(/\\s+/g, \"\\\\s+\") + \"(?:s|es|ed|d|ing)?(?![A-Za-z])\", \"gi\"))].map(m => [m.index, m.index + m[0].length]) : [];\n  const inner = (a, b) => {\n    const cuts = new Set([a, b]);\n    if(cl) for(const x of cl) if(x > a && x \u003c b) cuts.add(x);\n    for(const r of qr) for(const x of r) if(x > a && x \u003c b) cuts.add(x);\n    const cs = [...cuts].sort((x, y) => x - y); let s = \"\";\n    for(let i = 0; i \u003c cs.length - 1; i++){\n      const x = cs[i], y = cs[i + 1]; let piece = esc(text.slice(x, y));\n      if(qr.some(r => x >= r[0] && y \u003c= r[1])) piece = '\u003cb class=\"q\">' + piece + '\u003c/b>';\n      if(cl && x >= cl[0] && y \u003c= cl[1]) piece = '\u003cmark class=\"clue\">' + piece + '\u003c/mark>';\n      s += piece;\n    }\n    return s;\n  };\n  const span = (a, b, zh, key) => {\n    const w = text.slice(a, b), gl = glossLookup(w), k = (o.seg || \"x\") + \":\" + key;\n    let cls = \"gw\";\n    if(gl) cls += \" vk\";\n    if(o.hl && (hr.some(r => a \u003c r[1] && b > r[0]) || isHl(w, gl, o.hl))) cls += \" hit\";\n    if(lkSet && lkSet[k]) cls += \" lk\";\n    return `\u003cspan class=\"${cls}\" data-k=\"${esc(k)}\" data-en=\"${esc(w)}\" data-zh=\"${esc(zh)}\">${inner(a, b)}\u003c/span>`;\n  };\n  let out = \"\", p = from;\n  const gap = (a, b) => {\n    if(b \u003c= a) return;\n    const seg = text.slice(a, b); let last = 0;\n    for(const m of seg.matchAll(/(?\u003c![A-Za-z0-9\\/\\-])(a|an|the)(?=\\s)/gi)){\n      out += inner(a + last, a + m.index);\n      out += span(a + m.index, a + m.index + m[0].length, ART_TIP[m[0].toLowerCase()], \"a\" + (a + m.index));\n      last = m.index + m[0].length;\n    }\n    out += inner(a + last, b);\n  };\n  const items = (toks || []).map((t, i) => [t[0], t[1], t[2] + \"〔\" + t[3] + \"〕\", \"k\" + i]).filter(t => t[0] >= from && t[1] \u003c= to).sort((x, y) => x[0] - y[0]);\n  for(const it of items){ if(it[0] \u003c p) continue; gap(p, it[0]); out += span(it[0], it[1], it[2], it[3]); p = it[1]; }\n  gap(p, to);\n  return '\u003cspan class=\"gq\">' + out + '\u003c/span>';\n}\nfunction stemHTML(q, helps, showAns){\n  const g = helps ? qg(q) : null;\n  if(!g || !g.sw) return renderText(q.stem_en, {vocab:helps, qual:helps, clue: showAns ? q.key_clue_en : null});\n  const k = showAns && q.key_clue_en ? q.stem_en.indexOf(q.key_clue_en) : -1;\n  return glossHTML(q.stem_en, g.sw, {seg:\"s\", qual:true, clue: k >= 0 ? [k, k + q.key_clue_en.length] : null});\n}\nfunction optHTML(q, oi, helps){\n  const g = helps ? qg(q) : null;\n  if(!g || !g.ow || !g.ow[oi] || !g.ow[oi].length) return renderText(q.options_en[oi], {vocab:helps});\n  return glossHTML(q.options_en[oi], g.ow[oi], {seg:\"o\" + oi});\n}\nfunction clueHTML(q){\n  const g = qg(q), k = q.stem_en.indexOf(q.key_clue_en);\n  if(!g || !g.sw || k \u003c 0) return esc(q.key_clue_en);\n  return glossHTML(q.stem_en, g.sw, {seg:\"s\", from:k, to:k + q.key_clue_en.length});\n}\nfunction chunksHTML(text, ch){\n  return '\u003cdiv class=\"gcks\">' + (ch || []).map(c => `\u003cdiv class=\"gck${String(c[2]).startsWith(\"★\") ? \" core\" : \"\"}\">\u003cspan class=\"gce\">${esc(text.slice(c[0], c[1]))}\u003c/span>\u003cspan class=\"gcz\">${esc(c[3])}\u003c/span>\u003cspan class=\"gcr\">${esc(c[2])}\u003c/span>\u003c/div>`).join(\"\") + '\u003c/div>';\n}\nfunction sentHTML(text, s, n){\n  let h = `\u003cdiv class=\"gsent\">${n ? `\u003cdiv class=\"small muted\">第 ${n} 句\u003c/div>` : \"\"}${chunksHTML(text, s.c)}`;\n  if(s.core) h += `\u003cdiv class=\"gline\">\u003cb>主幹\u003c/b>　${esc(s.core)}\u003c/div>`;\n  if(s.plain) h += `\u003cdiv class=\"gline\">\u003cb>這句白話說\u003c/b>　${esc(s.plain)}\u003c/div>`;\n  if(s.ask) h += `\u003cdiv class=\"gask\">\u003cb>它到底在問什麼\u003c/b>　${esc(s.ask)}\u003c/div>`;\n  return h + '\u003c/div>';\n}\nconst SPLIT_HELP = '每一塊：上面英文、中間中文、下面是它在句子裡的角色。\u003cb>★＝主幹\u003c/b>（這句「誰＋做什麼」），「X子句·」＝那塊屬於句子裡的小句子。';\nfunction splitPanel(q, g){\n  return `\u003cdiv class=\"gsplit\" data-act=\"noop\">\u003cdiv class=\"small muted\" style=\"margin-bottom:4px\">拆句｜${SPLIT_HELP}選項的拆句在各選項下面。\u003c/div>` + g.ss.map((s, i) => sentHTML(q.stem_en, s, g.ss.length > 1 ? i + 1 : 0)).join(\"\") + '\u003c/div>';\n}\nfunction optSplitHTML(q, oi, c){\n  if(!c || !c.split || c.mode === \"exam\") return \"\";\n  const g = qg(q); if(!g || !g.os || !g.os[oi]) return \"\";\n  const s = g.os[oi];\n  // 畫面已經有選項的中文翻譯（學習模式、送出答案後、按過看中文）就不再重複印白話\n  const zhShown = c.mode === \"learn\" || c.mode === \"review\" || c.showZh || c.answered;\n  return `\u003cdiv class=\"gsplit-o\" data-act=\"noop\">${chunksHTML(q.options_en[oi], s.c)}${s.plain && !zhShown ? `\u003cdiv class=\"gline\">\u003cb>白話\u003c/b>　${esc(s.plain)}\u003c/div>` : \"\"}\u003c/div>`;\n}\nfunction splitBtn(q, c){\n  if(c.mode === \"exam\" || !qg(q) || !qg(q).ss) return \"\";\n  const counted = (c.mode === \"practice\" || c.mode === \"wrong\") && !c.answered;\n  return `\u003cbutton class=\"ghost small\" data-act=\"split\">${c.split ? \"收起拆句\" : counted ? \"拆句（會記為「看中文」）\" : \"拆句\"}\u003c/button>`;\n}\nfunction wordHint(c){\n  const counted = (c.mode === \"practice\" || c.mode === \"wrong\") && !c.answered;\n  return counted ? \"每個英文字都可以\u003cb>點\u003c/b>看中文（記為「查字」，不算看中文）；選答案點左邊的字母圈或按 1–5\"\n                 : \"每個英文字滑過或點一下就有中文；選答案點左邊的字母圈或按 1–5\";\n}\n/* 題卡上的工具列（練習模式還沒按看中文時，按鈕併在「看中文翻譯」那一列，這裡不重複） */\nfunction splitHTML(q, c, helps, zhOpen, showAns){\n  if(!helps) return \"\";\n  let h = \"\";\n  const inHintRow = !zhOpen && !showAns;\n  const btn = splitBtn(q, c);\n  if(!inHintRow) h += `\u003cdiv class=\"row\" style=\"margin-top:10px\">${btn}\u003cspan class=\"small muted\">${wordHint(c)}\u003c/span>\u003c/div>`;\n  const g = qg(q);\n  if(c.split && g && g.ss) h += splitPanel(q, g);\n  return h;\n}\n/* 單字卡例句：用該題的 QGLOSS */\nfunction vocabExHTML(ex, g){\n  const q = QBYID[ex.id], gl = qg(q);\n  const head = `\u003cdiv class=\"small muted\">題庫裡的例句（${esc(ex.id)}）\u003c/div>`;\n  const texts = q ? [q.stem_en, ...q.options_en] : [];\n  const ti = texts.findIndex(t => t.includes(ex.s));\n  if(!gl || ti \u003c 0) return `\u003cdiv class=\"ex\">${head}${renderText(ex.s, {vocab:true, hl:g.en.toLowerCase()})}\u003c/div>`;\n  const text = texts[ti], a = text.indexOf(ex.s), b = a + ex.s.length;\n  const toks = ti === 0 ? gl.sw : (gl.ow || [])[ti - 1];\n  let h = `\u003cdiv class=\"ex\">${head}${glossHTML(text, toks, {seg: ti === 0 ? \"s\" : \"o\" + (ti - 1), from:a, to:b, hl:g.en.toLowerCase()})}`;\n  const sents = ti === 0 ? (gl.ss || []).filter(s => s.a \u003c b && s.b > a) : (gl.os && gl.os[ti - 1] ? [gl.os[ti - 1]] : []);\n  if(sents.length){\n    h += `\u003cdiv class=\"row\" style=\"margin-top:8px\">\u003cbutton class=\"ghost small\" data-act=\"vsplit\">${VS.split ? \"收起拆句\" : \"拆句\"}\u003c/button>\u003cspan class=\"small muted\">每個字滑過或點一下就有中文\u003c/span>\u003c/div>`;\n    if(VS.split) h += `\u003cdiv class=\"gsplit\">\u003cdiv class=\"small muted\" style=\"margin-bottom:4px\">${SPLIT_HELP}\u003c/div>` + sents.map(s => sentHTML(text, s, 0)).join(\"\") + '\u003c/div>';\n  }\n  return h + '\u003c/div>';\n}\n/* 讀題技巧頁的例句 */\nfunction tipHTML(t){\n  const g = typeof QGLOSS !== \"undefined\" ? QGLOSS[\"T:\" + t] : null;\n  return g && g.sw ? glossHTML(t, g.sw, {seg:\"t\"}) : esc(t);\n}\n\n/* ---------- 情境（CCAR-F） ----------\n   每題的 scenario＝官方 6 個情境之一。學習／練習／錯題／解答：題目上方一列「Scenario N: 標題」＋可展開的情境說明\n   （學習模式、按過看中文、送出答案後附中文）。模擬考：每個情境開頭先出一頁情境說明，作答中也能展開（只有英文）。\n   QGLOSS[\"SC:\u003cid>\"]（h＝fnv(desc_en)）有資料時，情境說明也能逐字查。展開／收起依模式記在 DB.scOpen。 */\nconst SCBYID = Object.fromEntries(SCENARIOS.map(s => [String(s.id), s]));\nfunction scName(id){ const s = SCBYID[String(id)]; return s ? s.en : \"（沒有情境）\"; }\nfunction scDescHTML(s, helps){\n  const g = helps && typeof QGLOSS !== \"undefined\" ? QGLOSS[\"SC:\" + s.id] : null;\n  if(g && g.sw && g.h === fnv(s.desc_en)) return glossHTML(s.desc_en, g.sw, {seg:\"sc\"});\n  return helps ? renderText(s.desc_en, {vocab:true}) : esc(s.desc_en);\n}\nfunction scOpen(mode){ const o = DB.scOpen || {}; return mode in o ? !!o[mode] : mode === \"learn\"; }\nfunction scBox(q, c){\n  const s = SCBYID[String(q.scenario)]; if(!s) return \"\";\n  const helps = c.mode !== \"exam\";\n  const zh = helps && (c.mode === \"learn\" || c.mode === \"review\" || !!c.showZh || !!c.answered);\n  const open = scOpen(c.mode);\n  return `\u003cdiv class=\"scbox\">\u003cdiv class=\"row\">\u003cb>Scenario ${esc(s.id)}: ${esc(s.en)}\u003c/b>${zh ? `\u003cspan class=\"muted\">${esc(s.zh)}\u003c/span>` : \"\"}\u003cbutton class=\"ghost small\" data-act=\"sctoggle\" data-m=\"${esc(c.mode)}\" style=\"margin-left:auto\">${open ? \"收起情境說明\" : \"展開情境說明\"}\u003c/button>\u003c/div>`\n    + (open ? `\u003cdiv class=\"scdesc\">${scDescHTML(s, helps)}\u003c/div>${zh ? `\u003cdiv class=\"zh\">${esc(s.desc_zh)}\u003c/div>` : \"\"}` : \"\") + `\u003c/div>`;\n}\n\n/* ---------- tooltip ---------- */\nconst tip = $(\"#tip\");\nfunction showTip(el){ tipEl = el; tip.textContent = el.dataset.en + \"：\" + el.dataset.zh; tip.hidden = false; const r = el.getBoundingClientRect(); const tw = Math.min(280, tip.offsetWidth); let x = Math.min(window.innerWidth - tw - 8, Math.max(8, r.left)); let y = r.bottom + 6; if(y + tip.offsetHeight > window.innerHeight - 8) y = r.top - tip.offsetHeight - 6; tip.style.left = x+\"px\"; tip.style.top = y+\"px\"; }\nfunction hideTip(){ tip.hidden = true; tipEl = null; }\n// 練習模式還沒送出答案時：滑過不出中文（要點，點了記「查字」）\ndocument.addEventListener(\"mouseover\", e => { const v = e.target.closest && e.target.closest(\".v,.gw\"); if(v && !lookupCounted()) showTip(v); else if(v !== tipEl) hideTip(); });\nwindow.addEventListener(\"scroll\", hideTip, {passive:true});\n\n/* ---------- stats ---------- */\nfunction latest(){ const r = {}; for(const id in DB.att){ const a = DB.att[id]; if(a && a.length && QBYID[id]) r[id] = a[a.length-1]; } return r; }\nfunction record(q, correct, ms, hint, mode, lk){ (DB.att[q.id] = DB.att[q.id] || []).push({t:Date.now(), c:correct?1:0, ms:Math.round(ms), h:hint?1:0, m:mode, lk:lk||0}); if(!correct) DB.wrong[q.id] = (DB.wrong[q.id]||0) + 1; save(); }\nfunction recentAttempts(n, modes){ const all = []; for(const id in DB.att) for(const a of DB.att[id]) if(!modes || modes.includes(a.m)) all.push(a); all.sort((a,b) => b.t-a.t); return all.slice(0, n); }\n\n/* ---------- concepts（考點清單；2026-11-12 第三批加入） ---------- */\nconst CS = {d:\"all\", sort:\"id\", weak:false};\nfunction conceptStats(){\n  const st = {};\n  for(const c of CONCEPTS) st[c.id] = {q:[], qp:[], n:0, c:0, seen:0};\n  for(const q of BANK){\n    for(const cid of (q.concepts || [])){\n      const s = st[cid]; if(!s) continue;\n      s.q.push(q.id);\n      if(q.set !== \"C\" && q.set !== \"D\") s.qp.push(q.id);\n      const a = DB.att[q.id] || [];\n      if(a.length) s.seen++;\n      for(const x of a){ s.n++; s.c += x.c; }\n    }\n  }\n  return st;\n}\nfunction isWeak(s){ return s.n === 0 || s.c / s.n \u003c 0.7; }\nfunction vConcepts(){\n  const st = conceptStats();\n  let list = CONCEPTS.filter(c => CS.d === \"all\" || c.task.split(\".\")[0] === CS.d);\n  if(CS.weak) list = list.filter(c => isWeak(st[c.id]));\n  if(CS.sort === \"weak\") list = list.slice().sort((a, b) => {\n    const A = st[a.id], B = st[b.id];\n    const ra = A.n ? A.c / A.n : -1, rb = B.n ? B.c / B.n : -1;\n    return ra - rb || a.id.localeCompare(b.id, undefined, {numeric:true});\n  });\n  const all = CONCEPTS.length, done = CONCEPTS.filter(c => st[c.id].n).length, weakN = CONCEPTS.filter(c => isWeak(st[c.id])).length;\n  let h = `\u003ch2>考點清單\u003c/h2>\n  \u003cdiv class=\"card small\">${all ? `官方 Exam Guide 的 ${Object.keys(TASKS).length} 個 task 細分成 \u003cb>${all}\u003c/b> 個考點（一個考點＝一道情境題能考的一個判斷點）。` : `\u003cb>考點地圖還沒放進來\u003c/b>（官方 Exam Guide 有 ${Object.keys(TASKS).length} 個 task，之後會細分成考點）。`}每題都標了它考的考點，正確率依你在本站的作答紀錄計算（學習、練習、模考都算）。\n  \u003cbr>已作答過的考點 ${done} / ${all}；弱點（沒做過或正確率低於 70%）${weakN} 個。建議：先把弱點考點用「學習」看懂，再用「練習」英文直讀。預設不出模考 C／D 保留題。\u003c/div>\n  \u003cdiv class=\"card\">\u003cdiv class=\"row\">\n    \u003clabel>Domain \u003cselect data-cs=\"d\">\u003coption value=\"all\">全部\u003c/option>${Object.keys(DOMAINS).map(d => `\u003coption value=\"${d}\" ${CS.d===d?\"selected\":\"\"}>D${d} ${esc(DOMAINS[d].zh)}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n    \u003clabel>排序 \u003cselect data-cs=\"sort\">\u003coption value=\"id\" ${CS.sort===\"id\"?\"selected\":\"\"}>依編號\u003c/option>\u003coption value=\"weak\" ${CS.sort===\"weak\"?\"selected\":\"\"}>正確率低的在前（沒做過的最前）\u003c/option>\u003c/select>\u003c/label>\n    \u003clabel class=\"ck\">\u003cinput type=\"checkbox\" data-cs=\"weak\" ${CS.weak?\"checked\":\"\"}> 只看弱點\u003c/label>\n  \u003c/div>\u003c/div>`;\n  let lastTask = null;\n  for(const c of list){\n    const s = st[c.id];\n    if(CS.sort === \"id\" && c.task !== lastTask){\n      lastTask = c.task;\n      h += `\u003ch3 style=\"margin:18px 0 6px\">${esc(c.task)} ${esc(TASKS[c.task] ? TASKS[c.task][1] : \"\")}\u003c/h3>`;\n    }\n    const rate = s.n ? pct(s.c, s.n) : null;\n    const cls = rate === null ? \"\" : (rate >= 70 ? \"ok\" : \"bad\");\n    h += `\u003cdiv class=\"card cpt\" data-cid=\"${esc(c.id)}\" style=\"padding:10px 12px;margin:6px 0\">\n      \u003cdiv>\u003cspan class=\"tag\">${esc(c.id)}\u003c/span> \u003cb>${esc(c.name_zh)}\u003c/b> \u003cspan class=\"muted small\">${esc(c.name_en)}\u003c/span>\u003c/div>\n      \u003cdiv class=\"small\" style=\"margin:4px 0\">${esc(c.desc_zh)}\u003c/div>\n      \u003cdiv class=\"row small\" style=\"align-items:center;gap:10px;flex-wrap:wrap\">\n        \u003cspan>題數 ${s.q.length}${s.q.length !== s.qp.length ? `（可練 ${s.qp.length}）` : \"\"}\u003c/span>\n        \u003cspan>做過 ${s.seen} 題 · 作答 ${s.n} 次\u003c/span>\n        \u003cspan>正確率 ${rate === null ? \"—\" : rate + \"%\"}\u003c/span>\n        ${rate === null ? \"\" : `\u003cspan class=\"bar ${cls}\" style=\"display:inline-block;width:80px\">\u003ci style=\"width:${rate}%\">\u003c/i>\u003c/span>`}\n        \u003cbutton data-act=\"cstudy\" data-m=\"learn\" data-cid=\"${esc(c.id)}\" ${s.qp.length ? \"\" : \"disabled\"}>學習\u003c/button>\n        \u003cbutton data-act=\"cstudy\" data-m=\"practice\" data-cid=\"${esc(c.id)}\" ${s.qp.length ? \"\" : \"disabled\"}>練習\u003c/button>\n      \u003c/div>${s.qp.length ? \"\" : `\u003cdiv class=\"small muted\" style=\"margin-top:4px\">這個考點目前只出現在模考 C／D 保留卷，練習時不會出；練習題之後補。\u003c/div>`}\u003c/div>`;\n  }\n  if(!list.length) h += `\u003cdiv class=\"card muted\">沒有符合條件的考點。\u003c/div>`;\n  app.innerHTML = h;\n}\nfunction conceptsClick(act, t){\n  if(act !== \"cstudy\") return;\n  const cid = t.dataset.cid, mode = t.dataset.m === \"practice\" ? \"practice\" : \"learn\";\n  const list = shuffle(BANK.filter(q => (q.concepts || []).includes(cid) && q.set !== \"C\" && q.set !== \"D\").map(q => q.id));\n  if(!list.length) return;\n  SESS[mode] = {mode, list, i:0, perm:null, picked:[], answered:false, hint:false, t0:Date.now(), right:0, wrong:0, hints:0, ms:0, res:[], concept:cid};\n  go(mode);\n}\nfunction conceptsChange(t){\n  const k = t.dataset.cs; if(!k) return;\n  CS[k] = t.type === \"checkbox\" ? t.checked : t.value;\n  render();\n}\n\n/* ---------- view router ---------- */\nlet view = \"home\";\nfunction go(v){ view = v; render(); window.scrollTo(0,0); }\ndocument.getElementById(\"nav\").addEventListener(\"click\", e => { const b = e.target.closest(\"button[data-v]\"); if(b) go(b.dataset.v); });\ndocument.querySelectorAll(\"[data-fs]\").forEach(b => b.addEventListener(\"click\", () => { DB.fs = Math.min(26, Math.max(14, (DB.fs||18) + Number(b.dataset.fs))); applyPrefs(); save(); }));\n$(\"#theme\").addEventListener(\"click\", () => { const cur = DB.theme || (matchMedia(\"(prefers-color-scheme: dark)\").matches ? \"dark\" : \"light\"); DB.theme = cur === \"dark\" ? \"light\" : \"dark\"; applyPrefs(); save(); });\nfunction applyPrefs(){ document.documentElement.style.setProperty(\"--qfs\", (DB.fs||18)+\"px\"); if(DB.theme) document.documentElement.setAttribute(\"data-theme\", DB.theme); }\napplyPrefs();\nfunction render(){\n  document.querySelectorAll(\"#nav button\").forEach(b => b.classList.toggle(\"on\", b.dataset.v === view));\n  hideTip();\n  ({home:vHome, learn:() => vPractice(\"learn\"), practice:() => vPractice(\"practice\"), wrong:() => vPractice(\"wrong\"), exam:vExam, vocab:vVocab, tips:vT
