<style>
:root {
  color-scheme: light;
  --bg: #faf9f5;
  --surface: #e8e6dc;
  --ink: #141413;
  --mid: #615f5b;
  --muted: #8f8b80;
  --white: #ffffff;
  --line: #d1cfc5;
  --primary: #2c2b25;
  --primary-hover: #141413;
  --accent-p: #d97757;
  --accent-p-hover: #bd5d3a;
  --tint-p: #f4ddd2;
  --font: "Styrene B", "Segoe UI", Arial, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", sans-serif;
  --head: Copernicus, Georgia, "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 16px/1.7 var(--font); }
.wrap { max-width: 880px; margin: 0 auto; padding: 28px 16px 64px; }
h1 { font: 600 28px/1.3 var(--head); letter-spacing: -0.6px; margin: 0 0 6px; }
.src { color: var(--mid); font-size: 14px; margin: 0 0 22px; }

/* 頂部專區切換按鈕 */
.tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 24px;
}
.tab-btn {
  cursor: pointer;
  text-align: left;
  background: var(--white);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 16px 18px;
  transition: all 0.15s ease;
  font-family: inherit;
  color: var(--ink);
}
.tab-btn:hover { border-color: var(--mid); }
.tab-btn .tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.1em;
  padding: 2px 9px;
  border-radius: 999px;
  margin-bottom: 6px;
}
.tab-btn.f .tag { background: #efede6; color: var(--primary); }
.tab-btn.p .tag { background: var(--tint-p); color: var(--accent-p-hover); }
.tab-btn .title { display: block; font-size: 18px; font-weight: 600; }
.tab-btn .desc { display: block; font-size: 13px; color: var(--mid); margin-top: 2px; }

.tab-btn.f.active { border-color: var(--primary); box-shadow: 0 4px 14px rgba(20, 20, 19, 0.08); }
.tab-btn.p.active { border-color: var(--accent-p); box-shadow: 0 4px 14px rgba(217, 119, 87, 0.14); }

/* 專區標題列與直接前往按鈕 */
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--line);
}
.sec-head h2 { margin: 0; font-size: 20px; font-family: var(--head); }
.sec-actions { display: flex; gap: 14px; font-size: 14px; }
.sec-actions a { color: var(--primary-hover); font-weight: 600; text-decoration: none; }
.sec-actions a:hover { text-decoration: underline; }
.theme-p .sec-actions a { color: var(--accent-p-hover); }

/* 課程卡片樣式 */
.course {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 14px;
  margin: 0 0 14px;
  overflow: hidden;
}
.course > summary {
  cursor: pointer;
  list-style: none;
  padding: 14px 18px;
  display: flex;
  gap: 12px;
  align-items: baseline;
  flex-wrap: wrap;
}
.course > summary::-webkit-details-marker { display: none; }
.course .num { font-size: 11px; letter-spacing: 0.12em; color: var(--mid); font-weight: 600; white-space: nowrap; }
.theme-p .course .num { color: var(--accent-p); }
.course .t { font-weight: 600; font-size: 17px; font-family: var(--head); }
.theme-p .course .t { font-family: var(--font); }
.course .en { color: var(--mid); font-size: 13px; width: 100%; }
.course .tag { color: var(--mid); font-size: 14px; width: 100%; }
.course .go { margin-left: auto; font-size: 13px; color: var(--primary-hover); text-decoration: none; white-space: nowrap; font-weight: 600; }
.theme-p .course .go { color: var(--accent-p-hover); }

ol.ch { margin: 0; padding: 4px 18px 14px 46px; border-top: 1px solid var(--line); }
ol.ch li { margin: 6px 0; }
ol.ch a { color: var(--ink); text-decoration: none; }
ol.ch a:hover { color: var(--primary-hover); text-decoration: underline; }
.theme-p ol.ch a:hover { color: var(--accent-p-hover); }
ol.ch .m { color: var(--muted); font-size: 12.5px; margin-left: 6px; }
ol.ch .e { color: var(--mid); font-size: 12.5px; display: block; }

/* 常見疑問摺疊區塊 */
.more { margin-top: 26px; }
.more > summary { cursor: pointer; color: var(--mid); font-size: 14px; font-weight: 600; }
.qa { background: var(--white); border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; }
.qa > summary { cursor: pointer; padding: 10px 14px; font-weight: 600; }
.qa .b { padding: 0 14px 12px; font-size: 15px; }
.qa .b p { margin: 8px 0; }

.hidden { display: none; }
</style>

    {"q":"先讀英文還是先讀中文？官方課程要翻中文看嗎？","a":"**答：觀念用中文讀懂，英文只練兩樣：關鍵術語、題目。**\n- 考試考的是「判斷」，不是英文閱讀；而且正式考試只有題目，沒有課文。用英文硬啃 12 小時的課程，時間會變 1.5～2 倍，換到的英文能力卻用不到考試上。\n- 官方課程 → 讀精譯版（不要用瀏覽器機翻），但每章標成「英文＋點開看中文」的關鍵術語，要記住它的英文長相（考試選項、問句最後一句常直接用這些字）。\n- 英文閱讀 → 練在題目上：學習模式（中英對照）→ 練習模式（英文直讀）。題目英文的句型很固定（Which … MOST appropriate／What should the architect do FIRST），練得起來。\n- 不建議「中文全部看一遍、再英文全部看一遍」：第二遍的時間拿去做題，效果比較好。"},

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const plain = s => String(s ?? "").replace(/\{\{([^{}|]+)(?:\|[^{}]+)?\}\}/g, "$1");

function renderF() {
  document.getElementById("list-f").innerHTML = DATA_F.courses.map(c => `
    <details class="course">
      <summary>
        <span class="num">第 ${c.n} 門・${esc(c.official)}</span>
        <span class="t">${esc(c.name_zh)}</span>
        <a class="go" href="${DATA_F.baseDir}${esc(c.file)}">從頭上課 →</a>
        <span class="en">${esc(c.name_en)}</span>
        <span class="tag">${esc(c.tag_zh)}</span>
      </summary>
      <ol class="ch">
        ${c.chapters.map(ch => `
          <li>
            <a href="${DATA_F.baseDir}${esc(c.file)}#${esc(ch.id)}">${esc(plain(ch.title_zh || ch.title_en))}</a>
            <span class="m">${ch.n} 個單元${ch.nNew === null || ch.nNew === undefined ? "" : (ch.nNew ? `（${ch.nNew} 個是第 2 門沒有的新主題）` : "（都同第 2 門）")}${ch.min && ch.nNew !== 0 ? `・約 ${ch.min} 分鐘` : ""}</span>
            <span class="e">${esc(ch.title_en)}</span>
          </li>
        `).join("")}
      </ol>
    </details>
  `).join("");
}

function renderP() {
  document.getElementById("list-p").innerHTML = DATA_P.courses.map(c => `
    <details class="course">
      <summary>
        <span class="num">第 ${c.n} 門${c.min ? `・官方 ${c.min} 分鐘` : ""}</span>
        <span class="t">${esc(c.name_zh)}</span>
        <a class="go" href="${DATA_P.baseDir}${esc(c.file)}">從頭上課 →</a>
        <span class="en">${esc(c.name_en)}</span>
      </summary>
      <ol class="ch">
        ${c.chapters.map(ch => `
          <li>
            <a href="${DATA_P.baseDir}${esc(c.file)}#${esc(ch.id)}">${esc(plain(ch.title_zh))}</a>
            <span class="m">${ch.screens} 個畫面${ch.min ? `・約 ${ch.min} 分鐘` : ""}</span>
            <span class="e">${esc(ch.title_en)}</span>
          </li>
        `).join("")}
      </ol>
    </details>
  `).join("");

  const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").split(/\n{2,}/).map(p => `<p>${p.replace(/\n/g, "<br>")}</p>`).join("");
  document.getElementById("plan-p").innerHTML = `
    <details class="more">
      <summary>CCAR-P 讀書計畫相關的常見疑問（${DATA_P.planQa.length} 題）</summary>
      ${DATA_P.planQa.map(q => `<details class="qa"><summary>${esc(plain(q.q))}</summary><div class="b">${md(plain(q.a))}</div></details>`).join("")}
    </details>
  `;
}

function switchTab(tab) {
  const isF = tab === "f";
  document.getElementById("btn-f").classList.toggle("active", isF);
  document.getElementById("btn-p").classList.toggle("active", !isF);
  document.getElementById("sec-f").classList.toggle("hidden", !isF);
  document.getElementById("sec-p").classList.toggle("hidden", isF);
  history.replaceState(null, "", isF ? "#f" : "#p");
}

renderF();
renderP();
if (location.hash.toLowerCase() === "#p") switchTab("p");
</script>
