ips, plan:vPlan, concepts:vConcepts})[view]();\n}\n\n/* ---------- home ---------- */\nfunction vHome(){\n  const L = latest(); const ids = Object.keys(L);\n  const nonOff = BANK.filter(q => !q.official);\n  const correct = ids.filter(id => L[id].c).length;\n  const wrongN = Object.keys(DB.wrong).filter(id => QBYID[id]).length;\n  let known = 0; GLOSS.forEach(g => { if(DB.vk[g.en.toLowerCase()] === 1) known++; });\n  const pr = recentAttempts(50, [\"practice\"]); const hintRate = pr.length ? pct(pr.filter(a => a.h).length, pr.length) : null;\n  const prl = pr.filter(a => \"lk\" in a); const lkAvg = prl.length ? (prl.reduce((s, a) => s + a.lk, 0) / prl.length).toFixed(1) : null;\n  const tm = recentAttempts(50, [\"practice\",\"exam\",\"wrong\"]); const avg = tm.length ? tm.reduce((s,a) => s+a.ms, 0)/tm.length : null;\n  const today = ymd(new Date());\n  const dExam = DB.examDate ? dayDiff(today, DB.examDate) : null;\n  let h = `\u003ch2>總覽\u003c/h2>`;\n  h += `\u003cdiv class=\"grid\">\n    \u003cdiv class=\"card stat\">\u003cb>${dExam === null ? \"未設定\" : (dExam >= 0 ? dExam+\" 天\" : \"已考完\")}\u003c/b>\u003cspan>距考試日（在「讀書計畫」設定）\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${ids.length} / ${BANK.length}\u003c/b>\u003cspan>做過的題目\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${ids.length ? pct(correct, ids.length)+\"%\" : \"—\"}\u003c/b>\u003cspan>最近一次作答正確率\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${hintRate === null ? \"—\" : hintRate+\"%\"}\u003c/b>\u003cspan>練習時「看中文」比例（目標 \u003c 20%）\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${lkAvg === null ? \"—\" : lkAvg + \" 個\"}\u003c/b>\u003cspan>練習時每題平均查幾個字（點字，不算看中文）\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${avg === null ? \"—\" : Math.round(avg/1000)+\" 秒\"}\u003c/b>\u003cspan>平均每題用時（目標 ≤ ${Math.round(TARGET_SEC)} 秒）\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${wrongN}\u003c/b>\u003cspan>錯題本題數\u003c/span>\u003c/div>\n    \u003cdiv class=\"card stat\">\u003cb>${known} / ${GLOSS.size}\u003c/b>\u003cspan>單字已認識\u003c/span>\u003c/div>\n  \u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">各 Domain 掌握度（每題取最近一次作答）\u003c/h3>\u003ctable>\u003ctr>\u003cth>Domain\u003c/th>\u003cth>比重\u003c/th>\u003cth>做過\u003c/th>\u003cth style=\"width:38%\">正確率\u003c/th>\u003c/tr>`;\n  for(const d in DOMAINS){\n    const pool = BANK.filter(q => String(q.domain) === d); const done = pool.filter(q => L[q.id]); const ok = done.filter(q => L[q.id].c).length; const p = pct(ok, done.length);\n    h += `\u003ctr>\u003ctd>D${d} ${esc(DOMAINS[d].zh)}\u003cdiv class=\"small muted\">${esc(DOMAINS[d].en)}\u003c/div>\u003c/td>\u003ctd>${DOMAINS[d].w}%\u003c/td>\u003ctd>${done.length}/${pool.length}\u003c/td>\u003ctd>${done.length ? `\u003cdiv class=\"bar ${p>=75?'ok':p\u003c60?'bad':''}\">\u003ci style=\"width:${p}%\">\u003c/i>\u003c/div>\u003cspan class=\"small\">${p}%\u003c/span>` : '\u003cspan class=\"small muted\">還沒做\u003c/span>'}\u003c/td>\u003c/tr>`;\n  }\n  h += `\u003c/table>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">各情境掌握度（正式考試從 6 個情境抽 4 個）\u003c/h3>\u003ctable>\u003ctr>\u003cth>情境\u003c/th>\u003cth>做過\u003c/th>\u003cth style=\"width:38%\">正確率\u003c/th>\u003c/tr>`;\n  for(const s of SCENARIOS){\n    const pool = BANK.filter(q => String(q.scenario) === String(s.id)); const done = pool.filter(q => L[q.id]); const ok = done.filter(q => L[q.id].c).length; const p = pct(ok, done.length);\n    h += `\u003ctr>\u003ctd>${esc(s.id)}. ${esc(s.zh)}\u003cdiv class=\"small muted\">${esc(s.en)}\u003c/div>\u003c/td>\u003ctd>${done.length}/${pool.length}\u003c/td>\u003ctd>${done.length ? `\u003cdiv class=\"bar ${p>=75?'ok':p\u003c60?'bad':''}\">\u003ci style=\"width:${p}%\">\u003c/i>\u003c/div>\u003cspan class=\"small\">${p}%\u003c/span>` : '\u003cspan class=\"small muted\">還沒做\u003c/span>'}\u003c/td>\u003c/tr>`;\n  }\n  h += `\u003c/table>\u003c/div>`;\n  if(DB.exams.length){\n    h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">模擬考紀錄\u003c/h3>\u003ctable>\u003ctr>\u003cth>時間\u003c/th>\u003cth>卷別\u003c/th>\u003cth>分數\u003c/th>\u003cth>用時\u003c/th>\u003c/tr>`;\n    DB.exams.slice(-8).reverse().forEach(x => { h += `\u003ctr>\u003ctd>${new Date(x.t).toLocaleString()}\u003c/td>\u003ctd>${esc(x.kind)}\u003c/td>\u003ctd>\u003cb>${x.pct}%\u003c/b>（${x.correct}/${x.n}）\u003c/td>\u003ctd>${fmt(x.usedMs)}\u003c/td>\u003c/tr>`; });\n    h += `\u003c/table>\u003c/div>`;\n  }\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">怎麼用這個網站\u003c/h3>\n  \u003col>\n    \u003cli>\u003cb>學習（中英對照）\u003c/b>：英文題目下面直接附中文，選項也有中文。先建立「這類題目在問什麼」的感覺。\u003c/li>\n    \u003cli>\u003cb>練習（英文直讀）\u003c/b>：只顯示英文；卡住才按「看中文翻譯」（會被記錄）。目標是把看中文比例壓到 20% 以下。\u003c/li>\n    \u003cli>\u003cb>模擬考\u003c/b>：60 題／120 分鐘，跟正式考試一樣從 6 個官方情境抽 4 個、每個情境 15 題；每個情境先看一頁情境說明（Scenario）再作答。全英文、不給任何提示，交卷才看解答。\u003c/li>\n    \u003cli>\u003cb>情境\u003c/b>：每一題都屬於 6 個官方情境之一，題目常直接用情境裡的工具名（例如 get_customer）。學習、練習時題目上方有「Scenario」那一列，可以展開情境說明。\u003c/li>\n    \u003cli>\u003cb>逐字翻譯、拆句\u003c/b>：題目和選項的每個英文字都能看「這一題裡」的中文和詞性（\u003cspan class=\"gw vk\" data-en=\"example\" data-zh=\"範例〔名詞〕\">虛線底線\u003c/span>＝單字卡裡的字）；「拆句」把每句切成小塊、標出主幹（誰＋做什麼），最後一行白話。學習模式：字\u003cb>滑過或點一下\u003c/b>就出中文、拆句隨便看，都不記錄。練習模式（還沒送出答案時）：字要\u003cb>點\u003c/b>才出中文，記為「查字」（不算看中文）；按「拆句」會算看中文。送出答案後全部開放。模擬考作答中都沒有（正式考試沒有）。選答案請點選項左邊的字母圈或按 1–5（點到字會變成查字）。\u003cb class=\"q\">紫色字\u003c/b>是題目限定詞（BEST、FIRST、MOST…），決定你要選哪一種答案。\u003c/li>\n    \u003cli>答錯會自動進\u003cb>錯題本\u003c/b>；單字在\u003cb>單字卡\u003c/b>裡標「認識／不熟」。紀錄存在這台電腦的瀏覽器裡（換電腦或清瀏覽器資料就會不見）。\u003c/li>\n  \u003c/ol>\n  \u003cp class=\"small muted\">題庫 ${BANK.length} 題（含官方範例 ${BANK.filter(q=>q.official).length} 題）。${esc(BUILD_INFO.note || \"\")}\u003c/p>\u003c/div>`;\n  app.innerHTML = h;\n}\n\n/* ---------- practice / learn / wrong ---------- */\nconst SESS = {learn:null, practice:null, wrong:null};\nconst SETUP = {learn:{d:\"all\", t:\"all\", s:\"all\", fresh:false, n:\"10\"}, practice:{d:\"all\", t:\"all\", s:\"all\", fresh:true, n:\"20\"}, wrong:{}};\nfunction filterPool(st){\n  return BANK.filter(q => (st.d === \"all\" || (st.d === \"off\" ? q.official : String(q.domain) === st.d)) && (st.t === \"all\" || q.task === st.t) && (!st.s || st.s === \"all\" || String(q.scenario) === st.s) && (!st.fresh || !DB.att[q.id]) && (st.incRes || (q.set !== \"C\" && q.set !== \"D\")));\n}\nfunction vPractice(mode){\n  const S = SESS[mode];\n  if(!S) return vSetup(mode);\n  if(S.i >= S.list.length) return vSummary(mode);\n  const q = QBYID[S.list[S.i]];\n  if(!S.perm) { S.perm = shuffle(q.options_en.map((_,i) => i)); S.picked = []; S.answered = false; S.hint = false; S.zh = false; S.lk = {}; if(mode !== \"learn\") S.split = false; S.t0 = Date.now(); }\n  const head = `\u003cdiv class=\"row\" style=\"margin-bottom:10px\">\u003ch2 style=\"margin:0\">${mode===\"learn\"?\"學習（中英對照）\":mode===\"practice\"?\"練習（英文直讀）\":\"錯題重練\"}\u003c/h2>\n    \u003cspan class=\"muted small\" style=\"margin-left:auto\">第 ${S.i+1} / ${S.list.length} 題 · 答對 ${S.right} · 答錯 ${S.wrong}${mode!==\"learn\" ? \" · 看中文 \"+S.hints+\" 次 · 查字 \u003cspan id=\\\"lkn\\\">\"+((S.lkTotal||0)+Object.keys(S.lk||{}).length)+\"\u003c/span> 個\" : \"\"}\u003c/span>\n    \u003cbutton class=\"ghost small\" data-act=\"quit\">結束這輪\u003c/button>\u003c/div>`;\n  app.innerHTML = head + cardHTML(q, {mode, perm:S.perm, picked:S.picked, answered:S.answered, showZh: mode===\"learn\" || S.zh, split: !!S.split, timer:true});\n  startQTimer(mode);\n}\nfunction vSetup(mode){\n  let h = \"\";\n  if(mode === \"wrong\"){\n    const ids = Object.keys(DB.wrong).filter(id => QBYID[id]).sort();\n    h += `\u003ch2>錯題本\u003c/h2>\u003cdiv class=\"card\">\u003cp>答錯過的題目都在這裡。重練時答對就會移出錯題本（也可以手動移出）。\u003c/p>\n      \u003cdiv class=\"row\">\u003cbutton class=\"pri\" data-act=\"start\" ${ids.length?\"\":\"disabled\"}>重練全部錯題（${ids.length} 題，隨機順序）\u003c/button>\u003c/div>\u003c/div>`;\n    if(ids.length){\n      h += `\u003cdiv class=\"card\">\u003ctable>\u003ctr>\u003cth>題號\u003c/th>\u003cth>情境 · Domain / Task\u003c/th>\u003cth>錯幾次\u003c/th>\u003cth>題目開頭\u003c/th>\u003cth>\u003c/th>\u003c/tr>`;\n      ids.forEach(id => { const q = QBYID[id]; h += `\u003ctr>\u003ctd>${esc(id)}\u003c/td>\u003ctd>S${esc(q.scenario)} · D${q.domain} · ${esc(q.task)}\u003c/td>\u003ctd>${DB.wrong[id]}\u003c/td>\u003ctd class=\"small\">${esc(q.stem_en.slice(0,90))}…\u003c/td>\u003ctd>\u003cbutton class=\"ghost small\" data-act=\"unwrong\" data-id=\"${esc(id)}\">移出\u003c/button>\u003c/td>\u003c/tr>`; });\n      h += `\u003c/table>\u003c/div>`;\n    }\n    app.innerHTML = h; return;\n  }\n  const st = SETUP[mode];\n  const pool = filterPool(st);\n  const tasks = Object.keys(TASKS).filter(t => st.d === \"all\" || t.startsWith(st.d + \".\"));\n  h += `\u003ch2>${mode===\"learn\"?\"學習（中英對照）\":\"練習（英文直讀）\"}\u003c/h2>`;\n  h += `\u003cdiv class=\"card\">\u003cp class=\"muted\" style=\"margin-top:0\">${mode===\"learn\" ? \"題目、選項都附中文翻譯，適合第一輪：先看懂題目在考什麼、學單字。\" : \"只顯示英文。卡住可以按「看中文翻譯」，但會被記錄。每個英文字都可以點來看中文（記為「查字」，不算看中文）；「拆句」算看中文。畫面會顯示每題用時，正式考試平均每題 2 分鐘（另外每個情境要先讀一段情境說明）。\"}\u003c/p>\n    \u003cdiv class=\"row\">\n      \u003clabel>Domain \u003cselect data-set=\"d\">\u003coption value=\"all\">全部\u003c/option>${Object.keys(DOMAINS).map(d => `\u003coption value=\"${d}\" ${st.d===d?\"selected\":\"\"}>D${d} ${esc(DOMAINS[d].zh)}\u003c/option>`).join(\"\")}\u003coption value=\"off\" ${st.d===\"off\"?\"selected\":\"\"}>官方範例（${BANK.filter(q => q.official).length} 題）\u003c/option>\u003c/select>\u003c/label>\n      \u003clabel>Task \u003cselect data-set=\"t\">\u003coption value=\"all\">全部\u003c/option>${st.d===\"off\"?\"\":tasks.map(t => `\u003coption value=\"${t}\" ${st.t===t?\"selected\":\"\"}>${t} ${esc(TASKS[t][1])}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n      \u003clabel>情境 \u003cselect data-set=\"s\">\u003coption value=\"all\">全部\u003c/option>${SCENARIOS.map(s => `\u003coption value=\"${esc(s.id)}\" ${st.s===String(s.id)?\"selected\":\"\"}>${esc(s.id)}. ${esc(s.zh)}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n      \u003clabel>題數 \u003cselect data-set=\"n\">${[\"10\",\"20\",\"40\",\"all\"].map(n => `\u003coption value=\"${n}\" ${st.n===n?\"selected\":\"\"}>${n===\"all\"?\"全部\":n}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n      \u003clabel class=\"ck\">\u003cinput type=\"checkbox\" data-set=\"fresh\" ${st.fresh?\"checked\":\"\"}> 只出沒做過的\u003c/label>\n      \u003clabel class=\"ck\">\u003cinput type=\"checkbox\" data-set=\"incRes\" ${st.incRes?\"checked\":\"\"}> 包含模考 C／D 保留題（會讓模考失準）\u003c/label>\n    \u003c/div>\n    \u003cdiv class=\"row\" style=\"margin-top:12px\">\u003cbutton class=\"pri\" data-act=\"start\" ${pool.length?\"\":\"disabled\"}>開始（符合條件 ${pool.length} 題）\u003c/button>\u003c/div>\u003c/div>`;\n  if(st.t !== \"all\" && TASKS[st.t]) h += `\u003cdiv class=\"card small\">\u003cb>${st.t}\u003c/b> ${esc(TASKS[st.t][0])}\u003cbr>\u003cspan class=\"muted\">${esc(TASKS[st.t][1])}\u003c/span>\u003c/div>`;\n  app.innerHTML = h;\n}\nfunction startSession(mode){\n  let list;\n  if(mode === \"wrong\") list = shuffle(Object.keys(DB.wrong).filter(id => QBYID[id]));\n  else { const st = SETUP[mode]; list = shuffle(filterPool(st).map(q => q.id)); if(st.n !== \"all\") list = list.slice(0, Number(st.n)); }\n  SESS[mode] = {mode, list, i:0, perm:null, picked:[], answered:false, hint:false, t0:Date.now(), right:0, wrong:0, hints:0, ms:0, res:[]};\n  render(); window.scrollTo(0,0);\n}\nfunction vSummary(mode){\n  const S = SESS[mode];\n  const n = S.list.length;\n  let h = `\u003ch2>這一輪結束\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"big\">${pct(S.right, n)}%\u003c/div>\u003cp>答對 ${S.right} / ${n} 題${mode!==\"learn\" ? ` · 看中文 ${S.hints} 次（${pct(S.hints, n)}%） · 查字 ${S.lkTotal||0} 個（每題平均 ${n ? ((S.lkTotal||0)/n).toFixed(1) : 0}）` : \"\"} · 平均每題 ${n ? Math.round(S.ms/n/1000) : 0} 秒\u003c/p>\n    \u003cdiv class=\"row\">\u003cbutton class=\"pri\" data-act=\"again\">再來一輪\u003c/button>${S.wrong && mode!==\"wrong\" ? `\u003cbutton data-act=\"towrong\">去錯題本重練\u003c/button>` : \"\"}\u003c/div>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003ctable>\u003ctr>\u003cth>題號\u003c/th>\u003cth>結果\u003c/th>\u003cth>用時\u003c/th>\u003cth>題目開頭\u003c/th>\u003c/tr>${S.res.map(r => `\u003ctr>\u003ctd>${esc(r.id)}\u003c/td>\u003ctd>${r.c ? '\u003cspan style=\"color:var(--ok)\">✓\u003c/span>' : '\u003cspan style=\"color:var(--bad)\">✗\u003c/span>'}${r.h ? ' \u003cspan class=\"small muted\">看了中文\u003c/span>' : ''}${r.lk ? ' \u003cspan class=\"small muted\">查字 '+r.lk+'\u003c/span>' : ''}\u003c/td>\u003ctd>${Math.round(r.ms/1000)} 秒\u003c/td>\u003ctd class=\"small\">${esc(QBYID[r.id].stem_en.slice(0,80))}…\u003c/td>\u003c/tr>`).join(\"\")}\u003c/table>\u003c/div>`;\n  app.innerHTML = h;\n}\nlet qTimerId = null;\nfunction startQTimer(mode){\n  clearInterval(qTimerId);\n  qTimerId = setInterval(() => {\n    const el = document.getElementById(\"qtimer\"); const S = SESS[mode];\n    if(!el || !S || S.answered || view !== mode){ return; }\n    const ms = Date.now() - S.t0; el.textContent = fmt(ms); el.classList.toggle(\"over\", ms/1000 > TARGET_SEC);\n  }, 500);\n}\n/* 一張題目卡 */\nfunction cardHTML(q, c){\n  const helps = c.mode !== \"exam\";\n  const showAns = !!c.answered;\n  const zhOpen = c.mode === \"learn\" || c.mode === \"review\" || c.showZh;\n  const right = showAns && sameSet(c.picked.map(di => c.perm[di]), q.answer);\n  let h = `\u003cdiv class=\"card qcard\">`;\n  // 模擬考比照正式考試：不顯示 Domain／Task／難度／題號，只顯示要選幾個\n  if(c.mode === \"exam\") h += `\u003cdiv class=\"qmeta\">${q.select > 1 ? `\u003cspan class=\"tag multi\">複選：選 ${q.select} 個\u003c/span>` : '\u003cspan class=\"muted\">單選\u003c/span>'}\u003c/div>`;\n  else h += `\u003cdiv class=\"qmeta\">\u003cspan class=\"tag\">D${q.domain} ${esc(DOMAINS[q.domain].zh)}\u003c/span>\u003cspan>Task ${esc(q.task)}\u003c/span>${q.official ? '\u003cspan class=\"tag off\">官方範例\u003c/span>' : ''}${q.select > 1 ? `\u003cspan class=\"tag multi\">複選：選 ${q.select} 個\u003c/span>` : ''}\u003cspan>${\"★\".repeat(q.difficulty||2)}\u003c/span>\n    ${c.timer && !showAns ? `\u003cspan class=\"sp\">用時 \u003cspan class=\"timer\" id=\"qtimer\">0:00\u003c/span> \u003cspan class=\"muted\">/ 目標 ${fmt(TARGET_SEC*1000)}\u003c/span>\u003c/span>` : `\u003cspan class=\"sp muted\">${esc(q.id)}\u003c/span>`}\u003c/div>`;\n  h += scBox(q, c);\n  h += `\u003cdiv class=\"stem\">${stemHTML(q, helps, showAns)}\u003c/div>`;\n  if(helps){\n    if(zhOpen) h += `\u003cdiv class=\"zh\">${esc(q.stem_zh)}\u003c/div>`;\n    else if(!showAns) h += `\u003cdiv class=\"row\" style=\"margin-top:10px\">\u003cbutton class=\"ghost small\" data-act=\"hint\">看中文翻譯（會記為「用了提示」）\u003c/button>${splitBtn(q, c)}\u003cspan class=\"small muted\">${wordHint(c)}\u003c/span>\u003c/div>`;\n  }\n  h += splitHTML(q, c, helps, zhOpen, showAns);\n  h += `\u003cdiv class=\"opts\">`;\n  c.perm.forEach((oi, di) => {\n    const sel = c.picked.includes(di), isAns = q.answer.includes(oi);\n    let cls = \"opt\"; if(sel) cls += \" sel\"; if(showAns){ cls += \" locked\"; if(isAns) cls += \" ok\"; else if(sel) cls += \" bad\"; }\n    h += `\u003cdiv class=\"${cls}\" data-act=\"pick\" data-k=\"${di}\" role=\"button\" tabindex=\"0\">\u003cspan class=\"lt\">${LET[di]}\u003c/span>\u003cspan class=\"ot\">\u003cspan>${optHTML(q, oi, helps)}\u003c/span>${optSplitHTML(q, oi, c)}`;\n    if(helps && (zhOpen || showAns)) h += `\u003cspan class=\"ozh\">${esc(q.options_zh[oi])}\u003c/span>`;\n    if(showAns && isAns) h += `\u003cspan class=\"why okw\">✓ 正解\u003c/span>`;\n    if(showAns && !isAns && q.why_wrong_zh[oi]) h += `\u003cspan class=\"why\">✗ ${esc(q.why_wrong_zh[oi])}\u003c/span>`;\n    h += `\u003c/span>\u003c/div>`;\n  });\n  h += `\u003c/div>`;\n  if(c.mode !== \"exam\" && !showAns){\n    h += `\u003cdiv class=\"actions\">\u003cbutton class=\"pri\" data-act=\"submit\" ${c.picked.length === q.select ? \"\" : \"disabled\"}>送出答案\u003c/button>\u003cspan class=\"small muted\">鍵盤：\u003ckbd>1\u003c/kbd>–\u003ckbd>5\u003c/kbd> 選、\u003ckbd>Enter\u003c/kbd> 送出／下一題\u003c/span>\u003c/div>`;\n  }\n  if(showAns){\n    h += `\u003cdiv class=\"explain\">`;\n    if(c.mode !== \"review\" || c.picked.length) h += `\u003cdiv class=\"res ${right?\"ok\":\"bad\"}\">${right ? \"答對了 ✓\" : \"答錯了 ✗\"}　\u003cspan class=\"small muted\">正解：${c.perm.map((oi,di) => q.answer.includes(oi) ? LET[di] : \"\").join(\"\")}\u003c/span>\u003c/div>`;\n    else h += `\u003cdiv class=\"res bad\">未作答　\u003cspan class=\"small muted\">正解：${c.perm.map((oi,di) => q.answer.includes(oi) ? LET[di] : \"\").join(\"\")}\u003c/span>\u003c/div>`;\n    h += `\u003cp>${esc(q.explain_zh)}\u003c/p>`;\n    if(q.official_explain_en) h += `\u003cdetails class=\"small\" style=\"margin:-4px 0 10px\">\u003csummary>官方解說原文（Exam Guide）\u003c/summary>\u003cp style=\"margin:6px 0 0\">${esc(q.official_explain_en)}\u003c/p>\u003cp class=\"muted\" style=\"margin:4px 0 0\">原文的 A／B／C／D 是官方的選項順序；本站的選項順序是打亂的。\u003c/p>\u003c/details>`;\n    h += `\u003cdiv class=\"clue-box\">\u003cdiv class=\"small muted\">決定答案的關鍵句（題目裡已用黃底標出）\u003c/div>\u003cdiv>\u003cb>${clueHTML(q)}\u003c/b>\u003c/div>\u003cdiv>${esc(q.key_clue_zh)}\u003c/div>\u003c/div>`;\n    if(q.vocab && q.vocab.length) h += `\u003ch3>這題的單字\u003c/h3>\u003ctable>${q.vocab.map(v => `\u003ctr>\u003ctd style=\"width:45%\">\u003cb>${esc(v.en)}\u003c/b>\u003c/td>\u003ctd>${esc(v.zh)}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/table>`;\n    h += `\u003c/div>`;\n    if(c.mode !== \"review\"){\n      h += `\u003cdiv class=\"actions\">\u003cbutton class=\"pri\" data-act=\"next\">下一題 →\u003c/button>${DB.wrong[q.id] ? `\u003cbutton class=\"ghost\" data-act=\"unwrong\" data-id=\"${esc(q.id)}\">移出錯題本\u003c/button>` : `\u003cbutton class=\"ghost\" data-act=\"addwrong\" data-id=\"${esc(q.id)}\">加入錯題本\u003c/button>`}\u003c/div>`;\n    }\n  }\n  return h + `\u003c/div>`;\n}\nfunction sameSet(a, b){ if(a.length !== b.length) return false; const s = new Set(a); return b.every(x => s.has(x)); }\nfunction pickOption(arr, di, sel){\n  const k = arr.indexOf(di);\n  if(sel === 1) return [di];\n  if(k >= 0) { arr.splice(k,1); return arr; }\n  if(arr.length \u003c sel) arr.push(di);\n  return arr;\n}\n\n/* ---------- click handling ---------- */\napp.addEventListener(\"click\", e => {\n  const v = e.target.closest(\".v,.gw\");\n  if(v){ noteLookup(v); showTip(v); if(v.closest(\".opt\")) return; }\n  const t = e.target.closest(\"[data-act]\"); if(!t) return;\n  const act = t.dataset.act;\n  if(act === \"sctoggle\"){ const m = t.dataset.m; DB.scOpen = Object.assign({}, DB.scOpen); DB.scOpen[m] = !scOpen(m); save(); render(); return; }\n  // practice-like modes\n  if([\"learn\",\"practice\",\"wrong\"].includes(view)){\n    const mode = view, S = SESS[mode];\n    if(act === \"start\") return startSession(mode);\n    if(act === \"quit\"){ SESS[mode] = null; return render(); }\n    if(act === \"again\"){ SESS[mode] = null; return render(); }\n    if(act === \"towrong\"){ SESS.wrong = null; return go(\"wrong\"); }\n    if(act === \"unwrong\"){ delete DB.wrong[t.dataset.id]; save(); return render(); }\n    if(act === \"addwrong\"){ DB.wrong[t.dataset.id] = (DB.wrong[t.dataset.id]||0) + 1; save(); return render(); }\n    if(!S) return;\n    const q = QBYID[S.list[S.i]];\n    if(act === \"hint\"){ S.hint = true; S.zh = true; return render(); }\n    if(act === \"split\"){ if(lookupCounted()) S.hint = true; S.split = !S.split; return render(); }\n    if(act === \"pick\" && !S.answered){ S.picked = pickOption(S.picked, Number(t.dataset.k), q.select); return render(); }\n    if(act === \"submit\" && !S.answered && S.picked.length === q.select) return submitPractice(mode);\n    if(act === \"next\"){ S.i++; S.perm = null; render(); window.scrollTo(0,0); return; }\n  }\n  if(view === \"exam\") return examClick(act, t);\n  if(view === \"vocab\") return vocabClick(act, t);\n  if(view === \"plan\") return planClick(act, t);\n  if(view === \"concepts\") return conceptsClick(act, t);\n});\napp.addEventListener(\"change\", e => {\n  const t = e.target;\n  if(t.dataset.set && SETUP[view]){ const st = SETUP[view]; const k = t.dataset.set; st[k] = t.type === \"checkbox\" ? t.checked : t.value; if(k === \"d\") st.t = \"all\"; render(); }\n  if(view === \"plan\") planChange(t);\n  if(view === \"concepts\") conceptsChange(t);\n  if(view === \"vocab\" && t.dataset.vf){ VS.filter = t.value; VS.i = 0; VS.flip = false; VS.order = null; render(); }\n});\napp.addEventListener(\"input\", e => { if(view === \"vocab\" && e.target.id === \"vq\"){ VS.q = e.target.value; const pos = e.target.selectionStart; render(); const el = $(\"#vq\"); if(el){ el.focus(); el.setSelectionRange(pos,pos); } } });\nfunction submitPractice(mode){\n  const S = SESS[mode]; const q = QBYID[S.list[S.i]];\n  const ok = sameSet(S.picked.map(di => S.perm[di]), q.answer);\n  const ms = Date.now() - S.t0;\n  S.answered = true; S.ms += ms; if(ok) S.right++; else S.wrong++; if(S.hint) S.hints++;\n  const lk = Object.keys(S.lk || {}).length; S.lkTotal = (S.lkTotal || 0) + lk;\n  S.res.push({id:q.id, c:ok, ms, h:S.hint, lk});\n  record(q, ok, ms, S.hint, mode, lk);\n  if(mode === \"wrong\" && ok) { delete DB.wrong[q.id]; save(); }\n  render();\n}\ndocument.addEventListener(\"keydown\", e => {\n  if(e.target.matches && e.target.matches(\"input,select,textarea\")) return;\n  if([\"learn\",\"practice\",\"wrong\"].includes(view)){\n    const S = SESS[view]; if(!S || S.i >= S.list.length) return; const q = QBYID[S.list[S.i]];\n    const n = Number(e.key);\n    if(!S.answered && n >= 1 && n \u003c= q.options_en.length){ S.picked = pickOption(S.picked, n-1, q.select); render(); }\n    else if(e.key === \"Enter\"){ e.preventDefault(); if(!S.answered && S.picked.length === q.select) submitPractice(view); else if(S.answered){ S.i++; S.perm = null; render(); window.scrollTo(0,0); } }\n  } else if(view === \"exam\" && E && !E.done){\n    if(E.intro !== null){ if(e.key === \"Enter\" || e.key === \"ArrowRight\"){ e.preventDefault(); examStartBlock(); } else if(e.key === \"ArrowLeft\"){ examGoto(E.blocks[E.intro].from - 1); } return; }\n    const q = QBYID[E.list[E.i]]; const n = Number(e.key);\n    if(n >= 1 && n \u003c= q.options_en.length){ E.picks[q.id] = pickOption(E.picks[q.id] || [], n-1, q.select); render(); }\n    else if(e.key === \"ArrowRight\"){ examGoto(E.i+1); } else if(e.key === \"ArrowLeft\"){ examGoto(E.i-1); }\n  } else if(view === \"vocab\" && VS.mode === \"card\"){\n    if(e.key === \" \" ){ e.preventDefault(); VS.flip = !VS.flip; render(); }\n    else if(e.key === \"ArrowRight\"){ vocabMark(1); } else if(e.key === \"ArrowLeft\"){ vocabMark(0); }\n  }\n});\n\n/* ---------- exam ---------- */\n// CCAR-F 正式考試：60 題／120 分鐘；從 6 個官方情境隨機抽 4 個，每個情境先出情境說明、再出該情境的題。\n// 卷別：A／B／C／D＝固定卷（題目的 set 欄位，由題庫線組好：每卷 4 個情境 × 15 題，加新題不會改變卷的組成）；C、D 是保留卷，學習／練習預設不出。\n//       R60＝隨機模考：從練習池（不含 C／D、不含官方範例）抽 4 個情境、每個 15 題，依 Domain 比重挑題；R15＝迷你：1 個情境 15 題／30 分鐘。\nconst SC_PER = 4, Q_PER_SC = 15;\nconst EXAM_NAME = {A:\"模考 A\", B:\"模考 B\", C:\"模考 C\", D:\"模考 D\", R60:\"隨機 60 題\", R15:\"迷你 15 題\"};\nlet E = null, eTimer = null;\nfunction examPoolByScen(){ const p = {}; BANK.filter(q => !q.official && q.set !== \"C\" && q.set !== \"D\" && SCBYID[String(q.scenario)]).forEach(q => (p[q.scenario] = p[q.scenario] || []).push(q.id)); for(const s in p) p[s].sort(); return p; }\n// 依 Domain 比重挑題：輪流替每個情境挑一題，每次挑「目前離比重最遠的 Domain」的題（同分時取亂數順序的第一題）\nfunction pickByDomain(by, scs, per, rnd){\n  const total = scs.length * per, target = {}, cnt = {}, out = {}, rem = {};\n  for(const d in DOMAINS) target[d] = DOMAINS[d].w * total / 100;\n  scs.forEach(s => { out[s] = []; rem[s] = shuffle(by[s] || [], rnd); });\n  for(let k = 0; k \u003c per; k++) for(const s of scs){\n    const r = rem[s]; if(!r.length) continue;\n    let bi = 0, bv = -Infinity;\n    r.forEach((id, i) => { const d = QBYID[id].domain, v = (target[d] || 0) - (cnt[d] || 0); if(v > bv){ bv = v; bi = i; } });\n    const id = r.splice(bi, 1)[0], d = QBYID[id].domain; out[s].push(id); cnt[d] = (cnt[d] || 0) + 1;\n  }\n  return out;\n}\n// 回傳 {list:[題號…（同一個情境的題排在一起）], blocks:[{sc, from, n}]}；題目不夠組卷時 list 是空的\nfunction buildExam(kind, rnd){\n  rnd = rnd || Math.random;\n  let groups;\n  if([\"A\",\"B\",\"C\",\"D\"].includes(kind)){\n    const by = {}; BANK.filter(q => q.set === kind).forEach(q => (by[q.scenario] = by[q.scenario] || []).push(q.id));\n    groups = shuffle(Object.keys(by).sort(), rnd).map(s => [s, shuffle(by[s].sort(), rnd)]);\n  } else {\n    const nSc = kind === \"R15\" ? 1 : SC_PER, by = examPoolByScen();\n    const okS = Object.keys(by).filter(s => by[s].length >= Q_PER_SC).sort();\n    if(okS.length \u003c nSc) return {list:[], blocks:[]};\n    const scs = shuffle(okS, rnd).slice(0, nSc), out = pickByDomain(by, scs, Q_PER_SC, rnd);\n    groups = scs.map(s => [s, shuffle(out[s], rnd)]);\n  }\n  const list = [], blocks = [];\n  groups.forEach(([s, ids]) => { blocks.push({sc:Number(s), from:list.length, n:ids.length}); list.push(...ids); });\n  return {list, blocks};\n}\nfunction setSize(kind){ return BANK.filter(q => q.set === kind).length; }\nfunction seenCount(kind){ return BANK.filter(q => q.set === kind && DB.att[q.id]).length; }\nfunction randomReady(nSc){ const by = examPoolByScen(); return Object.keys(by).filter(s => by[s].length >= Q_PER_SC).length >= nSc; }\nfunction startExam(kind){\n  const X = buildExam(kind);\n  if(!X.list.length){ alert(\"這一卷的題目還沒放進來。\"); return; }\n  const mins = kind === \"R15\" ? 30 : 120;\n  E = {kind:EXAM_NAME[kind], code:kind, list:X.list, blocks:X.blocks, i:0, intro:0, seenIntro:{}, picks:{}, flags:{}, perm:{}, spent:{}, start:Date.now(), dur:mins*60000, qT0:Date.now(), done:false, rev:0};\n  X.list.forEach(id => { E.perm[id] = shuffle(QBYID[id].options_en.map((_,i) => i)); });\n  clearInterval(eTimer); eTimer = setInterval(examTick, 1000);\n  render(); window.scrollTo(0,0);\n}\nfunction examTick(){\n  if(!E || E.done){ clearInterval(eTimer); return; }\n  const left = E.start + E.dur - Date.now();\n  const el = document.getElementById(\"etimer\"); if(el){ el.textContent = fmt(left); el.classList.toggle(\"over\", left \u003c 10*60000); }\n  if(left \u003c= 0){ alert(\"時間到，自動交卷。\"); submitExam(); }\n}\nfunction blockOf(i){ let b = 0; E.blocks.forEach((x, k) => { if(i >= x.from) b = k; }); return b; }\n// 作答時間記在題目上（情境說明頁的時間不算進任何一題）\nfunction examClock(){ if(E.intro === null){ const id = E.list[E.i]; E.spent[id] = (E.spent[id]||0) + (Date.now() - E.qT0); } E.qT0 = Date.now(); }\n// 跳到第 i 題；進入一個還沒看過說明的情境時，先出那個情境的說明頁\nfunction examGoto(i){\n  if(!E || i \u003c 0 || i >= E.list.length) return;\n  examClock();\n  const b = blockOf(i);\n  E.i = i; E.intro = E.blocks[b].from === i && !E.seenIntro[b] ? b : null;\n  render(); window.scrollTo(0,0);\n}\nfunction examShowIntro(b){ if(!E.blocks[b]) return; examClock(); E.intro = b; E.i = E.blocks[b].from; render(); window.scrollTo(0,0); }\nfunction examStartBlock(){ const b = E.intro; E.seenIntro[b] = true; E.i = E.blocks[b].from; E.intro = null; E.qT0 = Date.now(); render(); window.scrollTo(0,0); }\nfunction submitExam(){\n  examClock();\n  E.done = true; E.intro = null; E.usedMs = Math.min(E.dur, Date.now() - E.start); clearInterval(eTimer);\n  let correct = 0; const per = {}, perS = {};\n  E.res = {};\n  E.list.forEach(id => {\n    const q = QBYID[id]; const pk = E.picks[id] || []; const ok = pk.length === q.select && sameSet(pk.map(di => E.perm[id][di]), q.answer);\n    E.res[id] = ok; if(ok) correct++;\n    per[q.domain] = per[q.domain] || [0,0]; per[q.domain][1]++; if(ok) per[q.domain][0]++;\n    perS[q.scenario] = perS[q.scenario] || [0,0]; perS[q.scenario][1]++; if(ok) perS[q.scenario][0]++;\n    record(q, ok, E.spent[id] || 0, false, \"exam\");\n  });\n  E.correct = correct; E.per = per; E.perS = perS;\n  DB.exams.push({t:Date.now(), kind:E.kind, code:E.code, n:E.list.length, correct, pct:pct(correct, E.list.length), per, perS, usedMs:E.usedMs}); save();\n  E.view = \"result\"; render(); window.scrollTo(0,0);\n}\nwindow.addEventListener(\"beforeunload\", e => { if(E && !E.done){ e.preventDefault(); e.returnValue = \"\"; } });\nfunction vExam(){\n  if(!E) return vExamSetup();\n  if(!E.done) return E.intro !== null ? vExamIntro() : vExamRun();\n  if(E.view === \"review\") return vExamReview();\n  return vExamResult();\n}\nfunction vExamSetup(){\n  const fixed = [\"A\",\"B\",\"C\",\"D\"].map(k => [k, setSize(k)]);\n  const r60 = randomReady(SC_PER), r15 = randomReady(1);\n  const pool = examPoolByScen(), total = Object.values(pool).reduce((s,a) => s+a.length, 0);\n  let h = `\u003ch2>模擬考\u003c/h2>\u003cdiv class=\"card\">\u003cp style=\"margin-top:0\">跟正式考試一樣：\u003cb>60 題／120 分鐘，從 6 個官方情境抽 4 個、每個情境 15 題\u003c/b>；每個情境開頭先出一頁情境說明（Scenario），再出該情境的題。全英文、沒有中文、沒有逐字翻譯和拆句、沒有紫色提示，也不顯示 Domain／task；可以標記題目、隨時跳題；交卷後才看解答和各 Domain 分數。單選題要選對才算分，複選題要全部選對。\u003c/p>\n  \u003cdiv class=\"row\">\n    ${fixed.map(([k, n]) => `\u003cbutton class=\"pri\" data-act=\"ex\" data-k=\"${k}\" ${n ? \"\" : \"disabled\"}>模考 ${k}${k === \"C\" || k === \"D\" ? \"（保留卷）\" : \"\"}${n ? `（${n} 題／120 分鐘）` : \"（還沒放進來）\"}\u003c/button>`).join(\"\\n    \")}\n    \u003cbutton data-act=\"ex\" data-k=\"R60\" ${r60 ? \"\" : \"disabled\"}>隨機 60 題（4 個情境，依官方比重抽）\u003c/button>\n    \u003cbutton data-act=\"ex\" data-k=\"R15\" ${r15 ? \"\" : \"disabled\"}>迷你：1 個情境 15 題／30 分鐘\u003c/button>\n  \u003c/div>\n  \u003cp class=\"small muted\">各卷題目互不重疊，每卷 4 個情境 × 15 題，各 Domain 題數大致照官方比重（D1 27%、D2 18%、D3 20%、D4 20%、D5 15%）。\u003cb>C、D 是保留卷：學習、練習時不會出\u003c/b>，留到最後一週量真實程度。隨機模考只從練習池抽（不含 C、D 和官方範例），目前練習池 ${total} 題${r60 ? \"\" : `；要有 4 個情境各至少 ${Q_PER_SC} 題才能抽`}。中途重新整理頁面會讓這次模考作廢。\u003c/p>`;\n  const have = fixed.filter(([, n]) => n);\n  if(have.length) h += `\u003cp class=\"small\">${have.map(([k, n]) => `模考 ${k} 已做過 \u003cb>${seenCount(k)}\u003c/b>／${n} 題`).join(\"、\")}。\u003cspan class=\"muted\">做過的題目越多，分數越會偏高（記得答案），要判斷「準備好了沒」時，優先用沒做過的卷。\u003c/span>\u003c/p>`;\n  h += `\u003c/div>`;\n  if(DB.exams.length){\n    h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">歷次成績\u003c/h3>\u003ctable>\u003ctr>\u003cth>時間\u003c/th>\u003cth>卷別\u003c/th>\u003cth>分數\u003c/th>\u003cth>用時\u003c/th>${Object.keys(DOMAINS).map(d => `\u003cth>D${d}\u003c/th>`).join(\"\")}\u003c/tr>`;\n    DB.exams.slice().reverse().forEach(x => { h += `\u003ctr>\u003ctd class=\"small\">${new Date(x.t).toLocaleString()}\u003c/td>\u003ctd>${esc(x.kind)}\u003c/td>\u003ctd>\u003cb>${x.pct}%\u003c/b>\u003c/td>\u003ctd>${fmt(x.usedMs)}\u003c/td>${Object.keys(DOMAINS).map(d => `\u003ctd class=\"small\">${x.per[d] ? pct(x.per[d][0], x.per[d][1])+\"%\" : \"—\"}\u003c/td>`).join(\"\")}\u003c/tr>`; });\n    h += `\u003c/table>\u003c/div>`;\n  }\n  app.innerHTML = h;\n}\n// 題目導覽：依情境分組；res＝交卷後（綠＝對、紅＝錯）\nfunction examNav(res){\n  return `\u003cdiv class=\"navgrid\">` + E.blocks.map((b, k) => `\u003cdiv class=\"sch\">情境 ${k + 1}／${E.blocks.length}：${esc(scName(b.sc))}${res ? \"\" : ` \u003cbutton class=\"ghost\" data-act=\"scintro\" data-b=\"${k}\">情境說明\u003c/button>`}\u003c/div>`\n    + E.list.slice(b.from, b.from + b.n).map((x, j) => { const i = b.from + j;\n      if(res) return `\u003cbutton data-act=\"rev\" data-i=\"${i}\" class=\"${E.res[x] ? \"r-ok\" : \"r-bad\"}\">${i+1}\u003c/button>`;\n      return `\u003cbutton data-act=\"goto\" data-i=\"${i}\" class=\"${(E.picks[x]||[]).length === QBYID[x].select ? \"ans\" : \"\"} ${E.flags[x] ? \"flag\" : \"\"} ${i === E.i && E.intro === null ? \"cur\" : \"\"}\">${i+1}\u003c/button>`; }).join(\"\")).join(\"\") + `\u003c/div>`;\n}\nfunction examBar(){\n  const answered = E.list.filter(x => (E.picks[x]||[]).length === QBYID[x].select).length;\n  const id = E.list[E.i], intro = E.intro !== null;\n  return `\u003cdiv class=\"ebar\">\u003cspan class=\"timer\" id=\"etimer\">${fmt(E.start + E.dur - Date.now())}\u003c/span>\u003cspan class=\"muted small\">剩餘\u003c/span>\n    \u003cspan style=\"margin-left:auto\" class=\"small\">${intro ? `情境 ${E.intro + 1} / ${E.blocks.length}` : `第 ${E.i+1} / ${E.list.length} 題`} · 已答 ${answered}\u003c/span>\n    ${intro ? `\u003cbutton data-act=\"prev\" ${E.blocks[E.intro].from ? \"\" : \"disabled\"}>← 上一題\u003c/button>\u003cbutton class=\"pri\" data-act=\"scstart\">開始作答 →\u003c/button>`\n      : `\u003cbutton data-act=\"flag\">${E.flags[id] ? \"取消標記\" : \"標記\"}\u003c/button>\u003cbutton data-act=\"prev\" ${E.i ? \"\" : \"disabled\"}>← 上一題\u003c/button>\u003cbutton data-act=\"nxt\" ${E.i \u003c E.list.length-1 ? \"\" : \"disabled\"}>下一題 →\u003c/button>`}\n    \u003cbutton class=\"${intro ? \"\" : \"pri\"}\" data-act=\"submitexam\">交卷\u003c/button>\u003c/div>`;\n}\n// 情境說明頁（比照正式考試：先讀情境，再做這個情境的題；只有英文）\nfunction vExamIntro(){\n  const b = E.blocks[E.intro], s = SCBYID[String(b.sc)] || {en:\"\", desc_en:\"\"};\n  let h = examBar();\n  h += `\u003cdiv class=\"card\" id=\"scintro\">\u003cdiv class=\"small muted\">Scenario ${E.intro + 1} of ${E.blocks.length} · Questions ${b.from + 1}–${b.from + b.n}\u003c/div>\u003ch2 style=\"margin:6px 0 10px\">${esc(s.en)}\u003c/h2>\u003cdiv class=\"scintro\">${esc(s.desc_en)}\u003c/div>\n    \u003cp class=\"small muted\" style=\"margin-top:14px\">接下來 ${b.n} 題都在這個情境裡；作答時題目上方可以再展開這段說明。按「開始作答」或 Enter。\u003c/p>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003cdiv class=\"small muted\">題目導覽（藍底＝已答、橘線＝已標記）\u003c/div>${examNav(false)}\u003c/div>`;\n  app.innerHTML = h;\n}\nfunction vExamRun(){\n  const id = E.list[E.i], q = QBYID[id];\n  let h = examBar();\n  h += cardHTML(q, {mode:\"exam\", perm:E.perm[id], picked:E.picks[id] || [], answered:false});\n  h += `\u003cdiv class=\"card\">\u003cdiv class=\"small muted\">題目導覽（藍底＝已答、橘線＝已標記）\u003c/div>${examNav(false)}\u003c/div>`;\n  app.innerHTML = h;\n}\nfunction vExamResult(){\n  const n = E.list.length, p = pct(E.correct, n);\n  let h = `\u003ch2>${esc(E.kind)}：成績\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"big\" style=\"color:${p>=75?\"var(--ok)\":p>=60?\"var(--warn)\":\"var(--bad)\"}\">${p}%\u003c/div>\n    \u003cp>答對 ${E.correct} / ${n} 題 · 用時 ${fmt(E.usedMs)}（限時 ${fmt(E.dur)}）· 平均每題 ${Math.round(E.usedMs/n/1000)} 秒\u003c/p>\n    \u003cp class=\"small muted\">官方是 100–1,000 的換算分數、720 分及格，沒有公布答對幾題等於幾分，所以這裡只顯示答對比例。自己設的上場標準可以抓「兩回模考都穩定 75–80% 以上、而且時間有剩」。\u003c/p>\n    \u003cdiv class=\"row\">\u003cbutton class=\"pri\" data-act=\"rev\" data-i=\"0\">逐題看解答\u003c/button>\u003cbutton data-act=\"newexam\">回模擬考首頁\u003c/button>\u003c/div>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">各 Domain\u003c/h3>\u003ctable>${Object.keys(DOMAINS).map(d => { const x = E.per[d]; if(!x) return \"\"; const pp = pct(x[0], x[1]); return `\u003ctr>\u003ctd>D${d} ${esc(DOMAINS[d].zh)}\u003c/td>\u003ctd>${x[0]}/${x[1]}\u003c/td>\u003ctd style=\"width:40%\">\u003cdiv class=\"bar ${pp>=75?\"ok\":pp\u003c60?\"bad\":\"\"}\">\u003ci style=\"width:${pp}%\">\u003c/i>\u003c/div>\u003c/td>\u003ctd>${pp}%\u003c/td>\u003c/tr>`; }).join(\"\")}\u003c/table>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">各情境\u003c/h3>\u003ctable>${E.blocks.map(b => { const x = E.perS[b.sc]; if(!x) return \"\"; const pp = pct(x[0], x[1]); return `\u003ctr>\u003ctd>Scenario ${esc(b.sc)}: ${esc(scName(b.sc))}\u003cdiv class=\"small muted\">${esc((SCBYID[String(b.sc)] || {}).zh || \"\")}\u003c/div>\u003c/td>\u003ctd>${x[0]}/${x[1]}\u003c/td>\u003ctd style=\"width:40%\">\u003cdiv class=\"bar ${pp>=75?\"ok\":pp\u003c60?\"bad\":\"\"}\">\u003ci style=\"width:${pp}%\">\u003c/i>\u003c/div>\u003c/td>\u003ctd>${pp}%\u003c/td>\u003c/tr>`; }).join(\"\")}\u003c/table>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003cdiv class=\"small muted\">點題號看解答（綠＝對、紅＝錯）\u003c/div>${examNav(true)}\u003c/div>`;\n  app.innerHTML = h;\n}\nfunction vExamReview(){\n  const id = E.list[E.rev], q = QBYID[id];\n  let h = `\u003cdiv class=\"row\" style=\"margin-bottom:10px\">\u003ch2 style=\"margin:0\">${esc(E.kind)}：第 ${E.rev+1} / ${E.list.length} 題解答\u003c/h2>\n    \u003cspan style=\"margin-left:auto\">\u003c/span>\u003cbutton data-act=\"rprev\" ${E.rev ? \"\" : \"disabled\"}>← 上一題\u003c/button>\u003cbutton data-act=\"rnext\" ${E.rev \u003c E.list.length-1 ? \"\" : \"disabled\"}>下一題 →\u003c/button>\u003cbutton data-act=\"rwrongnext\">下一個錯題 →\u003c/button>\u003cbutton class=\"ghost\" data-act=\"result\">回成績\u003c/button>\u003c/div>`;\n  h += cardHTML(q, {mode:\"review\", perm:E.perm[id], picked:E.picks[id] || [], answered:true, split: !!(E.split && E.split[id])});\n  app.innerHTML = h;\n}\nfunction examClick(act, t){\n  if(act === \"ex\") return startExam(t.dataset.k);\n  if(!E) return;\n  const id = E.list[E.i], q = QBYID[id];\n  if(!E.done){\n    if(act === \"scstart\" && E.intro !== null) return examStartBlock();\n    if(act === \"scintro\") return examShowIntro(Number(t.dataset.b));\n    if(act === \"prev\") return examGoto(E.intro !== null ? E.blocks[E.intro].from - 1 : E.i - 1);\n    if(act === \"goto\") return examGoto(Number(t.dataset.i));\n    if(act === \"submitexam\"){\n      const un = E.list.filter(x => (E.picks[x]||[]).length !== QBYID[x].select).length; const fl = E.list.filter(x => E.flags[x]).length;\n      if(confirm(`確定交卷？\\n未完成作答：${un} 題\\n標記中：${fl} 題`)) submitExam();\n      return;\n    }\n    if(E.intro !== null) return;\n    if(act === \"pick\"){ E.picks[id] = pickOption(E.picks[id] || [], Number(t.dataset.k), q.select); return render(); }\n    if(act === \"flag\"){ E.flags[id] = !E.flags[id]; return render(); }\n    if(act === \"nxt\") return examGoto(E.i + 1);\n    return;\n  }\n  if(act === \"split\" && E.view === \"review\"){ const rid = E.list[E.rev]; E.split = E.split || {}; E.split[rid] = !E.split[rid]; render(); return; }\n  if(act === \"rev\"){ E.view = \"review\"; E.rev = Number(t.dataset.i); render(); window.scrollTo(0,0); return; }\n  if(act === \"rprev\"){ E.rev = Math.max(0, E.rev-1); render(); window.scrollTo(0,0); return; }\n  if(act === \"rnext\"){ E.rev = Math.min(E.list.length-1, E.rev+1); render(); window.scrollTo(0,0); return; }\n  if(act === \"rwrongnext\"){ for(let k = E.rev+1; k \u003c E.list.length; k++) if(!E.res[E.list[k]]){ E.rev = k; render(); window.scrollTo(0,0); return; } alert(\"後面沒有錯題了。\"); return; }\n  if(act === \"result\"){ E.view = \"result\"; render(); return; }\n  if(act === \"newexam\"){ E = null; render(); return; }\n}\n/* ---------- vocab ---------- */\nlet VS = {mode:\"card\", filter:\"todo\", i:0, flip:false, q:\"\", order:null};\nfunction vocabList(){\n  const arr = [...GLOSS.values()];\n  const f = VS.filter;\n  return arr.filter(g => {\n    const k = g.en.toLowerCase(), s = DB.vk[k];\n    if(f === \"all\") return true;\n    if(f === \"todo\") return s !== 1;\n    if(f === \"weak\") return s === 0;\n    if(f === \"new\") return s === undefined;\n    if(f === \"known\") return s === 1;\n    return g.cat === f;\n  });\n}\nfunction exampleFor(g){\n  for(const id of g.qids){\n    const q = QBYID[id]; if(!q) continue;\n    const texts = [q.stem_en, ...q.options_en];\n    const re = new RegExp(\"(?\u003c![A-Za-z])\" + g.en.replace(/[.*+?^${}()|[\\]\\\\]/g, \"\\\\$&\").replace(/\\s+/g, \"\\\\s+\"), \"i\");\n    for(const t of texts){ const sents = t.split(/(?\u003c=[.?!])\\s+/); const s = sents.find(x => re.test(x)); if(s) return {s, id, zh:q.stem_zh}; }\n  }\n  return null;\n}\nfunction vVocab(){\n  let known = 0, weak = 0; GLOSS.forEach(g => { const s = DB.vk[g.en.toLowerCase()]; if(s === 1) known++; else if(s === 0) weak++; });\n  const cats = Object.entries(CORE_CAT).map(([k, v]) => [k, v]).concat(Object.keys(DOMAINS).map(d => [\"D\"+d, \"D\"+d+\" 題目單字\"]));\n  let h = `\u003ch2>單字卡\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"row\">\n    \u003cbutton class=\"${VS.mode===\"card\"?\"pri\":\"\"}\" data-act=\"vmode\" data-m=\"card\">卡片\u003c/button>\u003cbutton class=\"${VS.mode===\"list\"?\"pri\":\"\"}\" data-act=\"vmode\" data-m=\"list\">清單\u003c/button>\n    \u003clabel>範圍 \u003cselect data-vf=\"1\">${[[\"todo\",\"還不熟＋沒標過\"],[\"weak\",\"標為不熟的\"],[\"new\",\"沒標過的\"],[\"known\",\"已認識的\"],[\"all\",\"全部\"]].concat(cats).map(([k,v]) => `\u003coption value=\"${k}\" ${VS.filter===k?\"selected\":\"\"}>${esc(v)}\u003c/option>`).join(\"\")}\u003c/select>\u003c/label>\n    \u003cspan class=\"small muted\" style=\"margin-left:auto\">共 ${GLOSS.size} · 認識 ${known} · 不熟 ${weak} · 沒標過 ${GLOSS.size-known-weak}\u003c/span>\u003c/div>\u003c/div>`;\n  const list = vocabList();\n  if(VS.mode === \"card\"){\n    if(!VS.order || VS.order.length !== list.length) VS.order = shuffle(list.map(g => g.en.toLowerCase()));\n    if(!list.length){ app.innerHTML = h + `\u003cdiv class=\"card\">這個範圍沒有單字了 🎉 換個範圍看看。\u003c/div>`; return; }\n    if(VS.i >= VS.order.length) VS.i = 0;\n    const g = GLOSS.get(VS.order[VS.i]);\n    const ex = exampleFor(g);\n    h += `\u003cdiv class=\"card fc\">\u003cdiv class=\"small muted\">${VS.i+1} / ${VS.order.length} · ${esc(CORE_CAT[g.cat] || g.cat)}\u003c/div>\u003cdiv class=\"w\">${esc(g.en)}\u003c/div>`;\n    if(VS.flip){\n      h += `\u003cdiv class=\"m\">${esc(g.zh)}\u003c/div>`;\n      if(ex) h += vocabExHTML(ex, g);\n    } else h += `\u003cdiv style=\"margin-top:18px\">\u003cbutton data-act=\"vflip\">翻面看中文（空白鍵）\u003c/button>\u003c/div>`;\n    h += `\u003c/div>\u003cdiv class=\"row\" style=\"justify-content:center\">\u003cbutton data-act=\"vmark\" data-s=\"0\">✗ 不熟（←）\u003c/button>\u003cbutton class=\"pri\" data-act=\"vmark\" data-s=\"1\">✓ 認識（→）\u003c/button>\u003cbutton class=\"ghost\" data-act=\"vskip\">跳過\u003c/button>\u003c/div>`;\n  } else {\n    const qq = VS.q.trim().toLowerCase();\n    const rows = list.filter(g => !qq || g.en.toLowerCase().includes(qq) || g.zh.includes(qq)).sort((a,b) => a.en.localeCompare(b.en));\n    h += `\u003cdiv class=\"card\">\u003cinput type=\"text\" id=\"vq\" placeholder=\"搜尋英文或中文\" value=\"${esc(VS.q)}\" style=\"width:100%;margin-bottom:10px\">\u003ctable>\u003ctr>\u003cth>英文\u003c/th>\u003cth>中文\u003c/th>\u003cth>分類\u003c/th>\u003cth>狀態\u003c/th>\u003c/tr>${rows.map(g => { const k = g.en.toLowerCase(), s = DB.vk[k]; return `\u003ctr>\u003ctd>\u003cb>${esc(g.en)}\u003c/b>\u003c/td>\u003ctd>${esc(g.zh)}\u003c/td>\u003ctd class=\"small muted\">${esc(CORE_CAT[g.cat] || g.cat)}\u003c/td>\u003ctd>\u003cbutton class=\"ghost small\" data-act=\"vset\" data-k=\"${esc(k)}\" data-s=\"${s===1?\"0\":\"1\"}\">${s===1?\"✓ 認識\":s===0?\"✗ 不熟\":\"未標\"}\u003c/button>\u003c/td>\u003c/tr>`; }).join(\"\")}\u003c/table>\u003c/div>`;\n  }\n  app.innerHTML = h;\n}\nfunction vocabMark(s){ const k = VS.order && VS.order[VS.i]; if(!k) return; DB.vk[k] = s; save(); VS.flip = false; const list = vocabList(); if(list.length !== VS.order.length){ VS.order = VS.order.filter(x => list.some(g => g.en.toLowerCase() === x)); } else VS.i++; render(); }\nfunction vocabClick(act, t){\n  if(act === \"vmode\"){ VS.mode = t.dataset.m; return render(); }\n  if(act === \"vflip\"){ VS.flip = !VS.flip; return render(); }\n  if(act === \"vsplit\"){ VS.split = !VS.split; return render(); }\n  if(act === \"vmark\") return vocabMark(Number(t.dataset.s));\n  if(act === \"vskip\"){ VS.i++; VS.flip = false; return render(); }\n  if(act === \"vset\"){ DB.vk[t.dataset.k] = Number(t.dataset.s); save(); return render(); }\n}\n\n/* ---------- tips ---------- */\n// 常見問句句型＝資料常數 TIP_PATS（[英文例句, 中文, 解題方向]，例句取自官方 Exam Guide 的範例題）；逐字翻譯用 QGLOSS[\"T:\u003c英文例句>\"]\nfunction vTips(){\n  let h = `\u003ch2>英文讀題技巧\u003c/h2>`;\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">五步讀題法（每題約 2 分鐘）\u003c/h3>\u003col>\n    \u003cli>\u003cb>先讀情境說明（每個情境只讀一次）\u003c/b>：記住「在做什麼系統、有哪些工具（例如 get_customer、process_refund）、目標是什麼（例如首次解決率 80%）」。接下來那一組題都在這個背景裡，題幹會直接用這些名字。\u003c/li>\n    \u003cli>\u003cb>讀最後一句（問句）\u003c/b>：抓出限定詞 \u003cb class=\"q\">most effective / FIRST / BEST / most likely / Choose TWO\u003c/b>，決定你要找「最有效的」「第一步」還是「最可能的原因」。\u003c/li>\n    \u003cli>\u003cb>回頭掃題幹，只找「限制條件和症狀」\u003c/b>：百分比（in 12% of cases、55% vs. the 80% target）、紀錄（logs）顯示什麼、\u003ci>only\u003c/i>、\u003ci>must\u003c/i>、\u003ci>while\u003c/i>、\u003ci>without\u003c/i>、「什麼沒有變」。背景故事看過就好，不用每個字都懂。\u003c/li>\n    \u003cli>\u003cb>每個選項只問一句\u003c/b>：「它有沒有直接解決題目講的那個根本原因？」沒有就刪。官方範例題解說裡出現過的錯法：一定要做到的事只靠提示詞要求（應該用程式強制）、題目沒要求卻加分類器或新架構（過度設計）、靠模型自己回報信心、怪罪照指示做事的下游元件、把錯誤吞掉或標成成功、給代理太多工具、引用不存在的旗標或功能、以為換更大的 context window 就能解決注意力分散。\u003c/li>\n    \u003cli>\u003cb>卡超過 2.5 分鐘就標記跳過\u003c/b>，最後再回來。不要讓一題吃掉兩題的時間。\u003c/li>\n  \u003c/ol>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">看不懂單字時\u003c/h3>\u003cul>\n    \u003cli>先判斷是\u003cb>好事還是壞事\u003c/b>就夠了：\u003ci>reduce / ensure / improve / reliable\u003c/i> 是好事；\u003ci>skips / misidentified / times out / degrade / false positive\u003c/i> 是壞事。\u003c/li>\n    \u003cli>字尾猜詞性：\u003ci>-tion / -ment / -ity\u003c/i> 是名詞、\u003ci>-ize / -ate\u003c/i> 是動詞、\u003ci>-ive / -able / -ous\u003c/i> 是形容詞、\u003ci>-ly\u003c/i> 是副詞。\u003c/li>\n    \u003cli>技術詞你本來就會（API、JSON、MCP、CI/CD、hook），英文差的部分通常是\u003cb>連接詞和限定詞\u003c/b>——這些在單字卡「題目限定詞與常用字」那一類，先背這一類。\u003c/li>\n  \u003c/ul>\u003c/div>`;\n  h += `\u003cdiv class=\"card pat\">\u003ch3 style=\"margin-top:0\">常見問句句型（取自官方範例題）\u003c/h3>\u003cp class=\"small muted\" style=\"margin:0 0 6px\">英文例句的每個字都可以滑過或點一下看中文。\u003c/p>\u003ctable>\u003ctr>\u003cth>英文\u003c/th>\u003cth>中文\u003c/th>\u003cth>解題方向\u003c/th>\u003c/tr>${TIP_PATS.map(p => `\u003ctr>\u003ctd>${tipHTML(p[0])}\u003c/td>\u003ctd>${esc(p[1])}\u003c/td>\u003ctd class=\"small\">${esc(p[2])}\u003c/td>\u003c/tr>`).join(\"\")}\u003c/table>\u003c/div>`;\n  h += `\u003cdiv class=\"card\">\u003ch3 style=\"margin-top:0\">考場規則（官方 Exam Guide v1.0）\u003c/h3>\u003cul>\n    \u003cli>60 題、120 分鐘；單選＋複選，每題會寫要選幾個。\u003c/li>\n    \u003cli>從 6 個情境隨機抽 4 個，每個情境底下有一組題目。\u003c/li>\n    \u003cli>換算分數 100–1,000，\u003cb>720 分及格\u003c/b>；成績單會列各 Domain 答對百分比。\u003c/li>\n    \u003cli>Pearson VUE 監考（線上或考場）；報名費 125 美元，證照有效 12 個月。\u003c/li>\n    \u003cli>沒過要等 14 天才能重考（第二次沒過等 30 天、第三次等 90 天），12 個月內最多考 4 次，每次都要付報名費。\u003c/li>\n    \u003cli>可以改期或取消到考前 24 小時；24 小時內才改會沒收報名費。\u003c/li>\n  \u003c/ul>\u003c/div>`;\n  app.innerHTML = h;\n}\n/* ---------- plan ---------- */\n// 讀書計畫＝一串有先後順序的單元：先上官方課程（照官方真實章節；每章上完只做「這一章對到的考點」的練習池題）→ 課程上完才英文直讀練習 → 最後模考。\n// 打勾的單元固定在完成那天；沒做的單元從今天起依「每日可用時間」重排，提早完成會自動往前移、落後會列出排不進去的單元。\n// 規則：單元絕對不超過當天可用時間（0 分鐘＝那種日子不排）；章節太長才切成幾部分，課後題放在最後一部分。\n// 2026-11-13 v3：①章節來自官方課程（COURSE_CH，mkplan.py 由 chapters.json 填入；還沒抓到的課沿用「依分鐘切段」）\n//               ②課後題只出「本章考點」且所有考點都已上過的練習池題（不含 C/D），解決「上第 1 段卻考整個 D1、D2」的超綱\n//               ③計畫頁加「5 門課 ↔ 7 個 Domain」對照表；每個單元連到精譯版對應章節；網址 #concept=ID、#ch=章 可直接開考點／課後題\n// 2026-11-15 版面精簡：計畫頁是唯一入口。每個單元只留一行（打勾＋名稱＋分鐘＋「① 讀這章」「② 課後題」），\n//               每格重複的說明併成一個預設收合的「說明」，對照表也預設收合；精譯版在同一個分頁開，\n//               網址 #plan 直接開計畫頁（精譯版的「回讀書計畫」、按上一頁都回到這裡）\n// COURSE：[{n:門號, name, zh, min:官方分鐘, doms:[主要 Domain], also:[也會碰到的 Domain]}]；空的＝課程線還沒交（計畫只排練習＋模考）\nconst COURSE = [{\"n\":1,\"name\":\"AI Fluency: Framework & Foundations\",\"zh\":\"AI 協作素養：框架與基礎\",\"min\":62,\"doms\":[3,4],\"also\":[1]},{\"n\":2,\"name\":\"Building with the Claude API\",\"zh\":\"用 Claude API 開發\",\"min\":452,\"doms\":[1,2,4],\"also\":[3,5]},{\"n\":3,\"name\":\"Claude on Google Cloud\",\"zh\":\"在 Google Cloud 上使用 Claude\",\"min\":63,\"doms\":[1,4],\"also\":[2,3,5]},{\"n\":4,\"name\":\"Claude Code in Action\",\"zh\":\"Claude Code 實戰\",\"min\":53,\"doms\":[1,3],\"also\":[4,5]},{\"n\":5,\"name\":\"Claude 101\",\"zh\":\"Claude 入門\",\"min\":108,\"doms\":[1,3],\"also\":[2,4,5]},{\"n\":6,\"name\":\"Claude with Amazon Bedrock\",\"zh\":\"在 Amazon Bedrock 上使用 Claude\",\"min\":65,\"doms\":[1,2,4],\"also\":[3,5]},{\"n\":7,\"name\":\"Introduction to Model Context Protocol\",\"zh\":\"Model Context Protocol（MCP）入門\",\"min\":63,\"doms\":[1,2],\"also\":[]}];\n// 各門課的官方章節：{門號:[{id:\"c1-01\", name, zh, min, minSrc, concepts:[考點 id…]}]}；空的＝還沒交\nconst COURSE_CH = window.__EXAM.COURSE_CH;\n\nconst ZH_PAGE = \"ccar-f-course-zh.html\";\nconst CH_Q_MAX = 10;      // 一章課後題最多出幾題\nconst READ_FACTOR = 1.5; // 英文閱讀較慢：課程實際花費抓官方標示時數的 1.5 倍（讀精譯版也先用同一個倍數）\nconst PLAN_START = \"2026-11-16\";\n// 沒設定考試日：先以今天起 4 週計算（頁面會標明）\nfunction planDefaultExam(today){ const d = new Date(today + \"T00:00:00\"); d.setDate(d.getDate() + 28); return ymd(d); }\nconst MOCK_MIN = 120;     // 模考作答必須一次連續做完\n// 單元列的小按鈕：網站的樣式表在計畫段外面（上線只准改計畫段）⇒ 用 inline style\nconst PBTN = \"font-size:13px;padding:3px 10px;border-radius:7px;line-height:1.5\";\nfunction planCaps(){\n  const num = (v, d) => { const n = Number(v); return v === undefined || v === null || v === \"\" || Number.isNaN(n) ? d : Math.max(0, Math.min(600, n)); };\n  return {wd:num(DB.capWd, 120), we:num(DB.capWe, 180)};\n}\n// 某一章的課後題池：練習池（不含 C/D）裡，主要考點屬於這一章、而且題目標的每個考點都已經在「這一章或之前的章」上過\nfunction chapterPool(chId){\n  const cov = new Set(); let target = null;\n  for(const c of COURSE){\n    for(const ch of (COURSE_CH[c.n] || [])){\n      (ch.concepts || []).forEach(x => cov.add(x));\n      if(ch.id === chId){ target = ch; break; }\n    }\n    if(target) break;\n  }\n  if(!target) return [];\n  const own = new Set(target.concepts || []);\n  return BANK.filter(q => q.set !== \"C\" && q.set !== \"D\" && (q.concepts || []).length && own.has(q.concepts[0]) && q.concepts.every(x => cov.has(x))).map(q => q.id);\n}\nfunction findChapter(chId){\n  for(const c of COURSE){ const chs = COURSE_CH[c.n] || []; const i = chs.findIndex(ch => ch.id === chId); if(i >= 0) return {c, ch:chs[i], i}; }\n  return null;\n}\n// 開始某一章的課後題（學習模式、中英對照）；沒做過的題優先\nfunction startChapterSession(chId){\n  const pool = chapterPool(chId);\n  if(!pool.length) return false;\n  const list = shuffle(pool.filter(id => !DB.att[id])).concat(shuffle(pool.filter(id => DB.att[id]))).slice(0, CH_Q_MAX);\n  SESS.learn = {mode:\"learn\", list, i:0, perm:null, picked:[], answered:false, hint:false, t0:Date.now(), right:0, wrong:0, hints:0, ms:0, res:[], chapter:chId};\n  view = \"learn\";\n  return true;\n}\nfunction planUnits(){\n  const caps = planCaps();\n  const pos = [caps.wd, caps.we].filter(c => c > 0);\n  // 一個學習單元的目標長度：配合「比較少的那種日子」的時間，介於 30～55 分鐘\n  const target = pos.length ? Math.max(30, Math.min(55, Math.min(...pos))) : 55;\n  const qMin = target >= 45 ? 15 : 10;           // 每段課後做題的時間（上限）\n  const chunk = target - qMin;                   // 每段課程的時間\n  const u = [];\n  COURSE.forEach(c => {\n    const chs = COURSE_CH[c.n] || [];\n    if(chs.length){\n      chs.forEach((ch, ci) => {\n        if(!(ch.concepts || []).length && !DB.planOpt) return;   // 選讀：沒有對到任何考點的章（導論、平台設定…）預設不排；計畫頁可勾選排進來\n        const total = Math.max(5, Math.round(ch.min * READ_FACTOR));\n        const nq = Math.min(CH_Q_MAX, chapterPool(ch.id).length);\n        const qm = nq ? Math.min(qMin, Math.max(5, Math.ceil(nq * 1.5))) : 0;\n        const k = Math.max(1, Math.ceil(total / (target - qm)));   // 太長才切；每部分（含最後一段的課後題）都 ≤ target\n        const per = Math.ceil(total / k);\n        for(let i = 1; i \u003c= k; i++){\n          const last = i === k;\n          // 每個單元畫面上只有一行；「課後題怎麼出、切段怎麼接」的說明在計畫頁的「說明」裡講一次\n          u.push({id:`ch:${ch.id}${k > 1 ? \"-p\" + i : \"\"}`, kind:\"course\", course:c.n, ch:ch.id, last, nq:last ? nq : 0, part:i, parts:k, read:per, min:per + (last ? qm : 0),\n            title:`第 ${c.n} 門第 ${ci + 1} 章 ${ch.zh || ch.name}`, en:ch.zh ? ch.name : \"\"});\n        }\n      });\n      return;\n    }\n    // 章節資料還沒抓到：沿用依分鐘切段（沒有課後題按鈕 ⇒ 這一行要自己寫出做哪個 Domain 的題）\n    const total = Math.round(c.min * READ_FACTOR);\n    const k = Math.max(1, Math.ceil(total / chunk));   // 無條件進位：每段一定 ≤ chunk，才放得進時間少的那種日子\n    const per = Math.round(total / k);\n    const dz = c.doms.map(d => \"D\" + d).join(\"、\");\n    for(let i = 1; i \u003c= k; i++){\n      u.push({id:`c${c.n}-${i}`, kind:\"course\", course:c.n, part:i, parts:k, read:per, min:per + qMin,\n        title:`第 ${c.n} 門 ${c.zh || c.name} 第 ${i}／${k} 段`, en:c.zh ? c.name : \"\",\n        then:`② 學習模式 ${qMin >= 15 ? \"5–10\" : \"3–5\"} 題，Domain 只選 ${dz}`});\n    }\n  });\n  // 練習總量約 300 分鐘（120 題）；每回長度配合單元目標\n  const pMin = Math.min(50, target), rounds = Math.ceil(300 / pMin), pq = Math.round(pMin / 2.5);\n  for(let i = 1; i \u003c= rounds; i++){\n    u.push({id:`p${i}`, kind:\"practice\", min:pMin, title:`練習模式 ${pq} 題　第 ${i}／${rounds} 回`});\n  }\n  [[\"C\", \"本站模考 C（保留卷）\"], [\"D\", \"本站模考 D（保留卷）\"], [\"AB\", \"本站模考 A 或 B（挑做過比較少的那卷）\"]].forEach(([k, t], i) => {\n    u.push({id:`m${k}`, kind:\"mock\", mock:k, min:MOCK_MIN, title:t});\n    u.push({id:`r${i + 1}`, kind:\"review\", min:45, title:\"檢討上一回模考\"});\n  });\n  return u;\n}\n// 舊版計畫（依分鐘切段）的打勾，在那門課改成章節之後就對不上了：列出來請他改勾章節\nfunction planLegacy(){\n  const pd = DB.planDone || {};\n  return Object.keys(pd).filter(k => { const m = k.match(/^c(\\d)-(\\d+)$/); return m && (COURSE_CH[m[1]] || []).length; }).map(k => ({id:k, d:pd[k]}));\n}\n// 回傳完成日（YYYY-MM-DD）或 null；模考單元若已有對應卷別的交卷紀錄，視為已完成\nfunction unitDone(u){\n  const pd = DB.planDone || {};\n  if(pd[u.id]) return pd[u.id];\n  if(u.kind === \"mock\"){\n    const names = u.mock === \"AB\" ? [\"模考 A\", \"模考 B\"] : [\"模考 \" + u.mock];\n    const x = DB.exams.find(e => names.includes(e.kind));\n    if(x) return ymd(new Date(x.t));\n  }\n  return null;\n}\nfunction planSchedule(){\n  const today = ymd(new Date());\n  const exam = DB.examDate || planDefaultExam(today);\n  const caps = planCaps();\n  const maxCap = Math.max(caps.wd, caps.we);\n  const units = planUnits();\n  // 計畫從「預設開始日、今天、最早完成日」三者中最早的那天開始顯示：\n  // 提前打勾的單元要出現在打勾那天那一列，不能被塞進第一列（CCAR-P 使用者回報過的 bug）\n  const doneDates = units.map(unitDone).filter(Boolean);\n  const start = [PLAN_START, today, ...doneDates].sort()[0];\n  const days = [];\n  // 考試日比起始日還早（設錯或已經考完）：至少留起始日那一列，不會整張表空掉\n  for(let d = new Date(start + \"T00:00:00\"), e = new Date((exam \u003c start ? start : exam) + \"T00:00:00\"); d \u003c= e; d.setDate(d.getDate() + 1)) days.push(ymd(d));\n  // 考前最後 2 天＋考試日不排新單元；沒設考試日時最後 3 天都是複習\n  const reviewFrom = days[Math.max(0, days.length - 3)];\n  const byDay = {};\n  days.forEach(d => { byDay[d] = {done:[], todo:[], used:0}; });\n  const left = [], tooBig = [];\n  units.forEach(u => {\n    const dd = unitDone(u);\n    if(dd){\n      const k = byDay[dd] ? dd : days[days.length - 1];   // 只有完成日在考試日之後才會走到這裡\n      byDay[k].done.push(u); byDay[k].used += u.min;\n    } else if(u.min > maxCap) tooBig.push(u);     // 任何一天都放不下（例如每天都不到 120 分鐘卻要模考）\n    else left.push(u);\n  });\n  const capOf = d => { const wd = new Date(d + \"T00:00:00\").getDay(); return (wd === 0 || wd === 6 ? caps.we : caps.wd) - byDay[d].used - byDay[d].todo.reduce((s, u) => s + u.min, 0); };\n  const open = days.filter(d => d >= today && d \u003c reviewFrom);\n  // 依順序放，放得下才放；下一個放不下就換下一天（不會為了塞進去而超時）。放進去的排在那天既有單元的前面\n  const fill = (list, ds) => {\n    let i = 0;\n    for(const d of ds){\n      if(i >= list.length) break;\n      let cap = capOf(d); const put = [];\n      while(i \u003c list.length && list[i].min \u003c= cap){ list[i].sched = d; put.push(list[i]); cap -= list[i].min; i++; }\n      byDay[d].todo = put.concat(byDay[d].todo);\n    }\n    return list.slice(i);\n  };\n  let overflow = fill(left, open), mockFirst = false;\n  // 時間不夠、照順序排會把模考擠出考前（2026-11-16：F 有 7 門課，課程一長模考就整個消失）⇒ 改成「模考先排」：\n  // 模考＋檢討從考前往回排（保持先後順序），課程和練習排在第一回模考那天或之前；排不下的是課程／練習，畫面會列出來\n  const isMock = u => u.kind === \"mock\" || u.kind === \"review\";\n  if(overflow.some(isMock)){\n    mockFirst = true;\n    left.forEach(u => { delete u.sched; }); open.forEach(d => { byDay[d].todo = []; });\n    const tail = left.filter(isMock), head = left.filter(u => !isMock(u));\n    let k = tail.length - 1;\n    for(let j = open.length - 1; j >= 0 && k >= 0; j--){\n      const d = open[j]; let cap = capOf(d); const put = [];\n      while(k >= 0 && tail[k].min \u003c= cap){ tail[k].sched = d; put.unshift(tail[k]); cap -= tail[k].min; k--; }\n      byDay[d].todo = put;\n    }\n    const fm = tail.find(u => u.sched);\n    overflow = fill(head, fm ? open.filter(d => d \u003c= fm.sched) : open).concat(tail.filter(u => !u.sched));\n  }\n  return {days, byDay, overflow, mockFirst, tooBig, left, exam, reviewFrom, today, caps, units};\n}\n// 選讀章（沒有對到任何考點）的章數\nfunction planOptN(){ return COURSE.reduce((s, c) => s + (COURSE_CH[c.n] || []).filter(ch => !(ch.concepts || []).length).length, 0); }\nfunction planMapTable(){\n  const nd = Object.keys(DOMAINS).length;\n  let h = `\u003cdetails style=\"margin-top:6px\">\u003csummary class=\"small\">${COURSE.length} 門課 ↔ 考試 ${nd} 個 Domain\u003c/summary>`;\n  if(!COURSE.length) return h + `\u003cp class=\"small muted\" style=\"margin:6px 0 0\">官方課程的資料還沒放進來。\u003c/p>\u003c/details>`;\n  h += `\u003cp class=\"small muted\" style=\"margin:6px 0 8px\">考試配分照 Exam Guide 的 ${nd} 個 Domain；備考課程分成 ${COURSE.length} 門，是兩套不同的分類。對應是依各門課的學習目標與章節內容推的（官方沒有標）。\u003c/p>\n    \u003cdiv style=\"overflow-x:auto\">\u003ctable class=\"plan\">\u003ctr>\u003cth>官方課程\u003c/th>\u003cth>主要 Domain（配分）\u003c/th>\u003cth>也會碰到\u003c/th>\u003cth>章節\u003c/th>\u003c/tr>`;\n  COURSE.forEach(c => {\n    const chs = COURSE_CH[c.n] || [];\n    h += `\u003ctr>\u003ctd>\u003ca style=\"color:var(--accent)\" href=\"${ZH_PAGE}#c${c.n}\" data-act=\"read\">第 ${c.n} 門 ${esc(c.zh || c.name)}\u003c/a>\u003cbr>\u003cspan class=\"small muted\">${esc(c.name)} · 官方 ${c.min} 分鐘\u003c/span>\u003c/td>\n      \u003ctd class=\"small\">${(c.doms || []).filter(d => DOMAINS[d]).map(d => `D${d} ${esc(DOMAINS[d].zh)}（${DOMAINS[d].w}%）`).join(\"\u003cbr>\")}\u003c/td>\n      \u003ctd class=\"small\">${(c.also || []).map(d => \"D\" + d).join(\"、\") || \"—\"}\u003c/td>\n      \u003ctd class=\"small\">${chs.length ? `${chs.length} 章（照官方章節排）` : \"還沒抓到（暫時依分鐘切段）\"}\u003c/td>\u003c/tr>`;\n  });\n  return h + `\u003c/table>\u003c/div>\u003c/details>`;\n}\n// 「說明」：原本散在頁首、每個單元、表格下方的說明，集中在這裡講一次（預設收合）\nfunction planNote(){\n  const legacy = COURSE.filter(c => !(COURSE_CH[c.n] || []).length);\n  const li = [];\n  if(!COURSE.length) li.push(`官方備考課程的資料還沒放進來：目前計畫只有練習和模考。課程放進來之後會自動排在最前面（照官方章節，每章「① 讀這章 ② 課後題」）。`);\n  else li.push(`順序固定：先讀官方課程（\u003ca style=\"color:var(--accent)\" href=\"${ZH_PAGE}\" data-act=\"read\">精譯版\u003c/a>）→ 課程全部讀完才做英文直讀練習 → 最後模考。`,\n    `② 課後題：只出這一章考點的練習題（中英對照、最多 ${CH_Q_MAX} 題，沒做過的先出；不含模考 C／D，不會考到還沒讀的內容）。沒有這種題的章就沒有 ② 按鈕，讀完直接打勾。`,\n    `章節太長會切成前半／後半（或第 1／3 段…），課後題放在最後一段。`);\n  if(planOptN()) li.push(`沒有對到任何考點的章（例如課程導論、雲端平台的設定步驟）是選讀，預設不排（${planOptN()} 章）；想排進來，勾上面的「選讀章節也排進計畫」。`);\n  if(legacy.length) li.push(`第 ${legacy.map(c => c.n).join(\"、\")} 門的章節資料還沒抓到，暫時依分鐘切段：讀完做學習模式，Domain 只選那門課的主要 Domain（會出到還沒讀的內容，當預習、答錯不用在意）。`);\n  li.push(`練習：英文直讀、只出沒做過的；卡住才按「看中文」，做完把錯題重練一次。目標：看中文 \u003c 20%。`,\n    `模考：60 題（4 個情境 × 15 題），一次連續作答 ${MOCK_MIN} 分鐘，中途不要停；交卷後會自動打勾。檢討：逐題看解答＋錯題本重練，分數最低的 Domain 回去重讀對應的那門課（下面的對照表）。`,\n    `排程：每個單元都不會超過當天的可用時間（填 0＝那種日子不排）。打勾的單元留在完成那天，其他單元從今天起自動重排（提早完成就往前移）；空檔的日子有時間可以直接做下一個單元。考前最後 2 天是複習日。沒設定考試日時，先以今天起 4 週計算。時間不夠排完全部單元時，模考和檢討會優先排在考前，排不下的課程／練習列在表格上方。`,\n    `時間是估計：課程抓官方標示的 1.5 倍（讀英文比較慢）；課程單元後面的分鐘是閱讀時間，右欄「預估」是當天合計（含每章做題 5–15 分）；練習一回 25–50 分；模考 ${MOCK_MIN} 分、檢討 45 分。`,\n    `官方備考課程（免費）：Anthropic Partner Academy → Exam prep courses → Claude Certified Architect – Foundations Prep Course${COURSE.length ? `，共 ${COURSE.length} 門，官方標示 ${COURSE.map(c => c.min).join(\"／\")} 分鐘` : \"\"}。`);\n  return `\u003cdetails id=\"plannote\" style=\"margin-top:8px\">\u003csummary class=\"small\">說明\u003c/summary>\u003cul class=\"small\" style=\"margin:6px 0 0;padding-left:20px\">${li.map(x => `\u003cli>${x}\u003c/li>`).join(\"\")}\u003c/ul>\u003c/details>`;\n}\n// 課程單元的「① 讀這章」：切開的章標出讀哪一段（2 段＝前半／後半；3 段以上＝第 i／k 段）\nfunction planReadLabel(u){\n  if(!u.ch) return \"① 讀這段\";\n  if(u.parts \u003c= 1) return \"① 讀這章\";\n  if(u.parts === 2) return u.part === 1 ? \"① 讀這章（前半）\" : \"① 讀這章（後半）\";\n  return `① 讀這章（第 ${u.part}／${u.parts} 段）`;\n}\nfunction vPlan(){\n  const P = planSchedule();\n  const inp = \"font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);width:84px\";\n  let h = `\u003ch2>讀書計畫\u003c/h2>\u003cdiv class=\"card\">\u003cdiv class=\"row\">\n    \u003clabel>我的考試日 \u003cinput type=\"date\" id=\"examdate\" value=\"${esc(DB.examDate)}\" min=\"${PLAN_START}\">\u003c/label>${DB.examDate ? \"\" : `\u003cspan class=\"small muted\">（還沒設定：先以 ${P.exam.slice(5)} 計算）\u003c/span>`}\n    \u003clabel>平日每天 \u003cinput type=\"number\" id=\"capwd\" min=\"0\" max=\"600\" step=\"10\" value=\"${P.caps.wd}\" style=\"${inp}\"> 分鐘\u003c/label>\n    \u003clabel>假日每天 \u003cinput type=\"number\" id=\"capwe\" min=\"0\" max=\"600\" step=\"10\" value=\"${P.caps.we}\" style=\"${inp}\"> 分鐘\u003c/label>${planOptN() ? `\u003clabel class=\"ck small\">\u003cinput type=\"checkbox\" id=\"planopt\" ${DB.planOpt ? \"checked\" : \"\"}> 選讀章節也排進計畫（${planOptN()} 章沒有對到考點）\u003c/label>` : \"\"}\u003c/div>\n    \u003cp id=\"planhow\" style=\"margin:10px 0 0\">\u003cb>每天由上往下：① 讀這章 → ② 做課後題 → 打勾\u003c/b>\u003c/p>\n    ${planNote()}${planMapTable()}\u003c/div>`;\n  const legacy = planLegacy();\n  if(legacy.length && !DB.planLegacyAck){\n    h += `\u003cdiv class=\"card\" style=\"border-color:var(--warn)\">\u003cb>計畫改版了：課程改成照官方章節排\u003c/b>\u003cp class=\"small\" style=\"margin:6px 0\">你在舊版計畫勾過：${legacy.map(x => `${esc(x.id.replace(/^c(\\d)-(\\d+)$/, \"第 $1 門第 $2 段\"))}（${esc(x.d.slice(5))}）`).join(\"、\")}。舊版是用分鐘數硬切的段落，對不到新的章節，所以沒有自動換算。請在下面把你\u003cb>已經上完的章節\u003c/b>重新打勾。\u003c/p>\u003cbutton data-act=\"legacyok\">我知道了\u003c/button>\u003c/div>`;\n  }\n  // 進度一行＋警告各一行，放在表格上面\n  const doneN = P.units.filter(u => unitDone(u)).length;\n  const cLeft = P.left.filter(u => u.kind === \"course\");\n  const sch = P.left.filter(u => u.sched);\n  const allEnd = sch.length ? sch[sch.length - 1].sched : null;\n  const warn = s => `\u003cdiv class=\"small\" style=\"color:var(--bad);margin-top:4px\">⚠ ${s}\u003c/div>`;\n  let st = `\u003cb>已完成 ${doneN} / ${P.units.length} 個單元\u003c/b>`, warns = \"\";\n  if(P.caps.wd === 0 && P.caps.we === 0){\n    warns += warn(\"平日和假日都設成 0 分鐘，排不進任何單元。\");\n  } else {\n    if(P.tooBig.length) warns += warn(`模考要一次連續作答 ${MOCK_MIN} 分鐘，但每天的可用時間都不到 ⇒ ${P.tooBig.length} 回模考排不進去：把假日設到至少 ${MOCK_MIN} 分鐘。`);\n    if(P.overflow.length){\n      const m = P.overflow.reduce((s, u) => s + u.min, 0);\n      warns += warn(`${P.mockFirst ? \"時間不夠：模考和檢討已經優先排在考前；\" : \"\"}還有 \u003cb>${P.overflow.length} 個單元\u003c/b>（約 ${m} 分鐘，從「${esc(P.overflow[0].title)}」起）排不進考前：調高每日時間，或把考試日往後挪。`);\n    } else if(P.left.length){\n      const courseEnd = cLeft.length ? cLeft[cLeft.length - 1].sched : null;\n      const buf = allEnd ? dayDiff(allEnd, P.reviewFrom) - 1 : 0;\n      st += ` · 課程${courseEnd ? `預計 \u003cb>${courseEnd.slice(5)}\u003c/b> 讀完` : \"已全部讀完\"}，全部單元預計 \u003cb>${allEnd.slice(5)}\u003c/b> 做完（複習日前緩衝 ${Math.max(0, buf)} 天）`;\n    } else if(!P.tooBig.length){\n      st += \" · 全部單元都完成了，剩下的天數照複習日的做法就好\";\n    }\n  }\n  h += `\u003cdiv class=\"card\">\u003cdiv class=\"small\" id=\"planstat\">${st}\u003c/div>${warns}\u003ctable class=\"plan\" style=\"margin-top:8px\">\u003ctr>\u003cth style=\"width:96px\">日期\u003c/th>\u003cth>要做的單元（打勾＝完成）\u003c/th>\u003cth style=\"width:64px\">預估\u003c/th>\u003c/tr>`;\n  const pd = DB.planDone || {};\n  // 一個單元一行：打勾＋名稱·分鐘＋必要按鈕（課程：① 讀這章、最後一段且有題才有 ② 課後題）\n  const unitRow = (u, done) => {\n    const auto = u.kind === \"mock\" && !pd[u.id] && !!unitDone(u);\n    let btn = \"\";\n    if(u.kind === \"course\"){\n      btn = `\u003ca class=\"btn\" style=\"${PBTN};text-decoration:none;color:var(--accent)\" href=\"${ZH_PAGE}#${u.ch || \"c\" + u.course}\" data-act=\"read\">${planReadLabel(u)}\u003c/a>`;\n      if(u.last && u.nq) btn += `\u003cbutton style=\"${PBTN}\" data-act=\"chq\" data-ch=\"${esc(u.ch)}\">② 課後題（${u.nq} 題）\u003c/button>`;\n      if(u.then) btn += `\u003cspan class=\"small muted\">${esc(u.then)}\u003c/span>`;\n      btn = `\u003cspan style=\"display:inline-flex;flex-wrap:wrap;align-items:center;gap:4px 6px\">${btn}\u003c/span>`;   // 窄螢幕換行時兩顆按鈕留在同一行\n    }\n    return `\u003cdiv class=\"pu\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:4px 0\">\u003clabel style=\"display:inline-flex;gap:8px;align-items:center\">\u003cinput type=\"checkbox\" data-pu=\"${u.id}\" ${done ? \"checked\" : \"\"} ${auto ? \"disabled\" : \"\"}>\u003cspan${done ? ' class=\"muted\"' : \"\"}>${esc(u.title)} \u003cspan class=\"small muted\">· ${u.read || u.min} 分${auto ? \"（已有交卷紀錄）\" : \"\"}\u003c/span>\u003c/span>\u003c/label>${u.en ? `\u003cspan class=\"small muted\">${esc(u.en)}\u003c/span>` : \"\"}${btn}\u003c/div>`;\n  };\n  P.days.forEach(d => {\n    const wdN = new Date(d + \"T00:00:00\").getDay();\n    const wd = \"日一二三四五六\"[wdN];\n    const isExam = !!DB.examDate && d === P.exam;\n    const isRev = d >= P.reviewFrom && !isExam;\n    const b = P.byDay[d];\n    const cap = wdN === 0 || wdN === 6 ? P.caps.we : P.caps.wd;\n    let cell = \"\";\n    if(isExam) cell = \"考試：睡飽、提早報到。看題先找限定詞與限制條件，超過 2.5 分鐘先標記跳過。\";\n    else if(isRev) cell = \"複習日：只做錯題本＋單字卡「標為不熟的」，不做新題；把讀題技巧頁再讀一遍。\";\n    cell += b.done.map(u => unitRow(u, true)).join(\"\") + b.todo.map(u => unitRow(u, false)).join(\"\");\n    if(!cell) cell = d \u003c P.today ? '\u003cspan class=\"muted\">—\u003c/span>' : (cap === 0 ? '\u003cspan class=\"small muted\">（0 分鐘，不排）\u003c/span>' : '\u003cspan class=\"small muted\">（空檔）\u003c/span>');\n    const mins = b.used + b.todo.reduce((s, u) => s + u.min, 0);\n    h += `\u003ctr class=\"${d === P.today ? \"today\" : \"\"} ${d \u003c P.today ? \"past\" : \"\"} ${isExam ? \"exam\" : \"\"}\">\u003ctd>${d.slice(5)}（${wd}）\u003c/td>\u003ctd>${cell}\u003c/td>\u003ctd class=\"small\">${mins ? mins + \" 分\" : \"\"}${!isExam && !isRev && d >= P.today ? `\u003cbr>\u003cspan class=\"muted\">可用 ${cap}\u003c/span>` : \"\"}\u003c/td>\u003c/tr>`;\n  });\n  h += `\u003c/table>\u003c/div>`;\n  app.innerHTML = h;\n}\nfunction planChange(t){\n  if(t.id === \"examdate\"){ DB.examDate = t.value; save(); render(); return; }\n  if(t.id === \"planopt\"){ DB.planOpt = t.checked; save(); render(); return; }\n  if(t.id === \"capwd\" || t.id === \"capwe\"){\n    const n = Number(t.value);\n    const v = Number.isNaN(n) ? 0 : Math.max(0, Math.min(600, n));\n    if(t.id === \"capwd\") DB.capWd = v; else DB.capWe = v;\n    save(); render(); return;\n  }\n  if(t.dataset.pu){\n    DB.planDone = DB.planDone || {};\n    if(t.checked) DB.planDone[t.dataset.pu] = ymd(new Date()); else delete DB.planDone[t.dataset.pu];\n    save(); render();\n  }\n}\n// 網址直達：#concept=1.1-03 開考點清單並捲到那一張；#ch=c1-03 直接開那一章的課後題（從精譯版點過來）；\n// #plan 開讀書計畫（精譯版的「回讀書計畫」用這個）\nfunction planHash(){\n  const h = decodeURIComponent(location.hash.slice(1));\n  if(h === \"plan\"){ view = \"plan\"; return true; }\n  let m = h.match(/^concept=(.+)$/);\n  if(m && CONCEPTS.some(c => c.id === m[1])){ CS.d = m[1].split(\".\")[0]; CS.weak = false; CS.sort = \"id\"; CS.focus = m[1]; view = \"concepts\"; return true; }\n  m = h.match(/^ch=(c\\d+-\\d+)$/);\n  if(m){ if(!startChapterSession(m[1])) view = \"plan\"; return true; }\n  return false;\n}\nfunction planFocus(){\n  if(!CS.focus || view !== \"concepts\") return;\n  const el = app.querySelector(`.cpt[data-cid=\"${CS.focus}\"]`);\n  if(el){ el.scrollIntoView({block:\"center\"}); el.style.outline = \"3px solid var(--accent)\"; }\n  CS.focus = null;\n}\nplanHash();\nsetTimeout(planFocus, 0);\nwindow.addEventListener(\"hashchange\", () => { if(planHash()){ render(); window.scrollTo(0, 0); planFocus(); } });\nfunction planClick(act, t){\n  // 「① 讀這章」在同一個分頁開精譯版：先把這頁的網址記成 #plan，讀完按上一頁就回到計畫頁（不擋連結本身的跳轉）\n  if(act === \"read\"){ try { history.replaceState(null, \"\", \"#plan\"); } catch(e) {} return; }\n  if(act === \"chq\"){ if(startChapterSession(t.dataset.ch)){ render(); window.scrollTo(0, 0); } return; }\n  if(act === \"legacyok\"){ DB.planLegacyAck = true; save(); render(); }\n}\n/* ---------- plan end ---------- */\n\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n", "names": ["BANK", "CONCEPTS", "SCENARIOS", "TASKS", "CORE_VOCAB", "TIP_PATS", "QGLOSS", "COURSE_CH"], "zhPage": "ccar-f-course-zh.html"}, "p": {"html": "\u003c!doctype html>\n\u003chtml lang=\"zh-Hant\">\n\u003chead>\n\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n\u003ctitle>CCAR-P 模擬考\u003c/title>\n\u003cstyle>\n:root{\n  --bg:#f6f6f3; --fg:#1d1d1f; --muted:#6b6b72; --card:#ffffff; --line:#e2e2de;\n  --accent:#2a63d4; --accent-weak:#e7eefc; --ok:#17804a; --ok-weak:#e2f4e9;\n  --bad:#c23a3a; --bad-weak:#fbe8e8; --mark:#fff0a8; --qual:#7b3fd0; --warn:#b26a00;\n  --qfs:18px;\n}\n@media (prefers-color-scheme: dark){\n  :root:not([data-theme=\"light\"]){\n    --bg:#131316; --fg:#ececef; --muted:#9a9aa3; --card:#1c1c21; --line:#2f2f37;\n    --accent:#76a2ff; --accent-weak:#1d2944; --ok:#52c68d; --ok-weak:#15301f;\n    --bad:#ff8080; --bad-weak:#3a1d1d; --mark:#5b4b0c; --qual:#c9a6ff; --warn:#f0b050;\n  }\n}\n:root[data-theme=\"dark\"]{\n  --bg:#131316; --fg:#ececef; --muted:#9a9aa3; --card:#1c1c21; --line:#2f2f37;\n  --accent:#76a2ff; --accent-weak:#1d2944; --ok:#52c68d; --ok-weak:#15301f;\n  --bad:#ff8080; --bad-weak:#3a1d1d; --mark:#5b4b0c; --qual:#c9a6ff; --warn:#f0b050;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0;background:var(--bg);color:var(--fg)}\nbody{font:15px/1.6 system-ui,-apple-system,\"Segoe UI\",\"Noto Sans TC\",\"Microsoft JhengHei\",sans-serif}\nheader{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}\n.hwrap{max-width:980px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px}\n.brand{font-weight:700;letter-spacing:.2px;margin-right:auto}\n.brand small{font-weight:400;color:var(--muted);margin-left:6px}\n.fs button{min-width:34px}\nnav{max-width:980px;margin:0 auto;padding:6px 16px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}\nnav button{border:0;background:none;color:var(--muted);padding:8px 10px;border-bottom:2px solid transparent;border-radius:0;white-space:nowrap;cursor:pointer;font:inherit}\nnav button.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:600}\nmain{max-width:980px;margin:0 auto;padding:16px}\nh2{font-size:20px;margin:4px 0 12px}\nh3{font-size:16px;margin:18px 0 8px}\n.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}\n.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}\n.stat b{display:block;font-size:24px;line-height:1.2}\n.stat span{color:var(--muted);font-size:13px}\nbutton,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);padding:8px 14px;border-radius:8px}\nbutton.pri{background:var(--accent);border-color:var(--accent);color:#fff}\nbutton.ghost{background:none}\nbutton:disabled{opacity:.45;cursor:not-allowed}\n.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}\n.muted{color:var(--muted)}\n.small{font-size:13px}\nselect,input[type=text],input[type=date]{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}\nlabel.ck{display:inline-flex;gap:6px;align-items:center}\n.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}\n.bar i{display:block;height:100%;background:var(--accent)}\n.bar.ok i{background:var(--ok)}\n.bar.bad i{background:var(--bad)}\ntable{border-collapse:collapse;width:100%}\ntd,th{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}\nth{font-size:13px;color:var(--muted);font-weight:600}\n.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:999px;background:var(--accent-weak);color:var(--accent)}\n.tag.multi{background:var(--bad-weak);color:var(--bad)}\n.tag.off{background:var(--ok-weak);color:var(--ok)}\n/* question */\n.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}\n.qmeta .sp{margin-left:auto}\n.stem{font-size:var(--qfs);line-height:1.75}\n.zh{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--accent-weak);border-radius:0 8px 8px 0;font-size:calc(var(--qfs) - 2px)}\n.opts{display:flex;flex-direction:column;gap:8px;margin-top:14px}\n.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card);font-size:calc(var(--qfs) - 1px);line-height:1.6;user-select:text}\n.opt:hover{border-color:var(--accent)}\n.opt.sel{border-color:var(--accent);background:var(--accent-weak)}\n.opt.ok{border-color:var(--ok);background:var(--ok-weak)}\n.opt.bad{border-color:var(--bad);background:var(--bad-weak)}\n.opt.locked{cursor:default}\n.opt .lt{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;margin-top:1px}\n.opt.sel .lt{background:var(--accent);color:#fff;border-color:var(--accent)}\n.opt.ok .lt{background:var(--ok);color:#fff;border-color:var(--ok)}\n.opt.bad .lt{background:var(--bad);color:#fff;border-color:var(--bad)}\n.opt .ot{display:flex;flex-direction:column;gap:3px}\n.ozh{color:var(--muted);font-size:calc(var(--qfs) - 3px)}\n.why{font-size:14px;color:var(--bad)}\n.why.okw{color:var(--ok);font-weight:600}\n.v{text-decoration:underline dotted var(--muted);text-underline-offset:4px;cursor:help}\n.v.hit{background:var(--mark)}\nb.q{color:var(--qual)}\nmark.clue{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}\n.explain{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px}\n.res{font-weight:700;font-size:17px}\n.res.ok{color:var(--ok)} .res.bad{color:var(--bad)}\n.clue-box{margin:10px 0;padding:10px 12px;border-radius:8px;background:var(--mark)}\n.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}\n.timer{font-variant-numeric:tabular-nums;font-weight:600}\n.timer.over{color:var(--bad)}\n.tip{position:fixed;z-index:20;max-width:280px;background:var(--fg);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:14px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.2)}\n/* exam */\n.ebar{position:sticky;top:86px;z-index:4;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--bg);padding:8px 0;margin-bottom:8px;border-bottom:1px solid var(--line)}\n.ebar .timer{font-size:20px}\n.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:5px;margin-top:8px}\n.navgrid button{padding:5px 0;font-size:13px;border-radius:6px}\n.navgrid button.ans{background:var(--accent-weak);border-color:var(--accent)}\n.navgrid button.flag{box-shadow:inset 0 -3px 0 var(--warn)}\n.navgrid button.cur{outline:2px solid var(--fg)}\n.navgrid button.r-ok{background:var(--ok-weak);border-color:var(--ok)}\n.navgrid button.r-bad{background:var(--bad-weak);border-color:var(--bad)}\n.big{font-size:40px;font-weight:800;line-height:1.1}\n/* vocab */\n.fc{text-align:center;padding:34px 16px}\n.fc .w{font-size:32px;font-weight:700}\n.fc .m{font-size:22px;margin-top:10px}\n.fc .ex{margin-top:16px;text-align:left;font-size:16px;line-height:1.7}\n.pat td:first-child{font-family:ui-monospace,Consolas,monospace;font-size:14px}\n.plan td{font-size:14px}\n.plan tr.today td{background:var(--accent-weak)}\n.plan tr.past td{color:var(--muted)}\n.plan tr.exam td{background:var(--ok-weak);font-weight:600}\nkbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:12px}\n@media (max-width:600px){\n  .ebar{top:84px}\n  .big{font-size:32px}\n  .hwrap .fs{display:none}\n}\n/* 逐字翻譯＋拆句（2026-11-13） */\n.gw{cursor:pointer;border-radius:3px}\n.gw:hover{background:var(--accent-weak)}\n.gw.vk{text-decoration:underline dotted var(--muted);text-underline-offset:4px}\n.gw.hit{background:var(--mark)}\n.gw.lk{box-shadow:inset 0 -2px 0 var(--warn)}\n.gq mark.clue{padding:0;border-radius:0}\n.gsplit{margin-top:12px;padding:10px 12px;border:1px dashed var(--accent);border-radius:10px;background:var(--card);cursor:default}\n.gsplit-o{margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);cursor:default}\n.gsent{margin:8px 0 14px}\n.gcks{display:flex;flex-wrap:wrap;gap:6px}\n.gck{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;padding:4px 8px;max-width:100%}\n.gck.core{border-color:var(--accent);background:var(--accent-weak)}\n.gce{font-size:calc(var(--qfs) - 2px);line-height:1.4}\n.gcz{font-size:14px;line-height:1.4}\n.gcr{font-size:12px;color:var(--muted)}\n.gck.core .gcr{color:var(--accent);font-weight:600}\n.gline{font-size:14px;margin-top:6px}\n.gask{margin-top:6px;padding:8px 10px;border-radius:8px;background:var(--mark);font-size:14px}\n\u003c/style>\n\u003cstyle>\n@media (max-width:900px){nav{flex-wrap:wrap;overflow-x:visible}nav button{padding:6px 8px}}\n@media (max-width:600px){.hwrap .fs{display:flex}.hwrap .fs button{padding:4px 8px}}\n.ebar{top:var(--zr-hdr,86px)!important}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cheader>\n  \u003cdiv class=\"hwrap\">\n    \u003cdiv class=\"brand\">CCAR-P 模擬考 \u003csmall>Claude Certified Architect – Professional\u003c/small>\u003c/div>\n    \u003cdiv class=\"row fs\">\u003cspan class=\"small muted\">字級\u003c/span>\u003cbutton data-fs=\"-1\">A−\u003c/button>\u003cbutton data-fs=\"1\">A＋\u003c/button>\u003cbutton id=\"theme\">深/淺\u003c/button>\u003c/div>\n  \u003c/div>\n  \u003cnav id=\"nav\">\n    \u003cbutton data-v=\"home\">首頁\u003c/button>\n    \u003cbutton data-v=\"learn\">學習（中英對照）\u003c/button>\n    \u003cbutton data-v=\"practice\">練習（英文直讀）\u003c/button>\n    \u003cbutton data-v=\"exam\">模擬考\u003c/button>\n    \u003cbutton data-v=\"wrong\">錯題本\u003c/button>\n    \u003cbutton data-v=\"vocab\">單字卡\u003c/button>\n    \u003cbutton data-v=\"tips\">讀題技巧\u003c/button>\n    \u003cbutton data-v=\"concepts\">考點清單\u003c/button>\n    \u003cbutton data-v=\"plan\">讀書計畫\u003c/button>\n  \u003c/nav>\n\u003c/header>\n\u003cscript>(function(){var h=document.querySelector(\"header\");function f(){document.documentElement.style.setProperty(\"--zr-hdr\",h.offsetHeight+\"px\");}f();new ResizeObserver(f).observe(h);})();\u003c/script>\n\u003cmain id=\"app\">\u003c/main>\n\u003cdiv id=\"tip\" class=\"tip\" hidden>\u003c/div>\n/*__EXAM_DATA__*/\u003cscript>\n\"use strict\";\nconst BANK = window.__EXAM.BANK;\nconst CONCEPTS = window.__EXAM.CONCEPTS;\nconst BUILD_INFO = {\"note\": \"題庫版本 527 題（第一批 129 題＋第二批 142 題＋考點補題 139 題＋第二輪考點補題 117 題：Haiku／Sonnet／Opus／Fable 出題、交叉審查後收錄），依官方 Exam Guide v1.0（2026-07）出題。\"};\nconst QGLOSS = window.__EXAM.QGLOSS;\n\nconst DOMAINS = {\n  1:{en:\"Solution Design & Architecture\", zh:\"解決方案設計與架構\", w:17},\n  2:{en:\"Claude Models, Prompting & Context Engineering\", zh:\"模型、提示與上下文工程\", w:13},\n  3:{en:\"Integration\", zh:\"整合\", w:19},\n  4:{en:\"Evaluation, Testing & Optimization\", zh:\"評估、測試與優化\", w:16},\n  5:{en:\"Governance, Safety & Risk Management\", zh:\"治理、安全與風險管理\", w:14},\n  6:{en:\"Stakeholder Communication & Lifecycle Management\", zh:\"利害關係人溝通與生命週期\", w:14},\n  7:{en:\"Developer Productivity & Operational Enablement\", zh:\"開發者生產力與維運賦能\", w:7}\n};\nconst TASKS = window.__EXAM.TASKS;\n\n/* 題幹常用字：分類 q=題目限定詞 a=架構效能 s=安全治理 e=評估維運 c=溝通流程 r=RAG與上下文 */\nconst CORE_VOCAB = window.__EXAM.CORE_VOCAB;\nconst CORE_CAT = {q:\"題目限定詞與常用字\", a:\"架構與效能\", s:\"安全與治理\", e:\"評估與維運\", c:\"溝通與流程\", r:\"RAG 與上下文\"};\n\n/* ---------- storage ---------- */\nconst STORE_KEY = \"ccarp-mock-v1\";\nlet DB = {att:{}, wrong:{}, vk:{}, exams:[], plan:{}, examDate:\"\", fs:18, theme:\"\"};\nfunction load(){ try{ const s = localStorage.getItem(STORE_KEY); if(s) DB = Object.assign(DB, JSON.parse(s)); }catch(e){} }\nfunction save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(DB)); }catch(e){} }\nload();\n\n/* ---------- helpers ---------- */\nconst $ = s => document.querySelector(s);\nconst app = $(\"#app\");\nconst esc = s => String(s ?? \"\").replace(/[&\u003c>\"']/g, c => ({\"&\":\"&amp;\",\"\u003c\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));\nconst QBYID = Ob
